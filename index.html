<style>
/* ==== TASARIM SİSTEMİ ====
   Renkler CSS değişkeni olarak. Açık tema :root'ta tam tanımlı; koyu tema hem sistem
   tercihinde hem de data-theme="dark" ile yeniden tanımlanıyor. Hiçbir renk yalnızca
   koyu tema bloğunda tanımlı değil. */

:root {
  --bg:#EDEFEE;  --surface:#F8F9F8;  --sunk:#E7EBE9;
  --ink:#141A19; --ink2:#414B49;     --ink3:#6C7775;
  --line:#D2D8D6; --line-strong:#B9C2BF;
  --copper:#A6512A; --copper-tint:#F0DED3;
  --patina:#2C6E64; --patina-tint:#D9E6E2;
  --warn:#8A6410;   --warn-tint:#F0E5CC;
  --crit:#8E3140;   --crit-tint:#F2DCDF;

  /* Tipografi ölçeği — dışına çıkılmaz */
  --t11:11px; --t125:12.5px; --t14:14px; --t16:16px;
  --t19:19px; --t24:24px; --t32:32px; --t44:44px;

  /* Boşluk ölçeği — ara değer yok */
  --s4:4px; --s8:8px; --s12:12px; --s16:16px;
  --s24:24px; --s32:32px; --s48:48px; --s64:64px;

  --gecis:160ms ease-out;
  --dokunma:44px;               /* en küçük dokunma hedefi */

  --yazi-baslik:'Archivo', system-ui, sans-serif;
  --yazi-govde:'IBM Plex Sans', system-ui, sans-serif;
  --yazi-mono:'IBM Plex Mono', ui-monospace, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#121615;  --surface:#1A201F;  --sunk:#161C1B;
    --ink:#E8EDEB; --ink2:#AEBAB7;     --ink3:#7C8886;
    --line:#2C3533; --line-strong:#3C4644;
    --copper:#E09258; --copper-tint:#3A2519;
    --patina:#6FB3A6; --patina-tint:#16302C;
    --warn:#D2A345;   --warn-tint:#33290F;
    --crit:#D97A85;   --crit-tint:#361A1F;
  }
}

:root[data-theme="dark"] {
  --bg:#121615;  --surface:#1A201F;  --sunk:#161C1B;
  --ink:#E8EDEB; --ink2:#AEBAB7;     --ink3:#7C8886;
  --line:#2C3533; --line-strong:#3C4644;
  --copper:#E09258; --copper-tint:#3A2519;
  --patina:#6FB3A6; --patina-tint:#16302C;
  --warn:#D2A345;   --warn-tint:#33290F;
  --crit:#D97A85;   --crit-tint:#361A1F;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--t14)/1.6 var(--yazi-govde);
  -webkit-text-size-adjust: 100%;
}

/* Odak halkası: outline sıfırlanmıyor, kendi halkamız tanımlanıyor. */
:focus-visible {
  outline: 2px solid var(--copper);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---- Düzen ---- */
.kabuk {
  max-width: 1180px;
  margin: 0 auto;
  padding: var(--s16);
  display: flex;
  flex-direction: column;
  gap: var(--s24);
}

.ust {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s12);
  padding-bottom: var(--s12);
  border-bottom: 1px solid var(--line-strong);
}
.ust h1 {
  font: 700 var(--t24)/1.15 var(--yazi-baslik);
  margin: 0;
  text-wrap: balance;
}
.ust p {
  margin: var(--s4) 0 0;
  color: var(--ink3);
  font-size: var(--t125);
  max-width: 65ch;
}
@media (min-width: 720px) { .ust h1 { font-size: var(--t32); } }

/* ---- Segment düğmesi (dil) ---- */
.segment { display: flex; border: 1px solid var(--line-strong); }
.segment button {
  min-height: var(--dokunma);
  min-width: var(--dokunma);
  padding: 0 var(--s12);
  border: 0;
  background: var(--surface);
  color: var(--ink2);
  font: 600 var(--t125)/1 var(--yazi-govde);
  letter-spacing: .08em;
  cursor: pointer;
  transition: background var(--gecis), color var(--gecis);
}
.segment button + button { border-left: 1px solid var(--line-strong); }
.segment button[aria-pressed="true"] { background: var(--copper-tint); color: var(--copper); }

/* ---- Bölüm başlıkları ---- */
.bolum { display: flex; flex-direction: column; gap: var(--s12); }
.bolum-basligi {
  font: 600 var(--t11)/1 var(--yazi-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink3);
  margin: 0;
}

/* ---- Girdi paneli ---- */
.panel {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: var(--s12);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  gap: var(--s12) var(--s16);
}
.panel[hidden] { display: none; }

.alan { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.alan label, .alan .etiket {
  font: 500 var(--t11)/1.2 var(--yazi-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink3);
  /* İki satıra taşan etiketlerde kutular hizada kalsın */
  min-height: calc(2 * 1.2 * var(--t11));
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 0 var(--s4);
}
.alan .birim { color: var(--ink3); font-weight: 400; letter-spacing: 0; text-transform: none; }

input[type="number"], input[type="text"], textarea, select {
  font: 500 var(--t16)/1 var(--yazi-mono);   /* sayısal değerler mono */
  color: var(--ink);
  background: var(--sunk);
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  min-height: var(--dokunma);
  padding: 0 var(--s8);
  width: 100%;
  min-width: 0;
  transition: border-color var(--gecis), background var(--gecis);
}
/* Cümle ve kontrol metinleri Sans; mono yalnızca sayı, etiket ve formül için. */
select, textarea { font-family: var(--yazi-govde); font-weight: 400; }
::placeholder { font-family: var(--yazi-govde); color: var(--ink3); opacity: 1; }
textarea {
  padding: var(--s8);
  line-height: 1.6;
  resize: vertical;
  min-height: 72px;
  font-size: var(--t14);
  font-family: var(--yazi-mono);   /* içine çap dizisi yazılır */
}
input[type="number"]:hover, select:hover, textarea:hover { border-color: var(--ink3); }
input:disabled, select:disabled, textarea:disabled { color: var(--ink3); background: var(--bg); cursor: not-allowed; }

/* Tarayıcının sayı okları ve select oku gizleniyor; kendi görünümümüz kullanılıyor. */
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.secim { position: relative; display: flex; }
select { appearance: none; -webkit-appearance: none; padding-right: var(--s32); }
.secim svg { position: absolute; right: var(--s8); top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink3); }

/* ---- Düğmeler ---- */
.dugme {
  min-height: var(--dokunma);
  padding: 0 var(--s12);
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  background: var(--surface);
  color: var(--ink);
  font: 500 var(--t125)/1 var(--yazi-govde);
  cursor: pointer;
  transition: background var(--gecis), border-color var(--gecis), color var(--gecis);
}
.dugme:hover { background: var(--sunk); border-color: var(--ink3); }
.dugme[aria-pressed="true"] { border-color: var(--copper); color: var(--copper); background: var(--copper-tint); }
.dugme.sessiz { border-color: var(--line); color: var(--ink2); font-size: var(--t11); min-height: var(--dokunma); }

.dugme-sirasi { display: flex; flex-wrap: wrap; gap: var(--s8); }

/* ---- Bölüm başlığı satırı ve kapalı panel özeti ---- */
.baslik-satiri { display: flex; align-items: center; justify-content: space-between; gap: var(--s12); }
.ozet {
  margin: 0;
  padding: var(--s12);
  border: 1px solid var(--line);
  background: var(--surface);
  font: 500 var(--t14)/1.4 var(--yazi-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.ozet .ayrac { color: var(--ink3); padding: 0 var(--s4); }
.ozet .sozcuk { font-family: var(--yazi-govde); font-weight: 400; color: var(--ink2); }

/* ---- Pas sayısı alanı ---- */
.pas-sayisi-satiri { display: flex; flex-wrap: wrap; gap: var(--s8); align-items: stretch; }
.pas-sayisi-satiri input { flex: 1 1 96px; }
.pas-sayisi-satiri .dugme { flex: 0 1 auto; white-space: nowrap; }
.ipucu { font: 400 var(--t11)/1.4 var(--yazi-mono); color: var(--ink3); }
.gerekce { font-size: var(--t125); color: var(--ink3); margin: 0; max-width: 65ch; }

/* ---- Onay kutusu ---- */
.kutu { display: inline-flex; align-items: center; justify-content: center;
        min-width: var(--dokunma); min-height: var(--dokunma); cursor: pointer; }
.kutu input { position: absolute; opacity: 0; width: 0; height: 0; }
.kutu .gorsel {
  width: 18px; height: 18px; border: 1px solid var(--line-strong); border-radius: 2px;
  background: var(--sunk); display: inline-flex; align-items: center; justify-content: center;
  transition: background var(--gecis), border-color var(--gecis);
}
.kutu .gorsel svg { opacity: 0; color: var(--copper); transition: opacity var(--gecis); }
.kutu input:checked + .gorsel { border-color: var(--copper); background: var(--copper-tint); }
.kutu input:checked + .gorsel svg { opacity: 1; }
.kutu input:focus-visible + .gorsel { outline: 2px solid var(--copper); outline-offset: 2px; }

/* ---- Özet şeridi ---- */
.serit {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.serit .hucre {
  background: var(--surface);
  padding: var(--s12);
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  min-width: 0;
}
.serit .etiket {
  font: 500 var(--t11)/1.2 var(--yazi-mono);
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink3);
}
.serit .deger {
  font: 600 var(--t24)/1 var(--yazi-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  display: flex; align-items: baseline; gap: var(--s4); flex-wrap: wrap;
}
.serit .deger .birim { font: 400 var(--t125)/1 var(--yazi-mono); color: var(--ink3); }
.serit .not { font: 400 var(--t11)/1.3 var(--yazi-govde); color: var(--ink3); }
.serit .hucre.crit .deger { color: var(--crit); }
.serit .hucre.warn .deger { color: var(--warn); }
.serit .hucre.ok   .deger { color: var(--patina); }

/* ---- Öneri cümlesi ---- */
.oneri {
  margin: 0;
  padding: var(--s12);
  border: 1px solid var(--line-strong);
  border-left: 2px solid var(--copper);
  background: var(--surface);
  font-size: var(--t14);
  color: var(--ink);
  max-width: 80ch;
  display: flex; flex-direction: column; gap: var(--s8);
}
.oneri b { font-weight: 600; }
.oneri .sayi { font-family: var(--yazi-mono); font-variant-numeric: tabular-nums; }

/* ---- Karşılaştırma ---- */
.degisen {
  margin: 0;
  padding: var(--s8) var(--s12);
  border: 1px solid var(--warn);
  background: var(--warn-tint);
  color: var(--ink);
  font-size: var(--t125);
}
.degisen.temiz { border-color: var(--line-strong); background: var(--sunk); color: var(--ink2); }

.karsilastirma td, .karsilastirma th { text-align: right; }
.karsilastirma td:first-child, .karsilastirma th:first-child { text-align: left; }
.karsilastirma tbody tr:last-child td { border-bottom: 0; font-weight: 600; }
.karsilastirma .fark-iyi { color: var(--patina); }
.karsilastirma .fark-kotu { color: var(--crit); }

/* ---- Tablo ---- */
.tablo-kabi { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: var(--s8) var(--s4); text-align: right; white-space: nowrap; }
/* İki kelimelik başlıklar alt satıra sarsın; sütunlar dar kalsın, sayılar sarmasın. */
thead th { white-space: normal; max-width: 96px; }
th:first-child, td:first-child, th:last-child, td:last-child { text-align: left; }
thead th {
  font: 500 var(--t11)/1.3 var(--yazi-mono);
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink3);
  border-bottom: 1px solid var(--line-strong); vertical-align: bottom;
}
thead th .birim { display: block; color: var(--ink3); font-weight: 400; letter-spacing: 0; text-transform: none; }
tbody td {
  font: 400 var(--t125)/1 var(--yazi-mono);
  font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
tbody tr:hover td, tbody tr:active td { background: var(--sunk); }
tbody td.ikincil { color: var(--ink2); }
/* Eşik renkleri. Renk tek başına bilgi taşımaz: uyarı ve tehlike hücrelerinde
   ayrıca simge ve okunabilir durum metni (aria-label) bulunur. */
tbody td.crit { background: var(--crit-tint); color: var(--crit); font-weight: 500; }
tbody td.warn { background: var(--warn-tint); color: var(--warn); font-weight: 500; }
tbody td.ok   { color: var(--patina); }
tbody td { position: relative; }   /* gizli durum metni hücrenin içinde kalsın */
tbody td .durum { display: inline-flex; align-items: center; gap: var(--s4); justify-content: flex-end; }
tbody td .durum svg { flex: none; }

tbody tr.tavlandi td { background: var(--copper-tint); }
tbody tr.tavlandi td:first-child { box-shadow: inset 2px 0 0 var(--copper); }
.tavlama-etiketi { font: 500 var(--t11)/1 var(--yazi-mono); color: var(--copper); letter-spacing: .12em; }

/* ---- Görseller ----
   Bütün renkler tema değişkenlerinden gelir; SVG içinde sabit renk yoktur. */
.gorsel-bolum { display: grid; grid-template-columns: 1fr; gap: var(--s16); }
@media (min-width: 900px) { .gorsel-bolum { grid-template-columns: 1fr 1fr; } }

.gorsel-kutu {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: var(--s12);
  display: flex; flex-direction: column; gap: var(--s8);
  min-width: 0;
}
.gorsel-kutu h3 {
  margin: 0;
  font: 600 var(--t125)/1.2 var(--yazi-govde);
  color: var(--ink);
}
.gorsel-kutu .gorsel-not { font: 400 var(--t11)/1.4 var(--yazi-govde); color: var(--ink3); margin: 0; }
.g-svg { display: block; width: 100%; height: auto; }

.g-aciklama { display: flex; flex-wrap: wrap; gap: var(--s4) var(--s12); }
.g-orn { display: inline-flex; align-items: center; gap: var(--s4);
         font: 400 var(--t11)/1.2 var(--yazi-govde); color: var(--ink2); }
.g-orn-kutu { width: 12px; height: 12px; border: 1px solid transparent; flex: none; }
.g-orn-dayanim { background: var(--ink2); }
.g-orn-gerilme { background: var(--copper); }
.g-orn-pay     { background: var(--patina-tint); border-color: var(--patina); }
.g-orn-crit    { background: var(--crit); }
.g-orn-warn    { background: var(--warn); }
.g-orn-ok      { background: var(--patina); }

/* SVG sınıfları — renk ya var(--...) ya currentColor */
.g-etiket { font: 400 11px var(--yazi-mono); fill: var(--ink3); }
.g-eksen-adi { font: 500 11px var(--yazi-mono); fill: var(--ink3); letter-spacing: .08em; }
.g-deger { font: 500 12px var(--yazi-mono); fill: var(--ink2); }
.g-deger-vurgu { font: 600 12px var(--yazi-mono); fill: var(--copper); }
.g-not { font: 400 11px var(--yazi-govde); fill: var(--ink3); }
.g-izgara { stroke: var(--line); stroke-width: 1; }
.g-eksen { stroke: var(--line-strong); stroke-width: 1; }
.g-merkez { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 4 4; }
.g-dayanim { stroke: var(--ink2); stroke-width: 2; }
.g-gerilme { stroke: var(--copper); stroke-width: 2; }
.g-pay { fill: var(--patina); opacity: .16; }
.g-bant { fill: var(--copper); opacity: .22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .g-pay { opacity: .24; } }
:root[data-theme="dark"] .g-pay { opacity: .24; }
.g-nokta-gerilme { fill: var(--copper); }
.g-nokta-dayanim { fill: var(--ink2); }
.g-tavlama { stroke: var(--copper); stroke-width: 1; stroke-dasharray: 3 3; }
.g-tavlama-etiket { font: 500 11px var(--yazi-mono); fill: var(--copper); }
.g-bar-ok { fill: var(--patina); }
.g-bar-warn { fill: var(--warn); }
.g-bar-crit { fill: var(--crit); }
.g-bar-vurgu { stroke: var(--ink); stroke-width: 1.5; }
.g-esik-crit { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 5 3; }
.g-esik-crit-etiket { font: 500 11px var(--yazi-mono); fill: var(--crit); }
.g-esik-warn { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 5 3; }
.g-esik-warn-etiket { font: 500 11px var(--yazi-mono); fill: var(--warn); }
.g-profil { fill: var(--copper-tint); }
.g-profil-kenar { stroke: var(--copper); stroke-width: 1.5; }
.g-profil-kalip { stroke: var(--copper); stroke-width: 1; opacity: .5; }
.g-tel { fill: var(--copper-tint); stroke: var(--copper); stroke-width: 1.5; }
.g-kalip { fill: var(--sunk); stroke: var(--line-strong); stroke-width: 1.5; }
.g-aci { stroke: var(--copper); stroke-width: 1.5; }
.g-olcu { stroke: var(--ink3); stroke-width: 1; }
.g-olcu-ince { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.g-ok { stroke: var(--copper); stroke-width: 2; }

/* Kaydırıcı — tarayıcı varsayılanı kullanılmaz, kendi rayı ve tutamağı */
.kaydirici-satiri { display: flex; align-items: center; gap: var(--s12); flex-wrap: wrap; }
.kaydirici-alan { display: flex; flex-direction: column; gap: var(--s4); flex: 1 1 160px; min-width: 0; }
.kaydirici-basligi { display: flex; justify-content: space-between; gap: var(--s8);
  font: 500 var(--t11)/1.2 var(--yazi-mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink3); }
.kaydirici-basligi .deger { font-family: var(--yazi-mono); color: var(--ink); letter-spacing: 0; }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; min-height: var(--dokunma); background: transparent; margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border: 1px solid var(--line-strong); border-radius: 2px;
  background: linear-gradient(to right, var(--copper) 0 var(--dolgu, 50%), var(--sunk) var(--dolgu, 50%) 100%);
}
input[type="range"]::-moz-range-track {
  height: 4px; border: 1px solid var(--line-strong); border-radius: 2px;
  background: linear-gradient(to right, var(--copper) 0 var(--dolgu, 50%), var(--sunk) var(--dolgu, 50%) 100%);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; margin-top: -8px; border-radius: 2px;
  background: var(--surface); border: 2px solid var(--copper); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 2px;
  background: var(--surface); border: 2px solid var(--copper); cursor: pointer;
}
tbody tr.secili td { box-shadow: inset 0 0 0 1px var(--copper); }

/* ---- Güven katmanı: sekmeler, testler, formüller ---- */
.sekme-satiri { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line-strong); }
.sekme-satiri button {
  min-height: var(--dokunma); padding: 0 var(--s16);
  border: 1px solid transparent; border-bottom: 0; background: transparent;
  color: var(--ink2); font: 500 var(--t125)/1 var(--yazi-govde); cursor: pointer;
  transition: color var(--gecis), background var(--gecis);
}
.sekme-satiri button:hover { background: var(--sunk); color: var(--ink); }
.sekme-satiri button[aria-selected="true"] {
  background: var(--surface); border-color: var(--line-strong); color: var(--copper);
  margin-bottom: -1px; border-bottom: 1px solid var(--surface);
}
.sekme-paneli { border: 1px solid var(--line); border-top: 0; background: var(--surface);
  padding: var(--s16); display: flex; flex-direction: column; gap: var(--s16); }
.sekme-paneli h3 { margin: 0; font: 600 var(--t14)/1.2 var(--yazi-govde); color: var(--ink); }
.sekme-paneli p { margin: 0; font-size: var(--t125); color: var(--ink2); max-width: 72ch; }
.sekme-paneli ul { margin: 0; padding-left: var(--s16); font-size: var(--t125); color: var(--ink2);
  display: flex; flex-direction: column; gap: var(--s4); max-width: 72ch; }

/* Sekme içi tablolar metin taşır: satırlar sarar, sayılar sağa hizalanır. */
.sekme-paneli td, .sekme-paneli th {
  white-space: normal; text-align: left; vertical-align: top;
  font-family: var(--yazi-govde); font-size: var(--t125);
}
.sekme-paneli thead th { font-family: var(--yazi-mono); }
.sekme-paneli td.mono, .sekme-paneli td.sayi {
  font-family: var(--yazi-mono); font-variant-numeric: tabular-nums;
}
.sekme-paneli td.sayi { text-align: right; white-space: nowrap; }
.sekme-paneli td.aciklama { max-width: 38ch; color: var(--ink3); }
.sekme-paneli td.durum-hucresi { text-align: right; white-space: nowrap; }

.rozet { display: inline-block; padding: 2px var(--s8); border: 1px solid currentColor;
  font: 600 var(--t11)/1.4 var(--yazi-mono); letter-spacing: .08em; }
.rozet.gecti { color: var(--patina); }
.rozet.kaldi { color: var(--crit); }
tbody td.ok { color: var(--patina); }

.formul { display: flex; flex-direction: column; gap: var(--s4); padding: var(--s12) 0;
  border-top: 1px solid var(--line); }
.formul:first-child { border-top: 0; }
.formul code { font: 500 var(--t14)/1.5 var(--yazi-mono); color: var(--ink);
  background: var(--sunk); border: 1px solid var(--line); padding: var(--s8); display: block;
  overflow-x: auto; }
.formul-alt { font: 400 var(--t11)/1.5 var(--yazi-govde); color: var(--ink3); }

/* ---- Belirsizlik bandı ---- */
.bant-kutusu { border: 1px solid var(--line); background: var(--surface); padding: var(--s12);
  display: flex; flex-direction: column; gap: var(--s12); }
.bant-satiri { display: flex; flex-wrap: wrap; gap: var(--s12); }
.bant-alan { display: flex; flex-direction: column; gap: var(--s4); flex: 1 1 150px; min-width: 0; }
.bant-alan .ikili { display: flex; gap: var(--s8); }
.bant-anahtari { display: flex; align-items: center; gap: var(--s8); cursor: pointer;
  font: 500 var(--t125)/1 var(--yazi-govde); color: var(--ink); min-height: var(--dokunma); }
.bant-deger { white-space: nowrap; }
.bant-koseler { border: 0; padding: 0; gap: var(--s8); }

/* ---- Tornado ---- */
.g-tornado { fill: var(--copper); }
.g-tornado-sifir { fill: var(--line-strong); }

/* ---- Pas kartları (dar ekran) ---- */
.kart-listesi { display: flex; flex-direction: column; gap: var(--s8); }
.pas-karti {
  border: 1px solid var(--line); background: var(--surface);
  padding: var(--s12); display: flex; flex-direction: column; gap: var(--s8);
}
.pas-karti.tavlandi { border-left: 2px solid var(--copper); background: var(--copper-tint); }
.pas-karti .kart-ust { display: flex; align-items: center; justify-content: space-between; gap: var(--s8); }
.pas-karti .kart-no {
  font: 500 var(--t11)/1 var(--yazi-mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink3);
}
.pas-karti .kart-tavlama { display: flex; align-items: center; gap: var(--s4);
  font: 500 var(--t11)/1 var(--yazi-mono); color: var(--copper); letter-spacing: .08em; }
.pas-karti .kart-orta { display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s12); flex-wrap: wrap; }
.pas-karti .kart-cap {
  font: 600 var(--t19)/1 var(--yazi-mono); font-variant-numeric: tabular-nums; color: var(--ink);
}
.pas-karti .kart-cap .birim { font: 400 var(--t125)/1 var(--yazi-mono); color: var(--ink3); }
.rozet-emniyet {
  display: inline-flex; align-items: center; gap: var(--s4);
  padding: var(--s4) var(--s8); border: 1px solid currentColor;
  font: 600 var(--t16)/1 var(--yazi-mono); font-variant-numeric: tabular-nums;
}
.rozet-emniyet.ok { color: var(--patina); }
.rozet-emniyet.warn { color: var(--warn); background: var(--warn-tint); }
.rozet-emniyet.crit { color: var(--crit); background: var(--crit-tint); }
.kart-ikincil { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4) var(--s12); margin: 0; }
.kart-ikincil div { display: flex; justify-content: space-between; gap: var(--s8); min-width: 0; }
.kart-ikincil dt { font: 400 var(--t11)/1.4 var(--yazi-govde); color: var(--ink3); }
.kart-ikincil dd {
  margin: 0; font: 400 var(--t125)/1.4 var(--yazi-mono);
  font-variant-numeric: tabular-nums; color: var(--ink2); white-space: nowrap;
}
.kart-ikincil dd.warn { color: var(--warn); }
.kart-ikincil dd.crit { color: var(--crit); }

/* ---- Kimlik başlığı ---- */
.ust-kontroller { display: flex; gap: var(--s8); align-items: stretch; }
.kimlik {
  display: flex; flex-wrap: wrap; gap: var(--s4) var(--s12); align-items: baseline;
  font-size: var(--t125); color: var(--ink3);
  border-bottom: 1px solid var(--line); padding-bottom: var(--s12);
}
.kimlik-ad { font: 600 var(--t14)/1.2 var(--yazi-govde); color: var(--ink); }
.kimlik-unvan { color: var(--ink2); }
.kimlik-bag { color: var(--copper); text-decoration: none; border-bottom: 1px solid var(--copper); }
.kimlik-bag:hover { color: var(--ink); border-color: var(--ink); }
.muafiyet { font-size: var(--t11); color: var(--ink3); }
.alt-metin { display: flex; flex-direction: column; gap: var(--s4); }

/* ---- Alt not ---- */
.alt-not {
  border-top: 1px solid var(--line-strong);
  padding-top: var(--s12);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s12);
  justify-content: space-between;
}
.alt-not p { margin: 0; font-size: var(--t125); color: var(--ink3); max-width: 72ch; }

/* ---- Hata / bilgi kutusu ---- */
.uyari {
  border: 1px solid var(--crit); background: var(--crit-tint); color: var(--ink);
  padding: var(--s12); font-size: var(--t125);
}
.bilgi {
  border: 1px solid var(--line-strong); background: var(--sunk); color: var(--ink2);
  padding: var(--s12); font-size: var(--t125);
}
[hidden] { display: none !important; }

/* Ekran okuyucuya açık, gözle görünmez metin (durum açıklamaları) */
.gorsel-gizli {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* Geniş ekranda yöntem ve pas sayısı iki sütun kaplasın (metinleri uzun) */
@media (min-width: 720px) {
  .alan.genis { grid-column: span 2; }
}

/* ---- Yazdırma: iki sayfa ----
   Sayfa 1: kimlik, girdiler, özet, ana grafik, pas tablosu.
   Sayfa 2: bant köşeleri, doğrulama ve kabuller.
   Renkler yazdırmada her zaman açık temadan gelir. */
@media print {
  :root, :root[data-theme="dark"] {
    --bg:#fff; --surface:#fff; --sunk:#f4f5f4;
    --ink:#111; --ink2:#333; --ink3:#555;
    --line:#ccc; --line-strong:#999;
    --copper:#8a4423; --copper-tint:#f4e7de;
    --patina:#245b53; --patina-tint:#e2eeeb;
    --warn:#6f5010; --warn-tint:#f5eddb;
    --crit:#7a2937; --crit-tint:#f6e3e6;
  }
  @page { size: A4; margin: 9mm 9mm; }
  body { background: #fff; font-size: 10px; }
  .kabuk { max-width: none; padding: 0; gap: var(--s8); display: block; }
  .kabuk > * { margin-bottom: var(--s8); }
  .ust h1 { font-size: 18px; }
  .ust p { display: none; }
  .bolum-basligi { font-size: 9px; }
  .panel { padding: var(--s8); gap: var(--s4) var(--s8); }
  .serit .deger { font-size: 15px; }
  .serit .hucre { padding: var(--s8); }
  th, td { padding: 3px 4px; font-size: 9px !important; }
  .sekme-paneli { padding: var(--s8); gap: var(--s8); }
  .sekme-paneli td, .sekme-paneli th { font-size: 9px !important; }
  .sekme-paneli td.aciklama { max-width: 30ch; }
  .gorsel-kutu { padding: var(--s8); }
  .oneri { padding: var(--s8); font-size: 10px; }
  .bant-kutusu { padding: var(--s8); gap: var(--s8); }
  .gerekce, .ipucu { font-size: 9px; }

  /* Kontroller ve etkileşimli parçalar basılmaz */
  .ust-kontroller, #senaryoDugmeleri, #panelKatla, .dugme-sirasi, .sekme-satiri,
  #bantAlanlari, .kaydirici-satiri, #paylasimDurumu, .alt-not .dugme { display: none !important; }

  /* Sayfa 1'de yalnızca ana grafik kalır */
  .gorsel-bolum .gorsel-kutu:not(:first-child) { display: none; }
  .gorsel-bolum { grid-template-columns: 1fr; }

  /* Sayfa düzeni: 1 — kimlik, girdiler, özet, ana grafik, pas tablosu;
                   2 — belirsizlik köşeleri, doğrulama özeti, kabuller. */
  /* DOM sırası zaten yazdırma sırası: sayfa 2 belirsizlik bandıyla başlar. */
  #bantBolumu { break-before: page; }
  #senaryoBolumu, #hataKutusu, #bilgiKutusu { display: none !important; }

  .sekme-paneli[hidden] { display: flex !important; }
  #bantKoseler[hidden] { display: flex !important; }
  /* Formüller sekmesi basılmaz — özgülük sırası gereği bu kural sonra gelir */
  #guvenBolumu [data-panel="formuller"] { display: none !important; }

  /* Sıkıştırma: yazdırmada girdi paneli ve özet şeridi daha küçük */
  #girdiBolumu .gerekce, #pasSayisiIpucu, #yontemGerekcesi,
  #bantBolumu .gerekce, .bant-anahtari { display: none !important; }
  input, select, textarea { min-height: 22px !important; font-size: 10px !important; }
  .serit .deger { font-size: 13px; }
  .serit .hucre { padding: var(--s8) var(--s8); }
  .sekme-paneli ul { gap: 2px; }
  .sekme-paneli p, .sekme-paneli li { font-size: 9px; }
  .alt-not { padding-top: var(--s8); }
  .alt-not p { font-size: 8.5px; }
  #bantKoseler .ipucu { font-size: 8.5px; }
  #bantBolumu thead th, #bantBolumu tbody td { padding: 1px 4px; }
  [data-panel="kabuller"] li, [data-panel="kabuller"] p { line-height: 1.3; font-size: 8.5px; }
  .sekme-paneli { gap: var(--s4); }

  /* Grafik, tek sütunda oransal olarak büyümesin */
  .gorsel-kutu svg.g-svg { height: 196px; width: auto; max-width: 100%; }

  /* Tablo satırları: dokunma hedefi yazdırmada gerekmez */
  .kutu { min-height: 0 !important; min-width: 0 !important; }
  .kutu .gorsel { display: none; }
  tbody td { padding: 2px 4px; }

  /* Doğrulama özeti: test tablosu yeter, açıklama sütunu ve referans tablosu değil */
  .sekme-paneli td.aciklama, .sekme-paneli th:nth-child(3),
  [data-panel="dogrulama"] > h3, #referansBaslikSatiri, #referansGovde { display: none !important; }
  [data-panel="dogrulama"] > .tablo-kabi:last-of-type { display: none !important; }

  /* Duyarlılık, manuel giriş, formüller ve karşılaştırma basılmaz:
     hedef iki sayfa — mühendislik özeti ve arkasında güven katmanı. */
  #duyarlilikBolumu, #manuelBolumu, [data-panel="formuller"],
  #karsilastirmaKabi, #degisenGirdiler { display: none !important; }

  .panel { break-inside: avoid; }
  table { break-inside: auto; }
  tr, .pas-karti, .formul, .gorsel-kutu { break-inside: avoid; }
  .tablo-kabi { overflow: visible; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9px; color: #555; }
}

/* ---- Dar ekran ---- */
@media (max-width: 719px) {
  .kabuk { padding: var(--s12); gap: var(--s16); }
}
</style>
</head>

<script>
/* ============================================================================
   TEL ÇEKME PAS PROGRAMI HESAPLAYICISI
   Barış Kırlı — bağımsız mühendislik çalışması — MIT lisansı

   NE YAPAR
   Bakır filmaşinden (8 mm) ince tele inen çekme hattı için pas programı kurar,
   her pasta çekme gerilmesini ve kopma riskini hesaplar, sonucun belirsizliğini
   de birlikte raporlar.

   KULLANILAN MODEL
     - Çekme gerilmesi : Siebel yaklaşımı — şekil verme + sürtünme + fazlalık iş
                         sigma_d = sigmaBar * ((1 + mu/alpha)*eps + (2/3)*alpha)
     - Pekleşme        : Hollomon, sigma_f = max(K * eps^n, 70 MPa)
                         Birikmiş gerinim taşınır, ara tavlamada sıfırlanır.
     - Ortalama akma   : Hollomon'un pas boyunca integrali
     - Emniyet oranı   : sigma_d / sigma_f,çıkış   (0,60 üstü kopma riski)
     - Delta faktörü   : alpha*(1+sqrt(1-r))^2/r  (1,5–3,0 arası uygun)
     - Adyabatik ΔT    : sigma_d / (rho*cp)       (üst sınırdır)
     - Hız zincirlenir : pas i'nin girişi, pas i-1'in çıkışı; kütle debisi sabit.

   PAS DAĞITIM YÖNTEMLERİ
     equalStrain (eşit gerinim) · tapered (kademeli azalan) · equalSafety
     (eşit emniyet, hedefi tutan en küçük pas sayısı) · manuel çap dizisi.

   DOĞRULAMA
   Sekiz test sayfa her açıldığında canlı çalışır (Doğrulama sekmesi): sıfır
   limiti, alt sınır, teorik maksimum, kütle korunumu, iki yöntemin otomatik pas
   sayısı, toplam iş / ideal iş oranı ve emniyet oranının K'dan bağımsızlığı.

   SINIRLAR
   Ön tasarım aracıdır, üretim reçetesi değildir. Kalıp esnemesi, yağ filmi
   rejimi, geri gerilim, şekil değiştirme hızı, kalıp aşınması ve artık
   gerilmeler hesaba katılmaz. Tamamı: Kabuller sekmesi ve docs/kabuller.md.

   KAYNAKLAR
   G. E. Dieter, Mechanical Metallurgy (3. baskı) · S. Kalpakjian & S. Schmid,
   Manufacturing Engineering and Technology · B. Avitzur, Metal Forming ·
   J. G. Wistreich, The Fundamentals of Wire Drawing, Metallurgical Reviews (1958).

   YAPISI
   Tek dosya, sıfır bağımlılık, çevrimdışı çalışır. Sıra: hesap çekirdeği (saf
   fonksiyonlar, DOM'a dokunmaz) · doğrulama · belirsizlik ve duyarlılık · metin
   sözlüğü · durum · biçimlendirme · eşikler ve öneri · arayüz kurulumu · olaylar ·
   çizim · tema, bağlantı ve CSV · başlangıç.
   ========================================================================== */

'use strict';

/* ==== HESAP ÇEKİRDEĞİ ====
   Saf fonksiyonlar. DOM'a dokunmaz, yan etkisi yoktur. */

// --- Malzeme ve proses sabitleri ---
const RHO       = 8960;   // kg/m3   bakır yoğunluğu
const CP        = 385;    // J/(kg·K) bakır özgül ısı
const SIGMA_Y0  = 70;     // MPa      tavlanmış ETP bakır akma gerilmesi tabanı

// --- Pas programı sabitleri ---
const MAX_R_PER_PASS    = 0.20;          // eşit gerinim / kademeli azalanda otomatik N için
                                         // pas başına maks kesit azalma (baş parmak kuralı)
const TAPER_RATIO       = 0.65;          // kademeli azalanda son pasın ilk pasa gerinim oranı
const TARGET_SAFETY     = 0.50;          // eşit emniyet yönteminin hedefi
const DAR_PAY_ORANI     = 0.90;          // emniyet bu oranın üstündeyse "pay dar" denir
const R_THEORETICAL_MAX = 1 - 1 / Math.E; // = 0,63212 — tek pasta teorik sınır
const MAX_PASSES        = 60;            // iterasyon güvenlik sınırı

// --- Eşikler (Faz 3'te renklendirme bunları kullanacak) ---
const SAFETY_CRITICAL = 0.60;  // üstü: kopma riski
const SAFETY_WARNING  = 0.50;  // üstü: sınıra yakın
const DELTA_MIN       = 1.5;   // altı: aşırı sürtünme, kalıp aşınması
const DELTA_MAX       = 3.0;   // üstü: merkezi çatlak (chevron) riski
const DT_WARNING      = 100;   // °C üstü: yağ bozunma riski. Hesaplanan ΔT adyabatiktir
                               // (bütün iş ısıya döner, kayıp yok) — yani bir üst sınırdır.

// --- İterasyon ayarları ---
const EPS_PER_PASS_MAX  = -Math.log(1 - R_THEORETICAL_MAX); // teorik maks pas gerinimi
const SAFETY_SEARCH_MIN = 0.05;   // eşit emniyet dış aramasının alt ucu
const SAFETY_SEARCH_MAX = 0.62;   // eşit emniyet dış aramasının üst ucu
const BISECTION_STEPS   = 80;     // ikili arama adım sayısı
const DIAMETER_TOL      = 0.001;  // mm, son pasın hedef çapa oturma toleransı

// --- Belirsizlik bandı varsayılan aralıkları (literatür) ---
const BANT_VARSAYILAN = { K: [380, 520], n: [0.33, 0.45], mu: [0.03, 0.08] };

// --- Manuel dizi ayrıştırma sınırları (akla yatkın çap aralığı) ---
const MANUAL_D_MIN = 0.01;  // mm
const MANUAL_D_MAX = 50;    // mm

/* Hesap hatası. `code` makine tarafı içindir (Faz 2'de METIN sözlüğüne bağlanacak),
   `message` Türkçe insan okunur karşılığıdır. */
class DrawingError extends Error {
  constructor(code, message, info) {
    super(message);
    this.name = 'DrawingError';
    this.code = code;
    this.info = info || {};
  }
}

/* Oran -> Türkçe yüzde metni (ondalık virgül). Hata mesajlarında kullanılır;
   Faz 2'de arayüzün sayı biçimlendiricisi bunun yerini alacak. */
function yuzdeTR(oran) {
  return (oran * 100).toFixed(1).replace('.', ',');
}

/* Bir pasın gerilme büyüklükleri — fiziğin TEK kaynağı.
   Çaptan bağımsızdır: Siebel bağıntısında yalnızca gerinimler, sürtünme ve kalıp açısı geçer.
   Hem calcPass hem eşit emniyet çözücüsü bunu çağırır; formül başka hiçbir yerde tekrarlanmaz. */
function passStress(epsIn, epsPas, { alphaRad, mu, K, n }) {
  const epsOut = epsIn + epsPas;

  // Pas boyunca ortalama akma gerilmesi (Hollomon'un integrali) — tabana tabi değil.
  const sigmaBar = K * (epsOut ** (n + 1) - epsIn ** (n + 1)) / ((n + 1) * epsPas);

  // SIEBEL: şekil verme + sürtünme + fazlalık (redundant) iş
  const sigmaD = sigmaBar * ((1 + mu / alphaRad) * epsPas + (2 / 3) * alphaRad);

  // Hollomon eps=0'da sıfır verir; tavlanmış bakır tabanı uygulanır.
  const sigmaFOut = Math.max(K * epsOut ** n, SIGMA_Y0);

  return { epsOut, sigmaBar, sigmaD, sigmaFOut, safety: sigmaD / sigmaFOut };
}

/* Verilen gerinim için emniyet oranı. Eşit emniyet çözücüsünün iç fonksiyonu. */
function safetyForStrain(epsPas, epsIn, params) {
  return passStress(epsIn, epsPas, params).safety;
}

/* Tek pasın bütün çıktıları. Girdiler: çaplar mm, açı derece, hız m/s, K MPa. */
function calcPass({ d0, d1, epsIn = 0, alphaDeg, mu, K, n, v0 }) {
  if (!(d0 > 0) || !(d1 > 0)) {
    throw new DrawingError('GECERSIZ_CAP', 'Çaplar sıfırdan büyük olmalı.', { d0, d1 });
  }
  if (d1 >= d0) {
    throw new DrawingError('CIKIS_CAPI_BUYUK',
      'Çıkış çapı giriş çapından küçük olmalı.', { d0, d1 });
  }
  if (!(alphaDeg > 0)) {
    throw new DrawingError('GECERSIZ_ACI', 'Kalıp yarı açısı sıfırdan büyük olmalı.', { alphaDeg });
  }

  const alphaRad = alphaDeg * Math.PI / 180;
  const r = 1 - (d1 / d0) ** 2;

  // Teorik sınır: tek pasta bu azalmanın üstü mümkün değil, hesap durur.
  if (r > R_THEORETICAL_MAX) {
    throw new DrawingError('R_TEORIK_ASIM',
      'Bu pasta %' + yuzdeTR(r) + ' kesit azalma gerekiyor; teorik sınır %' +
      yuzdeTR(R_THEORETICAL_MAX) + '.', { r, d0, d1 });
  }

  const epsPas = 2 * Math.log(d0 / d1);

  // Gerilmeler tek kaynaktan (passStress) gelir.
  const { epsOut, sigmaBar, sigmaD, sigmaFOut, safety } =
    passStress(epsIn, epsPas, { alphaRad, mu, K, n });
  const sigmaFIn = Math.max(K * epsIn ** n, SIGMA_Y0);

  const delta = alphaRad * (1 + Math.sqrt(1 - r)) ** 2 / r;

  // Adyabatik sıcaklık artışı: bütün iş ısıya döner, kayıp yok kabulü — üst sınırdır.
  const dT = sigmaD * 1e6 / (RHO * CP);   // sigmaD MPa -> Pa

  const A0 = Math.PI * d0 ** 2 / 4;           // mm2
  const A1 = Math.PI * d1 ** 2 / 4;           // mm2
  const F  = sigmaD * A1;                     // MPa * mm2 = N
  const v1 = v0 * (d0 / d1) ** 2;             // hacim korunumu
  const P  = F * v1;                          // W

  return { d0, d1, r, epsPas, epsIn, epsOut, sigmaFIn, sigmaFOut, sigmaBar,
           sigmaD, safety, delta, dT, A0, A1, F, v0, v1, P, alphaDeg, mu, K, n };
}

/* Hedef emniyeti veren pas gerinimini ikili aramayla bulur.
   Ulaşılamıyorsa teorik maksimuma kadar açar. */
function strainForSafety(targetSafety, epsIn, params) {
  let lo = 1e-9, hi = EPS_PER_PASS_MAX;
  if (safetyForStrain(hi, epsIn, params) < targetSafety) return hi;
  for (let i = 0; i < BISECTION_STEPS; i++) {
    const mid = (lo + hi) / 2;
    if (safetyForStrain(mid, epsIn, params) < targetSafety) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* Otomatik pas sayısı: pas başına en fazla MAX_R_PER_PASS kesit azalma kabulüyle. */
function autoPassCount(d0, dTarget) {
  const epsTotal = 2 * Math.log(d0 / dTarget);
  const epsMax   = Math.log(1 / (1 - MAX_R_PER_PASS));
  return Math.max(1, Math.ceil(epsTotal / epsMax));
}

/* Eşit gerinim: her pasta aynı gerçek gerinim, dolayısıyla aynı % kesit azalma. */
function strainsEqual(epsTotal, N) {
  return new Array(N).fill(epsTotal / N);
}

/* Kademeli azalan: gerinim ağırlıkları ilk pastan son pasa doğrusal iner.
   Gerekçe: bakır pastan pasa sertleşir ve tel incelir; ikisi de riski artırır. */
function strainsTapered(epsTotal, N) {
  const w = [];
  for (let i = 1; i <= N; i++) {
    w.push(N === 1 ? 1 : 1 - (1 - TAPER_RATIO) * (i - 1) / (N - 1));
  }
  const sumW = w.reduce((a, b) => a + b, 0);
  return w.map(wi => epsTotal * wi / sumW);
}

/* Eşit emniyet: dış döngü hedef emniyet üzerinde, iç döngü pas gerinimi üzerinde
   ikili arama. Ara tavlama, malzemenin gördüğü birikmiş gerinimi sıfırlar.
   Hedefe ulaşılamayan N'lerde hata verilmez; şekil korunarak toplam gerinime ölçeklenir. */
function strainsEqualSafety(epsTotal, N, params, anneals) {
  const strainsFor = (targetSafety) => {
    const eps = [];
    let epsMat = 0;                     // malzemenin gördüğü birikmiş gerinim
    for (let i = 1; i <= N; i++) {
      const e = strainForSafety(targetSafety, epsMat, params);
      eps.push(e);
      epsMat = anneals.includes(i) ? 0 : epsMat + e;
    }
    return eps;
  };

  let lo = SAFETY_SEARCH_MIN, hi = SAFETY_SEARCH_MAX, eps = strainsFor(hi);
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  if (sum(eps) > epsTotal) {                       // hedef aralık içinde: ikili arama
    for (let i = 0; i < BISECTION_STEPS; i++) {
      const mid = (lo + hi) / 2;
      if (sum(strainsFor(mid)) < epsTotal) lo = mid; else hi = mid;
    }
    eps = strainsFor((lo + hi) / 2);
  }

  // Kalan farkı kapat: şekli koru, toplamı hedefe ölçekle (K-04).
  const k = epsTotal / sum(eps);
  return eps.map(e => e * k);
}

/* Gerinim dizisinden çap dizisini kurar; son çap hedefe tam oturur. */
function diametersFromStrains(d0, dTarget, strains) {
  const d = [d0];
  let epsAcc = 0;
  for (let i = 0; i < strains.length; i++) {
    epsAcc += strains[i];
    d.push(i === strains.length - 1 ? dTarget : d0 * Math.exp(-epsAcc / 2));
  }
  return d;
}

/* Pas programını kurar ve her pas için calcPass çağırır.
   `passes` verilmezse (null / "auto") pas sayısı otomatik hesaplanır.
   `method`: "equalStrain" | "tapered" | "equalSafety" | "manual"
   `diameters`: yalnızca "manual" yönteminde, d0 dahil azalan çap dizisi.
   `anneals`: 1-indeksli pas numaraları; o pastan sonra birikmiş gerinim sıfırlanır. */
function buildSchedule({ d0, dTarget, method = 'equalStrain', passes = null, diameters = null,
                         alphaDeg, mu, K, n, v0, anneals = [] }) {
  const anneal = Array.isArray(anneals) ? anneals : [];
  let d, autoN_sonuc = null;   // yöntemine göre hesaplanan otomatik pas sayısı

  if (method === 'manual') {
    if (!Array.isArray(diameters) || diameters.length < 2) {
      throw new DrawingError('MANUEL_DIZI_YOK', 'Manuel pas programı için çap dizisi gerekli.', {});
    }
    d = diameters.slice();
  } else {
    if (!(d0 > 0) || !(dTarget > 0)) {
      throw new DrawingError('GECERSIZ_CAP', 'Çaplar sıfırdan büyük olmalı.', { d0, dTarget });
    }
    if (dTarget >= d0) {
      throw new DrawingError('HEDEF_CAP_BUYUK',
        'Hedef çap başlangıç çapından küçük olmalı.', { d0, dTarget });
    }

    const epsTotal = 2 * Math.log(d0 / dTarget);
    const params   = { alphaRad: alphaDeg * Math.PI / 180, mu, K, n };
    const autoN    = method === 'equalSafety'
      ? autoPassCountEqualSafety(epsTotal, params, anneal)
      : autoPassCount(d0, dTarget);

    let N;
    if (passes === null || passes === undefined || passes === 'auto') {
      N = autoN;
    } else {
      N = Number(passes);
      if (!Number.isInteger(N) || N < 1) {
        throw new DrawingError('GECERSIZ_PAS_SAYISI',
          'Pas sayısı 1 veya daha büyük bir tam sayı olmalı.', { passes });
      }
    }

    const strains = method === 'equalStrain' ? strainsEqual(epsTotal, N)
                  : method === 'tapered'     ? strainsTapered(epsTotal, N)
                  : method === 'equalSafety' ? strainsEqualSafety(epsTotal, N, params, anneal)
                  : null;
    if (!strains) {
      throw new DrawingError('BILINMEYEN_YONTEM', 'Bilinmeyen pas dağıtım yöntemi.', { method });
    }

    // Dağıtım gerçekten toplam gerinime yakınsadı mı? (Çapa bakmak anlamsız: son çap
    // hedefe zaten eşitleniyor; asıl kontrol gerinim toplamında.)
    const sapma = Math.abs(strains.reduce((a, b) => a + b, 0) - epsTotal) / epsTotal;
    if (sapma > 1e-6) {
      throw new DrawingError('YAKINSAMADI',
        'Pas dağıtımı hedef gerinime yakınsamadı.', { sapma, method, N });
    }
    d = diametersFromStrains(d0, dTarget, strains);
    autoN_sonuc = autoN;
  }

  // Pasları sırayla hesapla. İki büyüklük hat boyunca taşınır:
  //   - birikmiş gerinim (tavlamada sıfırlanır),
  //   - hız: pas i'nin giriş hızı, pas i-1'in çıkış hızıdır. Sürekli bir hatta
  //     bütün kalıplardan aynı kütle geçer; kütle debisi sabit kalmalıdır.
  const list = [];
  let epsIn = 0;
  let hiz = v0;                 // hat girişi hızı (8 mm filmaşin)
  for (let i = 0; i < d.length - 1; i++) {
    const no = i + 1;
    let pass;
    try {
      pass = calcPass({ d0: d[i], d1: d[i + 1], epsIn, alphaDeg, mu, K, n, v0: hiz });
    } catch (err) {
      if (err instanceof DrawingError && err.code === 'R_TEORIK_ASIM') {
        throw new DrawingError('R_TEORIK_ASIM',
          'Bu pas sayısıyla ' + no + '. pasta %' + yuzdeTR(err.info.r) +
          ' kesit azalma gerekiyor; teorik sınır %' + yuzdeTR(R_THEORETICAL_MAX) +
          '. Pas sayısını artırın.',
          Object.assign({ pas: no }, err.info));
      }
      throw err;
    }
    pass.no = no;
    pass.anneal = anneal.includes(no);
    list.push(pass);
    epsIn = pass.anneal ? 0 : pass.epsOut;
    hiz = pass.v1;
  }

  return {
    passes: list,
    method,
    passCount: list.length,
    // "Otomatik: X pas" satırı bunu kullanır — seçili yöntemin kendi otomatik değeri.
    autoPassCount: method === 'manual' ? list.length : autoN_sonuc,
    epsTotal: 2 * Math.log(d[0] / d[d.length - 1]),
    anneals: anneal.slice(),
    // Hat büyüklükleri: kütle debisi (kg/s) sabittir, çıkış hızı son pasın hızıdır.
    massFlow: massFlowOf(list[0]),
    v0Line: list[0].v0,
    v1Line: list[list.length - 1].v1,
    totalPower: list.reduce((a, b) => a + b.P, 0)
  };
}

/* Eşit emniyet yönteminin otomatik pas sayısı (K-07): N = 1'den yukarı ara, hem
   max emniyet <= TARGET_SAFETY hem de her pasta r <= R_THEORETICAL_MAX koşulunu
   sağlayan EN KÜÇÜK N'i seç. Arama yalnızca bu iki koşula bakar; ortaya çıkan
   delta veya sıcaklık uyarıları bastırılmaz, kullanıcıya gösterilir.
   Arama çaptan bağımsızdır; yalnızca gerinimler, sürtünme ve kalıp açısı belirleyicidir. */
function autoPassCountEqualSafety(epsTotal, params, anneals) {
  for (let N = 1; N <= MAX_PASSES; N++) {
    const strains = strainsEqualSafety(epsTotal, N, params, anneals);
    let epsMat = 0, worst = 0, ok = true;
    for (let i = 0; i < strains.length; i++) {
      if (strains[i] > EPS_PER_PASS_MAX) { ok = false; break; }   // r teorik sınırı aşıyor
      worst = Math.max(worst, safetyForStrain(strains[i], epsMat, params));
      epsMat = anneals.includes(i + 1) ? 0 : epsMat + strains[i];
    }
    if (ok && worst <= TARGET_SAFETY) return N;
  }
  throw new DrawingError('PAS_SAYISI_YAKINSAMADI',
    'Hedef emniyet oranına ' + MAX_PASSES + ' pasa kadar ulaşılamadı.', { epsTotal });
}

/* Bir pasın taşıdığı kütle debisi (kg/s), raporlanan çap ve hızdan.
   A mm² -> m² için 1e-6. Sürekli hatta bu değer bütün paslarda aynı olmalıdır. */
function massFlowOf(pass) {
  return RHO * pass.A0 * 1e-6 * pass.v0;
}

/* Kullanıcının yapıştırdığı çap listesini sayı dizisine çevirir.
   Ayırıcı: boşluk, satır sonu, noktalı virgül veya virgül. Virgül aynı zamanda
   ondalık ayırıcı olabildiği için iki okuma denenir, geçerli olan seçilir. */
function parseManualSchedule(text) {
  if (typeof text !== 'string' || text.trim() === '') {
    throw new DrawingError('MANUEL_BOS', 'Çap listesi boş.', {});
  }

  const okuma = (virgulAyirici) => {
    const ham = virgulAyirici ? text.split(/[\s;,]+/) : text.split(/[\s;]+/);
    const sayilar = [];
    for (const parca of ham) {
      if (parca === '') continue;
      const t = virgulAyirici ? parca : parca.replace(',', '.');
      if (!/^\d*\.?\d+$/.test(t)) return null;
      sayilar.push(parseFloat(t));
    }
    return sayilar;
  };

  const gecerli = (a) => a && a.length >= 2 &&
    a.every(x => Number.isFinite(x) && x >= MANUAL_D_MIN && x <= MANUAL_D_MAX) &&
    a.every((x, i) => i === 0 || x < a[i - 1]);

  const ondalikVirgul = okuma(false);   // "8,00 7,16" — virgül ondalık
  const ayiriciVirgul = okuma(true);    // "8.00,7.16" — virgül ayırıcı
  const secilen = gecerli(ondalikVirgul) ? ondalikVirgul
                : gecerli(ayiriciVirgul) ? ayiriciVirgul : null;

  if (!secilen) {
    // Virgül hem ondalık hem ayırıcı olarak kullanılmışsa ("8,00,7,16") iki okuma da
    // geçersiz kalır ve asıl sorun sıralama değil, belirsizliktir.
    const virgulVar = text.includes(',');
    const bosluklaAyrilmis = /[\s;]/.test(text.trim());
    if (virgulVar && !bosluklaAyrilmis) {
      throw new DrawingError('MANUEL_BELIRSIZ',
        'Virgül hem ondalık hem ayırıcı olarak kullanılmış, liste okunamadı. ' +
        'Ayırıcı olarak boşluk veya noktalı virgül kullanın: 8,00 7,16 6,40', { text });
    }
    const aday = ondalikVirgul || ayiriciVirgul;
    if (!aday || aday.length < 2) {
      throw new DrawingError('MANUEL_GECERSIZ',
        'Çap listesi okunamadı. En az iki çap girin; ayırıcı olarak boşluk, satır sonu, ' +
        'noktalı virgül veya virgül kullanın.', { text });
    }
    if (!aday.every(x => x >= MANUAL_D_MIN && x <= MANUAL_D_MAX)) {
      throw new DrawingError('MANUEL_ARALIK_DISI',
        'Çaplar ' + MANUAL_D_MIN + ' – ' + MANUAL_D_MAX + ' mm aralığında olmalı.', { aday });
    }
    const i = aday.findIndex((x, k) => k > 0 && x >= aday[k - 1]);
    throw new DrawingError('MANUEL_SIRA',
      'Çaplar azalan sırada olmalı: ' + (i + 1) + '. değer (' + aday[i] +
      ') kendinden öncekinden küçük değil.', { aday, index: i });
  }
  return secilen;
}

/* ==== DOĞRULAMA ====
   BÖLÜM 1'deki beş test. Sonuç: [{id, ad, gecti, beklenen, bulunan}] */

// Referans pas — BÖLÜM 1'deki doğrulama örneğinin girdileri.
const REFERANS_GIRDI = { d0: 8.00, d1: 7.16, epsIn: 0, alphaDeg: 8, mu: 0.05, K: 450, n: 0.35, v0: 4.0 };

// Hazır senaryolar — d0, hedef çap ve proses parametreleri.
const SENARYOLAR = [
  { id: 'otomotiv', tr: 'Otomotiv ince', en: 'Automotive fine', d0: 8.00, dTarget: 1.38, alphaDeg: 8, mu: 0.05, K: 450, n: 0.35, v0: 2.0, beklenenN: 16, beklenenNes: 11 },
  { id: 'genel',    tr: 'Genel amaçlı',  en: 'General purpose', d0: 8.00, dTarget: 2.50, alphaDeg: 8, mu: 0.06, K: 450, n: 0.35, v0: 3.0, beklenenN: 11, beklenenNes:  8 },
  { id: 'ultra',    tr: 'Çok ince',      en: 'Ultra fine',      d0: 8.00, dTarget: 0.50, alphaDeg: 6, mu: 0.04, K: 450, n: 0.35, v0: 1.0, beklenenN: 25, beklenenNes: 17 }
];

function runValidation() {
  const sonuc = [];

  // T1 — Sıfır limiti: sürtünme ve açı sıfıra giderken sigmaD ideal işe yaklaşır.
  // Referans kodun kendi sigmaBar'ından değil, kapalı formdan gelir (epsIn = 0 için
  // ideal iş = K * eps^(n+1) / (n+1)); böylece sigmaBar integrali de sınanmış olur.
  const t1 = calcPass(Object.assign({}, REFERANS_GIRDI, { mu: 0, alphaDeg: 0.001 }));
  const t1Ideal = REFERANS_GIRDI.K * t1.epsPas ** (REFERANS_GIRDI.n + 1) / (REFERANS_GIRDI.n + 1);
  sonuc.push({
    id: 'T1', ad: 'Sıfır limiti',
    aciklama: 'Sürtünme sıfır, kalıp açısı sıfıra yakınken çekme gerilmesi ideal şekil verme işine eşitlenmeli.',
    beklenen: t1Ideal.toFixed(2) + ' MPa (±%1)',
    bulunan: t1.sigmaD.toFixed(2) + ' MPa',
    gecti: Math.abs(t1.sigmaD - t1Ideal) / t1Ideal < 0.01
  });

  // T2 — Alt sınır: gerçek pasta sürtünme ve fazlalık iş her zaman ekler.
  const ref = calcPass(REFERANS_GIRDI);
  const refIdeal = ref.sigmaBar * ref.epsPas;
  sonuc.push({
    id: 'T2', ad: 'Alt sınır',
    aciklama: 'Gerçek pasta çekme gerilmesi, ideal şekil verme işinden her zaman büyük olmalı.',
    beklenen: '> ' + refIdeal.toFixed(2) + ' MPa',
    bulunan: ref.sigmaD.toFixed(2) + ' MPa',
    gecti: ref.sigmaD > refIdeal
  });

  // T3 — Teorik maksimum: r = 0,70 olacak pas reddedilmeli.
  const d1_70 = REFERANS_GIRDI.d0 * Math.sqrt(1 - 0.70);
  let t3Gecti = false, t3Bulunan = '';
  try {
    calcPass(Object.assign({}, REFERANS_GIRDI, { d1: d1_70 }));
    t3Bulunan = 'hesap yapıldı (hata yok)';
  } catch (err) {
    t3Gecti = err instanceof DrawingError && err.code === 'R_TEORIK_ASIM';
    t3Bulunan = err.code + ': ' + err.message;
  }
  sonuc.push({
    id: 'T3', ad: 'Teorik maksimum',
    aciklama: 'Kesit azalması %63,2 sınırını aşan pas hesaplanmamalı, açık hata vermeli.',
    beklenen: 'R_TEORIK_ASIM hatası (r = %70,0)',
    bulunan: t3Bulunan, gecti: t3Gecti
  });

  // T4 — Kütle korunumu: hat boyunca bütün paslarda aynı kütle geçmeli.
  // Kütle debisi formülden değil, çıktı listesindeki raporlanan çap ve hız
  // değerlerinden hesaplanır; aksi hâlde test tanım gereği geçer ve zincirleme
  // hatasını kaçırır.
  const t4Prog = buildSchedule({ d0: SENARYOLAR[0].d0, dTarget: SENARYOLAR[0].dTarget,
    method: 'equalStrain', alphaDeg: SENARYOLAR[0].alphaDeg, mu: SENARYOLAR[0].mu,
    K: SENARYOLAR[0].K, n: SENARYOLAR[0].n, v0: SENARYOLAR[0].v0 });
  const debiler = t4Prog.passes.map(massFlowOf)
    .concat(t4Prog.passes.map(p => RHO * p.A1 * 1e-6 * p.v1));   // giriş ve çıkış tarafı
  const enBuyuk = Math.max(...debiler), enKucuk = Math.min(...debiler);
  const t4Sapma = (enBuyuk - enKucuk) / enKucuk;
  sonuc.push({
    id: 'T4', ad: 'Kütle korunumu',
    aciklama: 'Sürekli hatta bütün kalıplardan aynı kütle geçer: raporlanan çap ve hızlardan hesaplanan kütle debisi her pasta aynı olmalı.',
    beklenen: 'sapma < %0,01',
    bulunan: '%' + (t4Sapma * 100).toFixed(4) + ' (' + (enKucuk * 1000).toFixed(1) + ' g/s)',
    gecti: t4Sapma < 0.0001
  });

  // T5 — Otomatik pas sayısı (eşit gerinim): üç hazır senaryo.
  const bulunanN = SENARYOLAR.map(s => autoPassCount(s.d0, s.dTarget));
  const beklenenN = SENARYOLAR.map(s => s.beklenenN);
  sonuc.push({
    id: 'T5', ad: 'Otomatik pas sayısı — eşit gerinim',
    aciklama: 'Üç hazır senaryonun otomatik pas sayısı eşit gerinim yönteminde 16, 11 ve 25 olmalı.',
    beklenen: beklenenN.join(' · '),
    bulunan: bulunanN.join(' · '),
    gecti: bulunanN.every((N, i) => N === beklenenN[i])
  });

  // T6 — Otomatik pas sayısı (eşit emniyet): hedefi tutan en küçük N.
  const bulunanNes = SENARYOLAR.map(s => autoPassCountEqualSafety(
    2 * Math.log(s.d0 / s.dTarget),
    { alphaRad: s.alphaDeg * Math.PI / 180, mu: s.mu, K: s.K, n: s.n }, []));
  const beklenenNes = SENARYOLAR.map(s => s.beklenenNes);
  sonuc.push({
    id: 'T6', ad: 'Otomatik pas sayısı — eşit emniyet',
    aciklama: 'Eşit emniyet yöntemi, emniyet oranını 0,50 altında tutan en küçük pas sayısını bulmalı.',
    beklenen: beklenenNes.join(' · '),
    bulunan: bulunanNes.join(' · '),
    gecti: bulunanNes.every((N, i) => N === beklenenNes[i])
  });

  // T7 — Toplam iş / ideal iş oranı. Zinciri ilk ilkelerden sınayan tek test:
  // ideal özgül iş K·eps^(n+1)/((n+1)·RHO), gerçek özgül iş toplam güç / kütle debisi.
  const t7 = SENARYOLAR[0];
  const t7Prog = buildSchedule({ d0: t7.d0, dTarget: t7.dTarget, method: 'equalStrain',
    alphaDeg: t7.alphaDeg, mu: t7.mu, K: t7.K, n: t7.n, v0: t7.v0 });
  const idealOzgulIs  = t7.K * 1e6 * t7Prog.epsTotal ** (t7.n + 1) / ((t7.n + 1) * RHO); // J/kg
  const gercekOzgulIs = t7Prog.totalPower / t7Prog.massFlow;                              // J/kg
  const oran = gercekOzgulIs / idealOzgulIs;
  sonuc.push({
    id: 'T7', ad: 'Toplam iş / ideal iş oranı',
    aciklama: 'Hattın özgül enerjisi, ideal şekil verme işinin makul bir katı olmalı; sürtünme ve fazlalık iş bu farkı açıklar.',
    beklenen: '1,30 – 2,50',
    bulunan: oran.toFixed(2) + ' (' + (idealOzgulIs / 3600).toFixed(1) + ' → ' +
             (gercekOzgulIs / 3600).toFixed(1) + ' kWh/ton)',
    gecti: oran >= 1.3 && oran <= 2.5
  });

  // T8 — K değişmezliği. Emniyet oranı pekleşme katsayısından bağımsızdır:
  // sigmaD ve sigmaFOut'un ikisi de K ile doğrusaldır, oran sadeleşir.
  // Bu ucuz test, passStress içindeki cebirsel bir hatayı anında yakalar.
  const t8Alt = calcPass(Object.assign({}, REFERANS_GIRDI, { K: 315 }));
  const t8Ust = calcPass(Object.assign({}, REFERANS_GIRDI, { K: 530 }));
  const t8Fark = Math.abs(t8Alt.safety - t8Ust.safety);
  sonuc.push({
    id: 'T8', ad: 'K değişmezliği',
    aciklama: 'Pekleşme katsayısı K = 315 ile K = 530 arasında değişirken emniyet oranı aynı kalmalı; K oranda sadeleşir.',
    beklenen: 'fark < 1e-6',
    bulunan: t8Alt.safety.toFixed(8) + ' / ' + t8Ust.safety.toFixed(8),
    gecti: t8Fark < 1e-6
  });

  return sonuc;
}

      GECERSIZ_PAS_SAYISI: 'The pass count must be a whole number of 1 or more.',
      BILINMEYEN_YONTEM: 'Unknown pass distribution method.',
      YAKINSAMADI: 'The pass distribution did not converge to the target strain.',
      PAS_SAYISI_YAKINSAMADI: 'The target safety ratio could not be reached within {maks} passes.',
      MANUEL_BOS: 'The diameter list is empty.',
      MANUEL_DIZI_YOK: 'A diameter list is required for a manual schedule.',

      GECERSIZ_SAYI: 'Enter a valid number in the {alan} field.'
    }

};

/* ==== DURUM ==== */

const durum = {
  dil: 'tr',
  d0: 8.00, dTarget: 1.38, alphaDeg: 8, mu: 0.05, K: 450, n: 0.35, v0: 2.0,
  method: 'equalStrain',
  passes: null,            // null = Otomatik
  anneals: [],             // 1-indeksli pas numaraları
  manuelCaplar: null,      // manuel mod: çap dizisi
  // Dar ekranda panel kapalı açılır; yerinde tek satır özet durur.
  panelAcik: window.innerWidth >= 720,
  karsilastirmaA: null,     // "A olarak sabitle" ile alınan program özeti
  secilenPas: null,         // kalıp kesitinde gösterilen pas (varsayılan en riskli)
  kalipAlpha: null,         // kalıp kesiti kaydırıcıları — null: pastan gelen değer
  kalipR: null,
  tema: 'sistem',           // 'sistem' | 'light' | 'dark'
  sekme: 'dogrulama',       // güven katmanı sekmesi
  bant: { acik: false, K: BANT_VARSAYILAN.K.slice(), n: BANT_VARSAYILAN.n.slice(),
          mu: BANT_VARSAYILAN.mu.slice() }
};

// Girdi alanları: anahtar, birim ve giriş adımı. Sıra panelde göründüğü sıradır.
const ALANLAR = [
  { k: 'd0',       birim: 'mm' },
  { k: 'dTarget',  birim: 'mm' },
  { k: 'alphaDeg', birim: '°' },
  { k: 'mu',       birim: '' },
  { k: 'K',        birim: 'MPa' },
  { k: 'n',        birim: '' },
  { k: 'v0',       birim: 'm/s' }
];

// Tablo sütunları: anahtar, ondalık basamak ve birim. Aynı sütundaki bütün sayılar
// aynı basamak sayısıyla yazılır.
const SUTUNLAR = [
  { k: 'no',        bas: 0, birim: '' },
  { k: 'd0',        bas: 3, birim: 'mm' },
  { k: 'd1',        bas: 3, birim: 'mm' },
  { k: 'rPct',      bas: 2, birim: '%' },
  { k: 'epsOut',    bas: 3, birim: '' },
  { k: 'sigmaBar',  bas: 1, birim: 'MPa' },
  { k: 'sigmaFOut', bas: 1, birim: 'MPa' },
  { k: 'sigmaD',    bas: 1, birim: 'MPa' },
  { k: 'safety',    bas: 3, birim: '' },
  { k: 'delta',     bas: 2, birim: '' },
  { k: 'dT',        bas: 1, birim: '°C' },
  { k: 'v1',        bas: 2, birim: 'm/s' },
  { k: 'PkW',       bas: 2, birim: 'kW' }
];

// Toplam gerinim bu seviyeyi aşınca ara tavlama bilgi notu gösterilir.
const TAVLAMA_NOTU_ESIGI = 5.0;

/* ==== BİÇİMLENDİRME ==== */

const S = () => METIN[durum.dil];

/* Sayıyı dile göre biçimlendirir: Türkçede ondalık virgül, İngilizcede nokta.
   Binlik ayırıcı kullanılmaz. */
function fmt(sayi, basamak) {
  if (!Number.isFinite(sayi)) return '—';
  const s = sayi.toFixed(basamak);
  return durum.dil === 'tr' ? s.replace('.', ',') : s;
}

/* Kullanıcının yazdığı sayıyı okur: hem virgül hem nokta ondalık kabul edilir. */
function sayiOku(metin) {
  const t = String(metin).trim().replace(',', '.');
  if (t === '' || !/^-?\d*\.?\d+$/.test(t)) return NaN;
  return parseFloat(t);
}

/* Şablondaki {anahtar} yerlerini doldurur. */
function doldur(sablon, degerler) {
  return String(sablon).replace(/\{(\w+)\}/g, (_, k) => (k in degerler ? degerler[k] : '{' + k + '}'));
}

/* Hesap hatasını seçili dile çevirir. Çekirdek kodları döndürür, metin buradan gelir. */
function hataMetni(err) {
  const H = S().hata;
  if (!(err instanceof DrawingError)) return err.message;
  const i = err.info || {};
  switch (err.code) {
    case 'R_TEORIK_ASIM':
      return doldur(i.pas ? H.R_TEORIK_ASIM : H.R_TEORIK_ASIM_TEK,
        { pas: i.pas, r: fmt(i.r * 100, 1), sinir: fmt(R_THEORETICAL_MAX * 100, 1) });
    case 'PAS_SAYISI_YAKINSAMADI': return doldur(H.PAS_SAYISI_YAKINSAMADI, { maks: MAX_PASSES });
    case 'MANUEL_ARALIK_DISI': return doldur(H.MANUEL_ARALIK_DISI,
      { min: fmt(MANUAL_D_MIN, 2), maks: fmt(MANUAL_D_MAX, 0) });
    case 'MANUEL_SIRA': return doldur(H.MANUEL_SIRA,
      { sira: i.index + 1, deger: fmt(i.aday[i.index], 2) });
    default: return H[err.code] || err.message;
  }
}

/* ==== EŞİK DEĞERLENDİRMESİ ====
   Eşikler BÖLÜM 1'deki tablodan; sabitler hesap çekirdeğinde tanımlı. */

function safetyDurumu(v) { return v > SAFETY_CRITICAL ? 'crit' : v > SAFETY_WARNING ? 'warn' : 'ok'; }
function deltaDurumu(v)  { return (v < DELTA_MIN || v > DELTA_MAX) ? 'warn' : null; }
function dTDurumu(v)     { return v > DT_WARNING ? 'warn' : null; }

/* Hücrenin durum metni — renk körlüğü için renge ek olarak okunur bilgi. */
function durumMetni(sutun, deger) {
  const D = S().durum;
  if (sutun === 'safety') return D[safetyDurumu(deger)];
  if (sutun === 'delta')  return deger < DELTA_MIN ? D.deltaDusuk : deger > DELTA_MAX ? D.deltaYuksek : '';
  if (sutun === 'dT')     return deger > DT_WARNING ? D.isiYuksek : '';
  return '';
}

/* ==== ÖNERİ ====
   Genel geçer cümle yok: her cümle gerçek sayı taşır. */

/* Emniyet oranında belirgin bir tepe var mı? En yüksek pas, ikinciden en az
   %2 yüksekse "en riskli pas" demek anlamlıdır; değilse paslar aynı seviyededir. */
const TEPE_ESIGI = 0.02;

function belirginTepe(paslar) {
  if (paslar.length < 2) return true;
  const sirali = paslar.map(x => x.safety).sort((a, b) => b - a);
  return (sirali[0] - sirali[1]) / sirali[0] >= TEPE_ESIGI;
}

/* Tepe belirgin değilse aynı seviyedeki pasların aralığını verir. */
function esitBolge(paslar) {
  const enBuyuk = Math.max(...paslar.map(x => x.safety));
  const bolge = paslar.filter(x => x.safety >= enBuyuk * (1 - TEPE_ESIGI));
  return { ilk: bolge[0].no, son: bolge[bolge.length - 1].no, adet: bolge.length, emniyet: enBuyuk };
}

/* En riskli pasta emniyeti hedefe indirecek kesit azalmasını çözer. */
function guvenliAzalma(pas, params) {
  const eps = strainForSafety(TARGET_SAFETY, pas.epsIn, params);
  return 1 - Math.exp(-eps);
}

/* Delta'yı sınıra döndüren kalıp yarı açısı. Delta alfa ile doğrusaldır. */
function gerekliAci(pas, sinir) {
  return pas.alphaDeg * sinir / pas.delta;
}

function oneriCumleleri(prog) {
  const M = S();
  const cumleler = [];
  const params = { alphaRad: durum.alphaDeg * Math.PI / 180, mu: durum.mu, K: durum.K, n: durum.n };

  const riskli = prog.passes.reduce((a, b) => (b.safety > a.safety ? b : a));

  // Tek bir tepe yoksa bunu söyle: "en riskli pas" demek yanıltıcı olur (V3).
  const tepeBelirgin = belirginTepe(prog.passes) || prog.passes.length === 1;
  if (!tepeBelirgin) {
    const b = esitBolge(prog.passes);
    cumleler.push(doldur(M.oneriEsitBolge,
      { ilk: b.ilk, son: b.son, emniyet: fmt(b.emniyet, 3) }));
  }

  if (riskli.safety > SAFETY_WARNING) {
    const rYeni = guvenliAzalma(riskli, params);
    cumleler.push(doldur(M.oneriRiskli, {
      pas: riskli.no, emniyet: fmt(riskli.safety, 3),
      r0: fmt(riskli.r * 100, 1), r1: fmt(rYeni * 100, 1)
    }));
  } else {
    // Sınırın hemen altındaysa cümlenin tonu da bunu söylesin (C3).
    // Tepe belirgin değilse pas numarası tekrar edilmez, seviye zaten yukarıda yazıyor.
    const dar = riskli.safety >= SAFETY_WARNING * DAR_PAY_ORANI;
    cumleler.push(!tepeBelirgin && !dar
      ? M.oneriGuvenliBolge
      : doldur(dar ? M.oneriGuvenliDar : M.oneriGuvenli,
          { pas: riskli.no, emniyet: fmt(riskli.safety, 3) }));
  }

  const dusukDelta = prog.passes.filter(p => p.delta < DELTA_MIN)
    .reduce((a, b) => (a === null || b.delta < a.delta ? b : a), null);
  if (dusukDelta) {
    cumleler.push(doldur(M.oneriDeltaDusuk, {
      pas: dusukDelta.no, delta: fmt(dusukDelta.delta, 2),
      alpha: fmt(gerekliAci(dusukDelta, DELTA_MIN), 1)
    }));
  }

  const yuksekDelta = prog.passes.filter(p => p.delta > DELTA_MAX)
    .reduce((a, b) => (a === null || b.delta > a.delta ? b : a), null);
  if (yuksekDelta) {
    cumleler.push(doldur(M.oneriDeltaYuksek, {
      pas: yuksekDelta.no, delta: fmt(yuksekDelta.delta, 2),
      alpha: fmt(gerekliAci(yuksekDelta, DELTA_MAX), 1)
    }));
  }

  const sicak = prog.passes.reduce((a, b) => (b.dT > a.dT ? b : a));
  if (sicak.dT > DT_WARNING) {
    cumleler.push(doldur(M.oneriIsi, { pas: sicak.no, dT: fmt(sicak.dT, 1) }));
  }

  return cumleler;
}

/* Programdaki aktif uyarılar: tür ve kaç pası etkilediği.
   Karşılaştırmada bu satır bir ödünleşim satırıdır, üstünlük satırı değil. */
function uyariSayimi(prog) {
  const say = {
    kopma: prog.passes.filter(p => p.safety > SAFETY_CRITICAL).length,
    delta: prog.passes.filter(p => p.delta < DELTA_MIN || p.delta > DELTA_MAX).length,
    isi:   prog.passes.filter(p => p.dT > DT_WARNING).length
  };
  const turler = Object.keys(say).filter(t => say[t] > 0);
  return { say, turler };
}

/* Girdilerin anlık görüntüsü — A sabitlenirken alınır, C2 için karşılaştırılır. */
function girdiGoruntusu(prog) {
  return {
    d0: durum.d0, dTarget: durum.dTarget, alphaDeg: durum.alphaDeg, mu: durum.mu,
    K: durum.K, n: durum.n, v0: durum.v0,
    method: durum.manuelCaplar ? 'manual' : durum.method,
    passes: durum.passes,                  // null = otomatik
    passCount: prog.passCount,
    anneals: durum.anneals.join(',')
  };
}

/* Programın karşılaştırma için özeti. */
function programOzeti(prog) {
  const riskli = prog.passes.reduce((a, b) => (b.safety > a.safety ? b : a));
  return {
    uyari: uyariSayimi(prog),
    girdi: girdiGoruntusu(prog),
    pas: prog.passCount,
    enYuksekEmniyet: riskli.safety,
    enRiskliPas: riskli.no,
    guc: prog.totalPower / 1000,
    enerji: prog.totalPower / prog.massFlow / 3600,
    uzama: (prog.passes[0].d0 / prog.passes[prog.passes.length - 1].d1) ** 2,
    cikisHizi: prog.v1Line
  };
}

/* ==== ARAYÜZ KURULUMU ==== */

const $ = (id) => document.getElementById(id);
const alanGirdileri = {};   // anahtar -> input elemanı
let yontemSecimi, pasSayisiGirdisi, pasSayisiIpucu;

/* Küçük inline SVG ikonlar — emoji yok, 1,5 px kontur, currentColor. */
function ikon(tip) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', '16'); svg.setAttribute('height', '16');
  svg.setAttribute('viewBox', '0 0 16 16'); svg.setAttribute('fill', 'none');
  svg.setAttribute('aria-hidden', 'true');
  const yol = document.createElementNS(ns, 'path');
  const yollar = {
    ok: 'M4 6.5 L8 10.5 L12 6.5',                      // açılır liste oku
    onay: 'M3.5 8.5 L6.5 11.5 L12.5 5',                // onay işareti
    uyari: 'M8 2.5 L14.5 13.5 L1.5 13.5 Z M8 6.5 v3',  // uyarı üçgeni
    kritik: 'M8 2.5 L14.5 13.5 L1.5 13.5 Z M8 6 v3.5'  // tehlike üçgeni
  };
  yol.setAttribute('d', yollar[tip] || yollar.ok);
  yol.setAttribute('stroke', 'currentColor');
  yol.setAttribute('stroke-width', '1.5');
  yol.setAttribute('stroke-linecap', 'round');
  yol.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(yol);
  return svg;
}

function kurSenaryoDugmeleri() {
  const kap = $('senaryoDugmeleri');
  kap.textContent = '';
  for (const s of SENARYOLAR) {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'dugme';
    d.dataset.senaryo = s.id;
    d.addEventListener('click', () => senaryoYukle(s));
    kap.appendChild(d);
  }
}

function kurPanel() {
  const panel = $('girdiPaneli');
  panel.textContent = '';

  for (const a of ALANLAR) {
    const sar = document.createElement('div');
    sar.className = 'alan';
    const lab = document.createElement('label');
    lab.htmlFor = 'girdi-' + a.k;
    lab.dataset.alan = a.k;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'decimal';
    inp.id = 'girdi-' + a.k;
    inp.autocomplete = 'off';
    inp.addEventListener('input', () => {
      const v = sayiOku(inp.value);
      if (Number.isFinite(v)) {
        durum[a.k] = v;
        // K-01: başlangıç veya hedef çap elle değişince pas sayısı otomatiğe döner.
        if (a.k === 'd0' || a.k === 'dTarget') durum.passes = null;
        durum.anneals = [];
      }
      ciz();
    });
    alanGirdileri[a.k] = inp;
    sar.append(lab, inp);
    panel.appendChild(sar);
  }

  // Pas dağıtım yöntemi — özel stillenmiş select
  const sarY = document.createElement('div');
  sarY.className = 'alan genis';
  const labY = document.createElement('label');
  labY.htmlFor = 'girdi-method';
  labY.dataset.alan = 'method';
  const secimKabi = document.createElement('div');
  secimKabi.className = 'secim';
  yontemSecimi = document.createElement('select');
  yontemSecimi.id = 'girdi-method';
  for (const y of ['equalStrain', 'tapered', 'equalSafety']) {
    const o = document.createElement('option');
    o.value = y;
    yontemSecimi.appendChild(o);
  }
  yontemSecimi.addEventListener('change', () => {
    // K-01: yöntem değişiminde pas sayısı KORUNUR.
    durum.method = yontemSecimi.value;
    ciz();
  });
  secimKabi.append(yontemSecimi, ikon('ok'));
  sarY.append(labY, secimKabi);
  panel.appendChild(sarY);

  // Pas sayısı — boş = Otomatik
  const sarP = document.createElement('div');
  sarP.className = 'alan genis';
  const labP = document.createElement('label');
  labP.htmlFor = 'girdi-passes';
  labP.dataset.alan = 'passes';
  const satir = document.createElement('div');
  satir.className = 'pas-sayisi-satiri';
  pasSayisiGirdisi = document.createElement('input');
  pasSayisiGirdisi.type = 'text';
  pasSayisiGirdisi.inputMode = 'numeric';
  pasSayisiGirdisi.id = 'girdi-passes';
  pasSayisiGirdisi.autocomplete = 'off';
  pasSayisiGirdisi.addEventListener('input', () => {
    const t = pasSayisiGirdisi.value.trim();
    durum.passes = t === '' ? null : sayiOku(t);
    durum.anneals = [];
    ciz();
  });
  const otoDugme = document.createElement('button');
  otoDugme.type = 'button';
  otoDugme.className = 'dugme sessiz';
  otoDugme.id = 'otomatigeDon';
  otoDugme.addEventListener('click', () => {
    durum.passes = null;
    durum.anneals = [];
    pasSayisiGirdisi.value = '';
    ciz();
  });
  satir.append(pasSayisiGirdisi, otoDugme);
  pasSayisiIpucu = document.createElement('p');
  pasSayisiIpucu.className = 'ipucu';
  pasSayisiIpucu.id = 'pasSayisiIpucu';
  sarP.append(labP, satir, pasSayisiIpucu);
  panel.appendChild(sarP);
}

function kurTabloBasligi() {
  const satir = $('tabloBaslik');
  satir.textContent = '';
  for (const s of SUTUNLAR) {
    const th = document.createElement('th');
    th.scope = 'col';
