<style>
/* ==== TASARIM SİSTEMİ ====
   Renkler CSS değişkeni olarak. Açık tema :root'ta tam tanımlı; koyu tema hem sistem
   tercihinde hem de data-theme="dark" ile yeniden tanımlanıyor. Hiçbir renk yalnızca
   koyu tema bloğunda tanımlı değil. */

:root {
  --bg:#EDEFEE;  --surface:#F8F9F8;  --sunk:#E7EBE9;
  --ink:#141A19; --ink2:#414B49;     --ink3:#6C7775;
  --line:#D2D8D6; --line-strong:#B9C2BF;
  --copper:#A6512A; --copper-tint:#F0DED3;
  --patina:#2C6E64; --patina-tint:#D9E6E2;
  --warn:#8A6410;   --warn-tint:#F0E5CC;
  --crit:#8E3140;   --crit-tint:#F2DCDF;

  /* Tipografi ölçeği — dışına çıkılmaz */
  --t11:11px; --t125:12.5px; --t14:14px; --t16:16px;
  --t19:19px; --t24:24px; --t32:32px; --t44:44px;

  /* Boşluk ölçeği — ara değer yok */
  --s4:4px; --s8:8px; --s12:12px; --s16:16px;
  --s24:24px; --s32:32px; --s48:48px; --s64:64px;

  --gecis:160ms ease-out;
  --dokunma:44px;               /* en küçük dokunma hedefi */

  --yazi-baslik:'Archivo', system-ui, sans-serif;
  --yazi-govde:'IBM Plex Sans', system-ui, sans-serif;
  --yazi-mono:'IBM Plex Mono', ui-monospace, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#121615;  --surface:#1A201F;  --sunk:#161C1B;
    --ink:#E8EDEB; --ink2:#AEBAB7;     --ink3:#7C8886;
    --line:#2C3533; --line-strong:#3C4644;
    --copper:#E09258; --copper-tint:#3A2519;
    --patina:#6FB3A6; --patina-tint:#16302C;
    --warn:#D2A345;   --warn-tint:#33290F;
    --crit:#D97A85;   --crit-tint:#361A1F;
  }
}

:root[data-theme="dark"] {
  --bg:#121615;  --surface:#1A201F;  --sunk:#161C1B;
  --ink:#E8EDEB; --ink2:#AEBAB7;     --ink3:#7C8886;
  --line:#2C3533; --line-strong:#3C4644;
  --copper:#E09258; --copper-tint:#3A2519;
  --patina:#6FB3A6; --patina-tint:#16302C;
  --warn:#D2A345;   --warn-tint:#33290F;
  --crit:#D97A85;   --crit-tint:#361A1F;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--t14)/1.6 var(--yazi-govde);
  -webkit-text-size-adjust: 100%;
}

/* Odak halkası: outline sıfırlanmıyor, kendi halkamız tanımlanıyor. */
:focus-visible {
  outline: 2px solid var(--copper);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---- Düzen ---- */
.kabuk {
  max-width: 1180px;
  margin: 0 auto;
  padding: var(--s16);
  display: flex;
  flex-direction: column;
  gap: var(--s24);
}

.ust {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s12);
  padding-bottom: var(--s12);
  border-bottom: 1px solid var(--line-strong);
}
.ust h1 {
  font: 700 var(--t24)/1.15 var(--yazi-baslik);
  margin: 0;
  text-wrap: balance;
}
.ust p {
  margin: var(--s4) 0 0;
  color: var(--ink3);
  font-size: var(--t125);
  max-width: 65ch;
}
@media (min-width: 720px) { .ust h1 { font-size: var(--t32); } }

/* ---- Segment düğmesi (dil) ---- */
.segment { display: flex; border: 1px solid var(--line-strong); }
.segment button {
  min-height: var(--dokunma);
  min-width: var(--dokunma);
  padding: 0 var(--s12);
  border: 0;
  background: var(--surface);
  color: var(--ink2);
  font: 600 var(--t125)/1 var(--yazi-govde);
  letter-spacing: .08em;
  cursor: pointer;
  transition: background var(--gecis), color var(--gecis);
}
.segment button + button { border-left: 1px solid var(--line-strong); }
.segment button[aria-pressed="true"] { background: var(--copper-tint); color: var(--copper); }

/* ---- Bölüm başlıkları ---- */
.bolum { display: flex; flex-direction: column; gap: var(--s12); }
.bolum-basligi {
  margin: 0;
  font: 600 var(--t16)/1.25 var(--yazi-baslik);
  color: var(--ink);
}

/* ---- Adım başlığı ----
   Sayfa gerçekten bir sıra: girdileri kur → hesapla → sonucu oku → programı
   iyileştir → yöntemi denetle. Numara bu yüzden var, süs olsun diye değil.
   Ara bölümler (görseller, pas tablosu) numarasızdır; adımın içindedirler. */
.bolum-ust {
  display: flex; align-items: center; gap: var(--s12);
  padding-bottom: var(--s8);
  border-bottom: 1px solid var(--line-strong);
}
.adim-no {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  font: 600 var(--t125)/22px var(--yazi-mono);
  text-align: center;
  color: var(--copper);
  border: 1px solid var(--copper);
}
.bolum-adi {
  margin: 0; flex: 1 1 auto; min-width: 0;
  font: 600 var(--t19)/1.2 var(--yazi-baslik);
  color: var(--ink);
}
/* Amaç satırı tek cümledir ve bölümün tam genişliğini kullanır: ölçü sınırı
   koyunca sayfanın ortasında bitip sağında boş şerit bırakıyordu. */
.bolum-amac {
  margin: 0;
  font: 400 var(--t14)/1.55 var(--yazi-govde);
  color: var(--ink2);
}

/* ---- Girdi paneli ---- */
.panel {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: var(--s12);
  display: grid;
  /* 200px: yedi dar sütun yerine beş rahat sütun. Etiket ve açıklama satırı
     kırılmadan sığsın, kutular aynı ritimde dursun. */
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--s16);
}
.panel[hidden] { display: none; }

.alan { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.alan label, .alan .etiket {
  font: 500 var(--t11)/1.2 var(--yazi-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink3);
  /* İki satıra taşan etiketlerde kutular hizada kalsın */
  min-height: calc(2 * 1.2 * var(--t11));
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 0 var(--s4);
}
.alan .birim { color: var(--ink3); font-weight: 400; letter-spacing: 0; text-transform: none; }

/* Alan hatası: kutunun hemen altında tek satır. Renk tek başına bilgi taşımasın
   diye kenarlık da değişir; ekran okuyucuya aria-describedby ile bağlanır. */
.alan-hatasi {
  margin: 0;
  font: 400 var(--t11)/1.35 var(--yazi-govde);
  color: var(--crit);
}
.alan-hatasi[hidden] { display: none !important; }
/* Manuel bölümün ipucu satırı hata olarak kullanıldığında: .ipucu daha sonra
   tanımlı olduğu için birleşik seçici gerekiyor. */
.ipucu.alan-hatasi { font: 400 var(--t11)/1.35 var(--yazi-govde); color: var(--crit); }
input[type="text"].gecersiz, input[type="number"].gecersiz {
  border-color: var(--crit);
  background: var(--crit-tint);
}

input[type="number"], input[type="text"], textarea, select {
  font: 500 var(--t16)/1 var(--yazi-mono);   /* sayısal değerler mono */
  color: var(--ink);
  background: var(--sunk);
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  min-height: var(--dokunma);
  padding: 0 var(--s8);
  width: 100%;
  min-width: 0;
  transition: border-color var(--gecis), background var(--gecis);
}
/* Cümle ve kontrol metinleri Sans; mono yalnızca sayı, etiket ve formül için. */
select, textarea { font-family: var(--yazi-govde); font-weight: 400; }
::placeholder { font-family: var(--yazi-govde); color: var(--ink3); opacity: 1; }
textarea {
  padding: var(--s8);
  line-height: 1.6;
  resize: vertical;
  min-height: 72px;
  font-size: var(--t14);
  font-family: var(--yazi-mono);   /* içine çap dizisi yazılır */
}
input[type="number"]:hover, select:hover, textarea:hover { border-color: var(--ink3); }
input:disabled, select:disabled, textarea:disabled { color: var(--ink3); background: var(--bg); cursor: not-allowed; }

/* Tarayıcının sayı okları ve select oku gizleniyor; kendi görünümümüz kullanılıyor. */
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.secim { position: relative; display: flex; }
select { appearance: none; -webkit-appearance: none; padding-right: var(--s32); }
.secim svg { position: absolute; right: var(--s8); top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink3); }

/* ---- Düğmeler ---- */
.dugme {
  min-height: var(--dokunma);
  padding: 0 var(--s12);
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  background: var(--surface);
  color: var(--ink);
  font: 500 var(--t125)/1 var(--yazi-govde);
  cursor: pointer;
  transition: background var(--gecis), border-color var(--gecis), color var(--gecis);
}
.dugme:hover { background: var(--sunk); border-color: var(--ink3); }
.dugme[aria-pressed="true"] { border-color: var(--copper); color: var(--copper); background: var(--copper-tint); }
.dugme.sessiz { border-color: var(--line); color: var(--ink2); font-size: var(--t11); min-height: var(--dokunma); }

.dugme-sirasi { display: flex; flex-wrap: wrap; gap: var(--s8); }

/* ---- Bölüm başlığı satırı ve kapalı panel özeti ---- */
.ozet {
  margin: 0;
  padding: var(--s12);
  border: 1px solid var(--line);
  background: var(--surface);
  font: 500 var(--t14)/1.4 var(--yazi-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.ozet .ayrac { color: var(--ink3); padding: 0 var(--s4); }
.ozet .sozcuk { font-family: var(--yazi-govde); font-weight: 400; color: var(--ink2); }

/* ---- Pas sayısı alanı ---- */
.pas-sayisi-satiri { display: flex; flex-wrap: wrap; gap: var(--s8); align-items: stretch; }
.pas-sayisi-satiri input { flex: 1 1 96px; }
.pas-sayisi-satiri .dugme { flex: 0 1 auto; white-space: nowrap; }
.ipucu { font: 400 var(--t11)/1.4 var(--yazi-mono); color: var(--ink3); }
.gerekce { font-size: var(--t125); color: var(--ink3); margin: 0; max-width: 65ch; }

/* ---- Onay kutusu ---- */
.kutu { display: inline-flex; align-items: center; justify-content: center;
        min-width: var(--dokunma); min-height: var(--dokunma); cursor: pointer; }
.kutu input { position: absolute; opacity: 0; width: 0; height: 0; }
.kutu .gorsel {
  width: 18px; height: 18px; border: 1px solid var(--line-strong); border-radius: 2px;
  background: var(--sunk); display: inline-flex; align-items: center; justify-content: center;
  transition: background var(--gecis), border-color var(--gecis);
}
.kutu .gorsel svg { opacity: 0; color: var(--copper); transition: opacity var(--gecis); }
.kutu input:checked + .gorsel { border-color: var(--copper); background: var(--copper-tint); }
.kutu input:checked + .gorsel svg { opacity: 1; }
.kutu input:focus-visible + .gorsel { outline: 2px solid var(--copper); outline-offset: 2px; }

/* ---- Özet şeridi ---- */
.serit {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.serit .hucre {
  background: var(--surface);
  padding: var(--s12);
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  min-width: 0;
}
.serit .etiket {
  font: 500 var(--t11)/1.2 var(--yazi-mono);
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink3);
}
.serit .deger {
  font: 600 var(--t24)/1 var(--yazi-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  display: flex; align-items: baseline; gap: var(--s4); flex-wrap: wrap;
}
.serit .deger .birim { font: 400 var(--t125)/1 var(--yazi-mono); color: var(--ink3); }
.serit .not { font: 400 var(--t11)/1.3 var(--yazi-govde); color: var(--ink3); }
.serit .hucre.crit .deger { color: var(--crit); }
.serit .hucre.warn .deger { color: var(--warn); }
.serit .hucre.ok   .deger { color: var(--patina); }

/* ---- Öneri cümlesi ---- */
.oneri {
  margin: 0;
  padding: var(--s12);
  border: 1px solid var(--line-strong);
  border-left: 2px solid var(--copper);
  background: var(--surface);
  font-size: var(--t14);
  color: var(--ink);
  display: flex; flex-direction: column; gap: var(--s8);
}
.oneri b { font-weight: 600; }
.oneri .sayi { font-family: var(--yazi-mono); font-variant-numeric: tabular-nums; }

/* ---- Karşılaştırma ---- */
.degisen {
  margin: 0;
  padding: var(--s8) var(--s12);
  border: 1px solid var(--warn);
  background: var(--warn-tint);
  color: var(--ink);
  font-size: var(--t125);
}
.degisen.temiz { border-color: var(--line-strong); background: var(--sunk); color: var(--ink2); }

.karsilastirma td, .karsilastirma th { text-align: right; }
.karsilastirma td:first-child, .karsilastirma th:first-child { text-align: left; }
.karsilastirma tbody tr:last-child td { border-bottom: 0; font-weight: 600; }
.karsilastirma .fark-iyi { color: var(--patina); }
.karsilastirma .fark-kotu { color: var(--crit); }

/* ---- Tablo ---- */
.tablo-kabi { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: var(--s8) var(--s4); text-align: right; white-space: nowrap; }
/* İki kelimelik başlıklar alt satıra sarsın; sütunlar dar kalsın, sayılar sarmasın. */
thead th { white-space: normal; max-width: 96px; }
th:first-child, td:first-child, th:last-child, td:last-child { text-align: left; }
thead th {
  font: 500 var(--t11)/1.3 var(--yazi-mono);
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink3);
  border-bottom: 1px solid var(--line-strong); vertical-align: bottom;
}
thead th .birim { display: block; color: var(--ink3); font-weight: 400; letter-spacing: 0; text-transform: none; }
tbody td {
  font: 400 var(--t125)/1 var(--yazi-mono);
  font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
tbody tr:hover td, tbody tr:active td { background: var(--sunk); }
tbody td.ikincil { color: var(--ink2); }
/* Eşik renkleri. Renk tek başına bilgi taşımaz: uyarı ve tehlike hücrelerinde
   ayrıca simge ve okunabilir durum metni (aria-label) bulunur. */
tbody td.crit { background: var(--crit-tint); color: var(--crit); font-weight: 500; }
tbody td.warn { background: var(--warn-tint); color: var(--warn); font-weight: 500; }
tbody td.ok   { color: var(--patina); }
tbody td { position: relative; }   /* gizli durum metni hücrenin içinde kalsın */
tbody td .durum { display: inline-flex; align-items: center; gap: var(--s4); justify-content: flex-end; }
tbody td .durum svg { flex: none; }

tbody tr.tavlandi td { background: var(--copper-tint); }
tbody tr.tavlandi td:first-child { box-shadow: inset 2px 0 0 var(--copper); }
.tavlama-etiketi { font: 500 var(--t11)/1 var(--yazi-mono); color: var(--copper); letter-spacing: .12em; }

/* ---- Görseller ----
   Bütün renkler tema değişkenlerinden gelir; SVG içinde sabit renk yoktur. */
.gorsel-bolum { display: grid; grid-template-columns: 1fr; gap: var(--s16); }
@media (min-width: 900px) { .gorsel-bolum { grid-template-columns: 1fr 1fr; } }

.gorsel-kutu {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: var(--s12);
  display: flex; flex-direction: column; gap: var(--s8);
  min-width: 0;
}
.gorsel-kutu h3 {
  margin: 0;
  font: 600 var(--t125)/1.2 var(--yazi-govde);
  color: var(--ink);
}
.gorsel-kutu .gorsel-not { font: 400 var(--t11)/1.4 var(--yazi-govde); color: var(--ink3); margin: 0; }
.g-svg { display: block; width: 100%; height: auto; }

.g-aciklama { display: flex; flex-wrap: wrap; gap: var(--s4) var(--s12); }
.g-orn { display: inline-flex; align-items: center; gap: var(--s4);
         font: 400 var(--t11)/1.2 var(--yazi-govde); color: var(--ink2); }
.g-orn-kutu { width: 12px; height: 12px; border: 1px solid transparent; flex: none; }
.g-orn-dayanim { background: var(--ink2); }
.g-orn-gerilme { background: var(--copper); }
.g-orn-pay     { background: var(--patina-tint); border-color: var(--patina); }
.g-orn-crit    { background: var(--crit); }
.g-orn-warn    { background: var(--warn); }
.g-orn-ok      { background: var(--patina); }

/* SVG sınıfları — renk ya var(--...) ya currentColor */
.g-etiket { font: 400 11px var(--yazi-mono); fill: var(--ink3); }
.g-eksen-adi { font: 500 11px var(--yazi-mono); fill: var(--ink3); letter-spacing: .08em; }
.g-deger { font: 500 12px var(--yazi-mono); fill: var(--ink2); }
.g-deger-vurgu { font: 600 12px var(--yazi-mono); fill: var(--copper); }
.g-not { font: 400 11px var(--yazi-govde); fill: var(--ink3); }
.g-izgara { stroke: var(--line); stroke-width: 1; }
.g-eksen { stroke: var(--line-strong); stroke-width: 1; }
.g-merkez { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 4 4; }
.g-dayanim { stroke: var(--ink2); stroke-width: 2; }
.g-gerilme { stroke: var(--copper); stroke-width: 2; }
.g-pay { fill: var(--patina); opacity: .16; }
.g-bant { fill: var(--copper); opacity: .22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .g-pay { opacity: .24; } }
:root[data-theme="dark"] .g-pay { opacity: .24; }
.g-nokta-gerilme { fill: var(--copper); }
.g-nokta-dayanim { fill: var(--ink2); }
.g-tavlama { stroke: var(--copper); stroke-width: 1; stroke-dasharray: 3 3; }
.g-tavlama-etiket { font: 500 11px var(--yazi-mono); fill: var(--copper); }
.g-bar-ok { fill: var(--patina); }
.g-bar-warn { fill: var(--warn); }
.g-bar-crit { fill: var(--crit); }
.g-bar-vurgu { stroke: var(--ink); stroke-width: 1.5; }
.g-esik-crit { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 5 3; }
.g-esik-crit-etiket { font: 500 11px var(--yazi-mono); fill: var(--crit); }
.g-esik-warn { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 5 3; }
.g-esik-warn-etiket { font: 500 11px var(--yazi-mono); fill: var(--warn); }
.g-profil { fill: var(--copper-tint); }
.g-profil-kenar { stroke: var(--copper); stroke-width: 1.5; }
.g-profil-kalip { stroke: var(--copper); stroke-width: 1; opacity: .5; }
.g-tel { fill: var(--copper-tint); stroke: var(--copper); stroke-width: 1.5; }
.g-kalip { fill: var(--sunk); stroke: var(--line-strong); stroke-width: 1.5; }
.g-aci { stroke: var(--copper); stroke-width: 1.5; }
.g-olcu { stroke: var(--ink3); stroke-width: 1; }
.g-olcu-ince { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.g-ok { stroke: var(--copper); stroke-width: 2; }

/* Kaydırıcı — tarayıcı varsayılanı kullanılmaz, kendi rayı ve tutamağı */
.kaydirici-satiri { display: flex; align-items: center; gap: var(--s12); flex-wrap: wrap; }
.kaydirici-alan { display: flex; flex-direction: column; gap: var(--s4); flex: 1 1 160px; min-width: 0; }
.kaydirici-basligi { display: flex; justify-content: space-between; gap: var(--s8);
  font: 500 var(--t11)/1.2 var(--yazi-mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink3); }
.kaydirici-basligi .deger { font-family: var(--yazi-mono); color: var(--ink); letter-spacing: 0; }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; min-height: var(--dokunma); background: transparent; margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border: 1px solid var(--line-strong); border-radius: 2px;
  background: linear-gradient(to right, var(--copper) 0 var(--dolgu, 50%), var(--sunk) var(--dolgu, 50%) 100%);
}
input[type="range"]::-moz-range-track {
  height: 4px; border: 1px solid var(--line-strong); border-radius: 2px;
  background: linear-gradient(to right, var(--copper) 0 var(--dolgu, 50%), var(--sunk) var(--dolgu, 50%) 100%);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; margin-top: -8px; border-radius: 2px;
  background: var(--surface); border: 2px solid var(--copper); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 2px;
  background: var(--surface); border: 2px solid var(--copper); cursor: pointer;
}
tbody tr.secili td { box-shadow: inset 0 0 0 1px var(--copper); }

/* ---- Güven katmanı: sekmeler, testler, formüller ---- */
.sekme-satiri { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line-strong); }
.sekme-satiri button {
  min-height: var(--dokunma); padding: 0 var(--s16);
  border: 1px solid transparent; border-bottom: 0; background: transparent;
  color: var(--ink2); font: 500 var(--t125)/1 var(--yazi-govde); cursor: pointer;
  transition: color var(--gecis), background var(--gecis);
}
.sekme-satiri button:hover { background: var(--sunk); color: var(--ink); }
.sekme-satiri button[aria-selected="true"] {
  background: var(--surface); border-color: var(--line-strong); color: var(--copper);
  margin-bottom: -1px; border-bottom: 1px solid var(--surface);
}
.sekme-paneli { border: 1px solid var(--line); border-top: 0; background: var(--surface);
  padding: var(--s16); display: flex; flex-direction: column; gap: var(--s16); }
.sekme-paneli h3 { margin: 0; font: 600 var(--t14)/1.2 var(--yazi-govde); color: var(--ink); }
.sekme-paneli p { margin: 0; font-size: var(--t125); color: var(--ink2); max-width: 72ch; }
.sekme-paneli ul { margin: 0; padding-left: var(--s16); font-size: var(--t125); color: var(--ink2);
  display: flex; flex-direction: column; gap: var(--s4); max-width: 72ch; }

/* Sekme içi tablolar metin taşır: satırlar sarar, sayılar sağa hizalanır. */
.sekme-paneli td, .sekme-paneli th {
  white-space: normal; text-align: left; vertical-align: top;
  font-family: var(--yazi-govde); font-size: var(--t125);
}
.sekme-paneli thead th { font-family: var(--yazi-mono); }
.sekme-paneli td.mono, .sekme-paneli td.sayi {
  font-family: var(--yazi-mono); font-variant-numeric: tabular-nums;
}
.sekme-paneli td.sayi { text-align: right; white-space: nowrap; }
.sekme-paneli td.aciklama { max-width: 38ch; color: var(--ink3); }
.sekme-paneli td.durum-hucresi { text-align: right; white-space: nowrap; }

.rozet { display: inline-block; padding: 2px var(--s8); border: 1px solid currentColor;
  font: 600 var(--t11)/1.4 var(--yazi-mono); letter-spacing: .08em; }
.rozet.gecti { color: var(--patina); }
.rozet.kaldi { color: var(--crit); }
tbody td.ok { color: var(--patina); }

.formul { display: flex; flex-direction: column; gap: var(--s4); padding: var(--s12) 0;
  border-top: 1px solid var(--line); }
.formul:first-child { border-top: 0; }
.formul code { font: 500 var(--t14)/1.5 var(--yazi-mono); color: var(--ink);
  background: var(--sunk); border: 1px solid var(--line); padding: var(--s8); display: block;
  overflow-x: auto; }
.formul-alt { font: 400 var(--t11)/1.5 var(--yazi-govde); color: var(--ink3); }

/* ---- Belirsizlik bandı ---- */
.bant-kutusu { border: 1px solid var(--line); background: var(--surface); padding: var(--s12);
  display: flex; flex-direction: column; gap: var(--s12); }
.bant-satiri { display: flex; flex-wrap: wrap; gap: var(--s12); }
.bant-alan { display: flex; flex-direction: column; gap: var(--s4); flex: 1 1 150px; min-width: 0; }
.bant-alan .ikili { display: flex; gap: var(--s8); }
.bant-anahtari { display: flex; align-items: center; gap: var(--s8); cursor: pointer;
  font: 500 var(--t125)/1 var(--yazi-govde); color: var(--ink); min-height: var(--dokunma); }
.bant-deger { white-space: nowrap; }
.bant-koseler { border: 0; padding: 0; gap: var(--s8); }

/* ---- Tornado ---- */
.g-tornado { fill: var(--copper); }
.g-tornado-sifir { fill: var(--line-strong); }

/* ---- Pas kartları (dar ekran) ---- */
.kart-listesi { display: flex; flex-direction: column; gap: var(--s8); }
.pas-karti {
  border: 1px solid var(--line); background: var(--surface);
  padding: var(--s12); display: flex; flex-direction: column; gap: var(--s8);
}
.pas-karti.tavlandi { border-left: 2px solid var(--copper); background: var(--copper-tint); }
.pas-karti .kart-ust { display: flex; align-items: center; justify-content: space-between; gap: var(--s8); }
.pas-karti .kart-no {
  font: 500 var(--t11)/1 var(--yazi-mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink3);
}
.pas-karti .kart-tavlama { display: flex; align-items: center; gap: var(--s4);
  font: 500 var(--t11)/1 var(--yazi-mono); color: var(--copper); letter-spacing: .08em; }
.pas-karti .kart-orta { display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s12); flex-wrap: wrap; }
.pas-karti .kart-cap {
  font: 600 var(--t19)/1 var(--yazi-mono); font-variant-numeric: tabular-nums; color: var(--ink);
}
.pas-karti .kart-cap .birim { font: 400 var(--t125)/1 var(--yazi-mono); color: var(--ink3); }
.rozet-emniyet {
  display: inline-flex; align-items: center; gap: var(--s4);
  padding: var(--s4) var(--s8); border: 1px solid currentColor;
  font: 600 var(--t16)/1 var(--yazi-mono); font-variant-numeric: tabular-nums;
}
.rozet-emniyet.ok { color: var(--patina); }
.rozet-emniyet.warn { color: var(--warn); background: var(--warn-tint); }
.rozet-emniyet.crit { color: var(--crit); background: var(--crit-tint); }
.kart-ikincil { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4) var(--s12); margin: 0; }
.kart-ikincil div { display: flex; justify-content: space-between; gap: var(--s8); min-width: 0; }
.kart-ikincil dt { font: 400 var(--t11)/1.4 var(--yazi-govde); color: var(--ink3); }
.kart-ikincil dd {
  margin: 0; font: 400 var(--t125)/1.4 var(--yazi-mono);
  font-variant-numeric: tabular-nums; color: var(--ink2); white-space: nowrap;
}
.kart-ikincil dd.warn { color: var(--warn); }
.kart-ikincil dd.crit { color: var(--crit); }

/* ---- Kimlik başlığı ---- */
.ust-kontroller { display: flex; gap: var(--s8); align-items: stretch; }
.kimlik {
  display: flex; flex-wrap: wrap; gap: var(--s4) var(--s12); align-items: baseline;
  font-size: var(--t125); color: var(--ink3);
  border-bottom: 1px solid var(--line); padding-bottom: var(--s12);
}
.kimlik-ad { font: 600 var(--t14)/1.2 var(--yazi-govde); color: var(--ink); }
.kimlik-unvan { color: var(--ink2); }
.kimlik-bag { color: var(--copper); text-decoration: none; border-bottom: 1px solid var(--copper); }
.kimlik-bag:hover { color: var(--ink); border-color: var(--ink); }
.muafiyet { font-size: var(--t11); color: var(--ink3); }
.alt-metin { display: flex; flex-direction: column; gap: var(--s4); }

/* ---- Alt not ---- */
.alt-not {
  border-top: 1px solid var(--line-strong);
  padding-top: var(--s12);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s12);
  justify-content: space-between;
}
.alt-not p { margin: 0; font-size: var(--t125); color: var(--ink3); max-width: 72ch; }

/* ---- Hata / bilgi kutusu ---- */
.uyari {
  border: 1px solid var(--crit); background: var(--crit-tint); color: var(--ink);
  padding: var(--s12); font-size: var(--t125);
}
.bilgi {
  border: 1px solid var(--line-strong); background: var(--sunk); color: var(--ink2);
  padding: var(--s12); font-size: var(--t125);
}
/* Girdi geçersizken: aşağıdaki sayılar bir önceki geçerli hesaba ait. */
.uyari.bayat { border-left-width: 3px; font-weight: 500; }

/* ---- Hesapla düğmesi ----
   Sayfada tek bir birincil eylem var: hesaplamak. Bakır dolgu yalnızca ona ayrılmıştır,
   böylece "sonucu değiştiren düğme" gözle tek bakışta ayırt edilir. */
.dugme.birincil {
  border-color: var(--copper);
  background: var(--copper);
  color: #FFF;
  font: 600 var(--t14)/1 var(--yazi-baslik);
  letter-spacing: .04em;
  padding: 0 var(--s24);
}
.dugme.birincil:hover { background: var(--ink); border-color: var(--ink); color: #FFF; }
.dugme.birincil:disabled {
  background: var(--sunk); border-color: var(--line); color: var(--ink3);
  cursor: not-allowed;
}
/* Bekleyen değişiklik varken düğme yanıp sönmez, kalınlaşır: hareket değil ağırlık. */
.dugme.birincil.bekliyor { box-shadow: 0 0 0 3px var(--copper-tint); }

/* ---- Eylem çubuğu ----
   Düğmeler yalnızca burada yaşar: metnin ortasında duran, nereye ait olduğu
   belirsiz düğme kalmasın. Durum solda, birincil eylem sağda; çubuk her zaman
   ait olduğu panelin altına, ince bir çizginin ardına oturur. */
.eylem-cubugu {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end;
  gap: var(--s12);
  padding-top: var(--s12);
  border-top: 1px solid var(--line);
}
.eylem-metin { margin-right: auto; min-width: 0; display: grid; gap: 2px; }
.eylem-metin p { margin: 0; }
.hesapla-durum { font: 500 var(--t125)/1.4 var(--yazi-govde); color: var(--ink2); }
.hesapla-durum.guncel { color: var(--patina); }
.hesapla-durum.bekliyor { color: var(--copper); }
.hesapla-durum.gecersiz { color: var(--crit); }
#hesaplaAciklama { margin-top: var(--s8); }

/* ---- Bekleyen değişiklik şeridi ---- */
.uyari.bekleyen {
  border-color: var(--copper); background: var(--copper-tint);
  border-left-width: 3px;
}
.bekleyen-baslik { margin: 0; font: 600 var(--t14)/1.4 var(--yazi-baslik); color: var(--ink); }
.bekleyen-govde { margin: var(--s4) 0 0; font-size: var(--t125); color: var(--ink2); }
.bekleyen-liste {
  margin: var(--s8) 0 var(--s12); padding-left: var(--s16);
  font: 400 var(--t125)/1.6 var(--yazi-mono);
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.bekleyen-liste li { margin: 0; }

/* Sonuç bölümleri bekleyen değişiklik varken soluklaşır: okunur kalır ama
   "bu sayılar en son yazdığın girdiye ait değil" görsel olarak da söylenir. */
.bayat-sonuc { opacity: .55; transition: opacity var(--gecis); }

/* ---- Yapışkan alt çubuk ---- */
.yapiskan-cubuk {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: var(--s12); padding: var(--s12) var(--s16);
  background: var(--surface); border-top: 2px solid var(--copper);
  box-shadow: 0 -2px 12px rgba(0,0,0,.12);
}
.yapiskan-metin {
  font: 600 var(--t125)/1.2 var(--yazi-govde); color: var(--copper);
}
@media (max-width: 719px) {
  .yapiskan-cubuk { justify-content: space-between; }
  .yapiskan-cubuk .dugme.birincil { flex: 0 0 auto; }
}
/* Çubuk son bölümün üstüne binmesin. */
body.cubuk-acik .kabuk { padding-bottom: 96px; }
[hidden] { display: none !important; }

/* Ekran okuyucuya açık, gözle görünmez metin (durum açıklamaları) */
.gorsel-gizli {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* Geniş ekranda yöntem ve pas sayısı iki sütun kaplasın (metinleri uzun) */
@media (min-width: 720px) {
  .alan.genis { grid-column: span 2; }
  /* Çok sütunlu düzende kutular aynı hizada dursun: en uzun etiket (İngilizcede
     PEKLEŞME KATSAYISI + MPa) üç satıra taşıyor, ikisi taşmıyordu. */
  .panel .alan label, .panel .alan .etiket { min-height: calc(3 * 1.2 * var(--t11)); }
}

/* ---- Optimizasyon bölümü ---- */
/* ---- Araç kartı: kontrol solda, kenar notu sağda ----
   Açıklama metni kontrollerin altında tam genişlik kaplayınca ya çok uzun satır
   oluyor ya da sayfanın yarısında bitip boş şerit bırakıyordu. Kenar sütunu ona
   kendi yerini verir: sol tarafta ne yapıldığı, sağ tarafta neden. */
.arac {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: var(--s16);
  display: grid;
  gap: var(--s12);
}
.senaryo-satiri { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s8) var(--s12); }
.senaryo-etiketi {
  font: 500 var(--t11)/1 var(--yazi-mono);
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink3);
}
.giris-karar {
  margin: 0;
  padding: var(--s12);
  background: var(--sunk);
  border-left: 2px solid var(--patina);
  font: 400 var(--t125)/1.5 var(--yazi-govde);
  color: var(--ink2);
}
.arac-adi { margin: 0; font: 600 var(--t16)/1.25 var(--yazi-baslik); color: var(--ink); }
.arac-govde { display: grid; gap: var(--s16); align-items: start; }
.arac-kontrol { display: grid; gap: var(--s12); min-width: 0; }
/* Segment kendi genişliği kadar olsun: ızgara sütununu doldurunca iki seçenekli
   bir anahtar, sayfa genişliğinde bir şerit gibi görünüyordu. */
.arac-kontrol > .segment { justify-self: start; }
.arac-yan { display: grid; gap: var(--s8); min-width: 0; align-content: start; }
.arac-amac { margin: 0; font: 400 var(--t125)/1.5 var(--yazi-govde); color: var(--ink2); }
.not {
  margin: 0;
  padding-left: var(--s12);
  border-left: 2px solid var(--line-strong);
  font: 400 var(--t11)/1.5 var(--yazi-govde);
  color: var(--ink3);
}
@media (min-width: 900px) {
  .arac-govde { grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); }
}
@media (max-width: 899px) {
  /* Dar ekranda önce ne olduğunu oku, sonra kullan. */
  .arac-yan { order: -1; }
}
.arac-sonuc {
  border: 1px solid var(--line-strong);
  border-left: 2px solid var(--patina);
  background: var(--sunk);
  padding: var(--s12);
  display: flex; flex-direction: column; gap: var(--s8);
}
.arac-ozet {
  margin: 0;
  font: 600 var(--t16)/1.3 var(--yazi-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.arac-liste { margin: 0; padding-left: 1.1em; display: grid; gap: var(--s4); }
.arac-liste li { font: 400 var(--t125)/1.45 var(--yazi-govde); color: var(--ink2); }

/* ---- Giriş kartı: araç ne işe yarar ----
   Sayfa doğrudan uzman parametreleriyle açılıyordu; terimleri bilmeyen bir
   ziyaretçi ilk ekranda kalıyordu. Kart, kararı ve üç adımı öne alır. */
.giris {
  border: 1px solid var(--line);
  border-left: 3px solid var(--copper);
  background: var(--surface);
  padding: var(--s16);
  display: grid;
  gap: var(--s8);
}
.giris h2 { margin: 0; font: 600 var(--t16)/1.3 var(--yazi-baslik); color: var(--ink); }
/* Kart zaten dar bir sütun değil; metni 70ch'de kırmak geniş ekranda sayfanın
   yarısında bırakıyordu. Satır uzunluğunu kartın kendi genişliği belirler. */
.giris p { margin: 0; font: 400 var(--t14)/1.55 var(--yazi-govde); color: var(--ink2); }
.giris .giris-sinir { font-size: var(--t125); color: var(--ink3); }
.giris ol {
  margin: 0; padding: 0; list-style: none;
  display: grid; gap: 1px; counter-reset: adim;
  background: var(--line); border: 1px solid var(--line);
}
.giris ol li {
  counter-increment: adim;
  background: var(--surface);
  padding: var(--s12);
  display: grid; gap: var(--s8); align-content: start; min-width: 0;
  font: 400 var(--t125)/1.5 var(--yazi-govde); color: var(--ink2);
}
.giris ol li::before {
  content: counter(adim);
  width: 22px; height: 22px;
  font: 600 var(--t11)/20px var(--yazi-mono);
  text-align: center;
  color: var(--copper); border: 1px solid var(--copper);
}
.giris ol strong { display: block; font: 600 var(--t14)/1.3 var(--yazi-baslik); color: var(--ink); }
@media (min-width: 720px) {
  .giris ol { grid-template-columns: repeat(3, 1fr); }
}

/* ---- Karar satırı: sonucun tek cümlelik özeti ----
   Özet şeridi altı sayıyı eşit ağırlıkta gösteriyor; hangisinin karar sayısı
   olduğu görünmüyordu. Bu satır kararı tablodan önce düz cümleyle söyler. */
.karar {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  padding: var(--s12) var(--s16);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s8) var(--s16);
}
.karar-metin { display: grid; gap: var(--s4); min-width: 0; flex: 1 1 240px; }
.karar-ozet {
  margin: 0;
  font: 600 var(--t19)/1.25 var(--yazi-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.karar-alt { margin: 0; font: 400 var(--t125)/1.45 var(--yazi-govde); color: var(--ink2); }
.rozet {
  font: 600 var(--t11)/1 var(--yazi-mono);
  letter-spacing: .12em; text-transform: uppercase;
  padding: var(--s12);
  border: 1px solid currentColor;
  white-space: nowrap;
}
.rozet.ok   { color: var(--patina); background: var(--patina-tint); }
.rozet.warn { color: var(--warn);   background: var(--warn-tint); }
.rozet.crit { color: var(--crit);   background: var(--crit-tint); }

/* ---- Girdi yardımı: her kutunun altında tek satır ---- */
.alan-yardim { margin: 0; font: 400 var(--t11)/1.4 var(--yazi-govde); color: var(--ink3); }

/* ---- Sütun sözlüğü: tablo başlıklarının düz karşılığı ---- */
.sozluk { border: 1px solid var(--line); background: var(--surface); }
.sozluk > summary {
  padding: var(--s12);
  cursor: pointer;
  min-height: var(--dokunma);
  display: flex; align-items: center;
  font: 500 var(--t125)/1.3 var(--yazi-govde); color: var(--ink2);
}
.sozluk dl { margin: 0; padding: 0 var(--s16) var(--s16); display: grid; gap: var(--s8); }
.sozluk dt {
  margin: 0;
  font: 600 var(--t11)/1.3 var(--yazi-mono);
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
}
.sozluk dd { margin: 0; font: 400 var(--t125)/1.45 var(--yazi-govde); color: var(--ink2); }

/* ---- Yazdırma: iki sayfa ----
   Sayfa 1: kimlik, girdiler, özet, ana grafik, pas tablosu.
   Sayfa 2: bant köşeleri, doğrulama ve kabuller.
   Renkler yazdırmada her zaman açık temadan gelir. */
@media print {
  :root, :root[data-theme="dark"] {
    --bg:#fff; --surface:#fff; --sunk:#f4f5f4;
    --ink:#111; --ink2:#333; --ink3:#555;
    --line:#ccc; --line-strong:#999;
    --copper:#8a4423; --copper-tint:#f4e7de;
    --patina:#245b53; --patina-tint:#e2eeeb;
    --warn:#6f5010; --warn-tint:#f5eddb;
    --crit:#7a2937; --crit-tint:#f6e3e6;
  }
  @page { size: A4; margin: 9mm 9mm; }
  body { background: #fff; font-size: 10px; }
  .kabuk { max-width: none; padding: 0; gap: var(--s8); display: block; }
  .kabuk > * { margin-bottom: var(--s8); }
  .ust h1 { font-size: 18px; }
  .ust p { display: none; }
  .bolum-basligi { font-size: 9px; }
  .panel { padding: var(--s8); gap: var(--s4) var(--s8); }
  .serit .deger { font-size: 15px; }
  .serit .hucre { padding: var(--s8); }
  th, td { padding: 3px 4px; font-size: 9px !important; }
  .sekme-paneli { padding: var(--s8); gap: var(--s8); }
  .sekme-paneli td, .sekme-paneli th { font-size: 9px !important; }
  .sekme-paneli td.aciklama { max-width: 30ch; }
  .gorsel-kutu { padding: var(--s8); }
  .oneri { padding: var(--s8); font-size: 10px; }
  .bant-kutusu { padding: var(--s8); gap: var(--s8); }
  .gerekce, .ipucu { font-size: 9px; }

  /* Kontroller ve etkileşimli parçalar basılmaz */
  .ust-kontroller, #senaryoDugmeleri, #panelKatla, .dugme-sirasi, .sekme-satiri,
  #bantAlanlari, .kaydirici-satiri, #paylasimDurumu, .alt-not .dugme,
  .eylem-cubugu, #hesaplaAciklama, .yapiskan-cubuk { display: none !important; }
  /* Baskıda sonuçlar soluk çıkmasın; bekleyen uyarısı metin olarak kalır. */
  .bayat-sonuc { opacity: 1 !important; }
  /* Giriş kartı ve sözlük ekran içindir; baskıda mühendislik özeti kalır. */
  .giris, .sozluk { display: none !important; }
  .karar { break-inside: avoid; }

  /* Sayfa 1'de yalnızca ana grafik kalır */
  .gorsel-bolum .gorsel-kutu:not(:first-child) { display: none; }
  .gorsel-bolum { grid-template-columns: 1fr; }

  /* Sayfa düzeni: 1 — kimlik, girdiler, özet, ana grafik, pas tablosu;
                   2 — belirsizlik köşeleri, doğrulama özeti, kabuller. */
  /* DOM sırası zaten yazdırma sırası: sayfa 2 belirsizlik bandıyla başlar. */
  #bantBolumu { break-before: page; }
  .senaryo-satiri, #hataKutusu, #bilgiKutusu { display: none !important; }

  .sekme-paneli[hidden] { display: flex !important; }
  #bantKoseler[hidden] { display: flex !important; }
  /* Formüller sekmesi basılmaz — özgülük sırası gereği bu kural sonra gelir */
  #guvenBolumu [data-panel="formuller"] { display: none !important; }

  /* Sıkıştırma: yazdırmada girdi paneli ve özet şeridi daha küçük */
  #girdiBolumu .gerekce, #pasSayisiIpucu, #yontemGerekcesi,
  #bantBolumu .gerekce, .bant-anahtari { display: none !important; }
  input, select, textarea { min-height: 22px !important; font-size: 10px !important; }
  .serit .deger { font-size: 13px; }
  .serit .hucre { padding: var(--s8) var(--s8); }
  .sekme-paneli ul { gap: 2px; }
  .sekme-paneli p, .sekme-paneli li { font-size: 9px; }
  .alt-not { padding-top: var(--s8); }
  .alt-not p { font-size: 8.5px; }
  #bantKoseler .ipucu { font-size: 8.5px; }
  #bantBolumu thead th, #bantBolumu tbody td { padding: 1px 4px; }
  [data-panel="kabuller"] li, [data-panel="kabuller"] p { line-height: 1.3; font-size: 8.5px; }
  .sekme-paneli { gap: var(--s4); }

  /* Grafik, tek sütunda oransal olarak büyümesin */
  .gorsel-kutu svg.g-svg { height: 196px; width: auto; max-width: 100%; }

  /* Tablo satırları: dokunma hedefi yazdırmada gerekmez */
  .kutu { min-height: 0 !important; min-width: 0 !important; }
  .kutu .gorsel { display: none; }
  tbody td { padding: 2px 4px; }

  /* Doğrulama özeti: test tablosu yeter, açıklama sütunu ve referans tablosu değil */
  .sekme-paneli td.aciklama, .sekme-paneli th:nth-child(3),
  [data-panel="dogrulama"] > h3, #referansBaslikSatiri, #referansGovde { display: none !important; }
  [data-panel="dogrulama"] > .tablo-kabi:last-of-type { display: none !important; }

  /* Duyarlılık, manuel giriş, formüller ve karşılaştırma basılmaz:
     hedef iki sayfa — mühendislik özeti ve arkasında güven katmanı. */
  #duyarlilikBolumu, #araclarBolumu, [data-panel="formuller"],
  #karsilastirmaKabi, #degisenGirdiler { display: none !important; }

  .panel { break-inside: avoid; }
  table { break-inside: auto; }
  tr, .pas-karti, .formul, .gorsel-kutu { break-inside: avoid; }
  .tablo-kabi { overflow: visible; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9px; color: #555; }
}

/* ---- Dar ekran ---- */
@media (max-width: 719px) {
  .kabuk { padding: var(--s12); gap: var(--s16); }
  /* Telefonda girdi paneli tek sütun: etiket, kutu ve açıklaması birlikte okunur.
     İki sütunda açıklama satırı üç satıra kırılıyor ve kutular hizasını kaybediyordu. */
  .panel { grid-template-columns: 1fr; }
  .giris { padding: var(--s12); }
  .karar { padding: var(--s12); }
  .karar-ozet { font-size: var(--t16); }
  .rozet { padding: var(--s8); }
  .sozluk dl { padding: 0 var(--s12) var(--s12); }
  /* Telefonda amaç seçimi ve düğme alt alta, ikisi de tam genişlik. */
  /* Telefonda birincil eylem tam genişlik: başparmakla ulaşılacak tek hedef. */
  .eylem-cubugu { justify-content: stretch; }
  .eylem-cubugu .dugme { width: 100%; }
  .arac-kontrol > .segment { justify-self: stretch; }
  .arac-kontrol > .segment button { flex: 1 1 0; }
  .arac { padding: var(--s12); }
  .bolum-adi { font-size: var(--t16); }
}
</style>
</head>
