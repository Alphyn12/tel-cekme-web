<script>
/* ============================================================================
   TEL ÇEKME PAS PROGRAMI HESAPLAYICISI
   Barış Kırlı — bağımsız mühendislik çalışması — MIT lisansı

   NE YAPAR
   Bakır filmaşinden (8 mm) ince tele inen çekme hattı için pas programı kurar,
   her pasta çekme gerilmesini ve kopma riskini hesaplar, sonucun belirsizliğini
   de birlikte raporlar.

   KULLANILAN MODEL
     - Çekme gerilmesi : Siebel yaklaşımı — şekil verme + sürtünme + fazlalık iş
                         sigma_d = sigmaBar * ((1 + mu/alpha)*eps + (2/3)*alpha)
     - Pekleşme        : Hollomon, sigma_f = max(K * eps^n, 70 MPa)
                         Birikmiş gerinim taşınır, ara tavlamada sıfırlanır.
     - Ortalama akma   : Hollomon'un pas boyunca integrali
     - Emniyet oranı   : sigma_d / sigma_f,çıkış   (0,60 üstü kopma riski)
     - Delta faktörü   : alpha*(1+sqrt(1-r))^2/r  (1,5–3,0 arası uygun)
     - Adyabatik ΔT    : sigma_d / (rho*cp)       (üst sınırdır)
     - Hız zincirlenir : pas i'nin girişi, pas i-1'in çıkışı; kütle debisi sabit.

   PAS DAĞITIM YÖNTEMLERİ
     equalStrain (eşit gerinim) · tapered (kademeli azalan) · equalSafety
     (eşit emniyet, hedefi tutan en küçük pas sayısı) · manuel çap dizisi.

   DOĞRULAMA
   Sekiz test sayfa her açıldığında canlı çalışır (Doğrulama sekmesi): sıfır
   limiti, alt sınır, teorik maksimum, kütle korunumu, iki yöntemin otomatik pas
   sayısı, toplam iş / ideal iş oranı ve emniyet oranının K'dan bağımsızlığı.

   SINIRLAR
   Ön tasarım aracıdır, üretim reçetesi değildir. Kalıp esnemesi, yağ filmi
   rejimi, şekil değiştirme hızı, kalıp aşınması ve artık
   gerilmeler hesaba katılmaz. Tamamı: Kabuller sekmesi ve docs/kabuller.md.

   KAYNAKLAR
   G. E. Dieter, Mechanical Metallurgy (3. baskı) · S. Kalpakjian & S. Schmid,
   Manufacturing Engineering and Technology · B. Avitzur, Metal Forming ·
   J. G. Wistreich, The Fundamentals of Wire Drawing, Metallurgical Reviews (1958).

   YAPISI
   Tek dosya, sıfır bağımlılık, çevrimdışı çalışır. Sıra: hesap çekirdeği (saf
   fonksiyonlar, DOM'a dokunmaz) · doğrulama · belirsizlik ve duyarlılık · metin
   sözlüğü · durum · biçimlendirme · eşikler ve öneri · arayüz kurulumu · olaylar ·
   çizim · tema, bağlantı ve CSV · başlangıç.
   ========================================================================== */

'use strict';

/* ==== HESAP ÇEKİRDEĞİ ====
   Saf fonksiyonlar. DOM'a dokunmaz, yan etkisi yoktur. */

// --- Malzeme ve proses sabitleri ---
/* Yoğunluk ve özgül ısı artık girdidir; bunlar yalnızca VARSAYILAN değerlerdir.
   Önceden sabittiler: K ve n serbestçe düzenlenebildiği için alüminyum ya da çelik
   değerleri girildiğinde gerilme doğru, kütle debisi / kWh-ton / ΔT sessizce yanlış
   çıkıyordu. Sessiz hata, yanlış sayıdan kötüdür. */
const RHO       = 8960;   // kg/m3   tavlanmış ETP bakır — varsayılan
const CP        = 385;    // J/(kg·K) tavlanmış ETP bakır — varsayılan
/* Akma tabanı artık girdidir (M-1); bu yalnızca VARSAYILAN. Malzeme bakır
   dışına çıkınca taban da değişmeli: alüminyumda 28, çelikte 180 MPa mertebesinde.
   Sabit kalsaydı malzeme listesi yanlış bir tabanla çalışırdı. */
const SIGMA_Y0  = 70;     // MPa      tavlanmış ETP bakır — varsayılan taban

// --- Pas programı sabitleri ---
const MAX_R_PER_PASS    = 0.20;          // eşit gerinim / kademeli azalanda otomatik N için
                                         // pas başına maks kesit azalma (baş parmak kuralı)
const TAPER_RATIO       = 0.65;          // kademeli azalanda son pasın ilk pasa gerinim oranı
const TARGET_SAFETY     = 0.50;          // eşit emniyet yönteminin hedefi
const DAR_PAY_ORANI     = 0.90;          // emniyet bu oranın üstündeyse "pay dar" denir
const R_THEORETICAL_MAX = 1 - 1 / Math.E; // = 0,63212 — tek pasta teorik sınır
const MAX_PASSES        = 60;            // iterasyon güvenlik sınırı

// --- Eşikler (Faz 3'te renklendirme bunları kullanacak) ---
const SAFETY_CRITICAL = 0.60;  // üstü: kopma riski
const SAFETY_WARNING  = 0.50;  // üstü: sınıra yakın
const DELTA_MIN       = 1.5;   // altı: aşırı sürtünme, kalıp aşınması
const DELTA_MAX       = 3.0;   // üstü: merkezi çatlak (chevron) riski
const DT_WARNING      = 100;   // °C üstü: yağ bozunma riski. Hesaplanan ΔT adyabatiktir
                               // (bütün iş ısıya döner, kayıp yok) — yani bir üst sınırdır.

// --- İterasyon ayarları ---
const EPS_PER_PASS_MAX  = -Math.log(1 - R_THEORETICAL_MAX); // teorik maks pas gerinimi
const SAFETY_SEARCH_MIN = 0.05;   // eşit emniyet dış aramasının alt ucu
const SAFETY_SEARCH_MAX = 0.62;   // eşit emniyet dış aramasının üst ucu
const BISECTION_STEPS   = 80;     // ikili arama adım sayısı
const DIAMETER_TOL      = 0.001;  // mm, son pasın hedef çapa oturma toleransı

// --- Belirsizlik bandı varsayılan aralıkları (literatür) ---
const BANT_VARSAYILAN = { K: [380, 520], n: [0.33, 0.45], mu: [0.03, 0.08] };

/* ==== MALZEMELER ====
   Beş girdi birlikte bir malzemeyi tanımlar: pekleşme katsayısı ve üsteli, akma
   tabanı, yoğunluk ve özgül ısı. Bunları tek tek girmek hem zahmetli hem hatalıydı
   — biri K ve n'i alüminyuma çevirip yoğunluğu bakırda unutabiliyordu.

   Belirsizlik bandı da malzemeyle gelir: bakırın K aralığı çeliğin aralığı değildir.
   Malzeme seçilince bant uçları da o malzemenin aralığına oturur.

   Sürtünme listede YOKTUR: mu malzemenin değil hattın özelliğidir (K-19).

   Değerler Dieter'in pekleşme katsayıları tablosundan ve standart malzeme
   verilerinden; hepsi tavlanmış (yumuşak) hâl için. Kesin değil, mertebe doğru:
   her biri kendi belirsizlik bandıyla birlikte gelir. */
const MALZEMELER = [
  { id: 'etp',  tr: 'ETP bakır (tavlanmış)',   en: 'ETP copper (annealed)',
    K: 450,  n: 0.35, sigmaY0: 70,  rho: 8960, cp: 385,
    bantK: [315, 530],   bantN: [0.30, 0.44] },
  { id: 'alu',  tr: 'Alüminyum 1350-O',        en: 'Aluminium 1350-O',
    K: 140,  n: 0.25, sigmaY0: 28,  rho: 2700, cp: 900,
    bantK: [125, 175],   bantN: [0.20, 0.30] },
  { id: 'pirinc', tr: 'Pirinç CuZn30',         en: 'Brass CuZn30',
    K: 895,  n: 0.49, sigmaY0: 100, rho: 8530, cp: 380,
    bantK: [800, 950],   bantN: [0.42, 0.55] },
  { id: 'celik', tr: 'Düşük karbonlu çelik',   en: 'Low-carbon steel',
    K: 600,  n: 0.25, sigmaY0: 180, rho: 7850, cp: 470,
    bantK: [530, 700],   bantN: [0.20, 0.30] },
  { id: 'paslanmaz', tr: 'Paslanmaz 304',      en: 'Stainless 304',
    K: 1275, n: 0.45, sigmaY0: 250, rho: 7900, cp: 500,
    bantK: [1150, 1400], bantN: [0.40, 0.50] }
];

/* Girdiler bir malzemenin beş değerini de tutuyorsa o malzeme seçilidir; yoksa
   "özel". Kullanıcı tek bir değeri değiştirdiğinde liste sessizce yanlış malzemeyi
   göstermesin diye eşleşme beş alanın hepsine bakar. */
function malzemeBul(g) {
  return MALZEMELER.find(m => m.K === g.K && m.n === g.n && m.sigmaY0 === g.sigmaY0 &&
                              m.rho === g.rho && m.cp === g.cp) || null;
}

// --- Manuel dizi ayrıştırma sınırları (akla yatkın çap aralığı) ---
const MANUAL_D_MIN = 0.01;  // mm
const MANUAL_D_MAX = 50;    // mm

/* --- Girdi geçerlilik aralıkları ---
   Modelin geçerli olduğu alan. Siebel yaklaşımı ve Hollomon pekleşmesi bu
   aralıkların dışında fiziksel anlamını yitirir: negatif sürtünme çekme
   gerilmesini eksiye düşürür, n > 0,80 pekleşmeyi bakır için anlamsız kılar.
   Sınır dışı girdiyle hesap YAPILMAZ; aracın kendi sınırını bilmesi,
   sessizce saçma bir sayı üretmesinden iyidir. */
const GIRDI_SINIRLARI = {
  d0:       { alt: 0.1,   ust: 50 },     // mm
  dTarget:  { alt: 0.01,  ust: null },   // mm — üst sınır d0'dır, bağlamdan gelir
  alphaDeg: { alt: 1,     ust: 20 },     // °
  mu:       { alt: 0.005, ust: 0.30 },   // —
  /* K üst sınırı malzeme listesi için 1600'e çıkarıldı: paslanmaz 304'ün pekleşme
     katsayısı 1275 MPa mertebesindedir ve 1000 sınırı onu dışarıda bırakıyordu. */
  K:        { alt: 100,   ust: 1600 },   // MPa
  n:        { alt: 0.05,  ust: 0.80 },   // —
  v0:       { alt: 0.1,   ust: 20 },     // m/s
  rho:      { alt: 1000,  ust: 20000 },  // kg/m3 — alüminyum 2700, bakır 8960, tungsten 19300
  cp:       { alt: 100,   ust: 2000 },   // J/(kg·K) — bakır 385, çelik 470, alüminyum 900
  sigmaB:   { alt: 0,     ust: 300 },    // MPa — geri gerilim; 0 = geri gerilim yok
  sigmaY0:  { alt: 5,     ust: 400 }     // MPa — akma tabanı; alüminyum 28, bakır 70, paslanmaz 250
};

/* --- Çekirdek savunma sınırları ---
   GIRDI_SINIRLARI arayüzün kabul ettiği alandır: modelin GÜVENİLİR sayıldığı yer.
   Çekirdek bundan daha geniş bir alanda çalışabilmelidir, çünkü doğrulama testleri
   sınırları bilerek yoklar (T1 sıfır limitini μ = 0 ve α = 0,001° ile sınar).
   Bu yüzden alt uçlar fiziksel gerekliliktir, üst uçlar arayüzle ORTAKTIR —
   sabit ikinci kez yazılmaz. */
const CEKIRDEK_SINIRLARI = {
  d0:       { alt: 0, ust: GIRDI_SINIRLARI.d0.ust,       sifirDisi: true },
  alphaDeg: { alt: 0, ust: GIRDI_SINIRLARI.alphaDeg.ust, sifirDisi: true },
  mu:       { alt: 0, ust: GIRDI_SINIRLARI.mu.ust },
  K:        { alt: 0, ust: GIRDI_SINIRLARI.K.ust,        sifirDisi: true },
  rho:      { alt: 0, ust: GIRDI_SINIRLARI.rho.ust,      sifirDisi: true },
  cp:       { alt: 0, ust: GIRDI_SINIRLARI.cp.ust,       sifirDisi: true },
  sigmaB:   { alt: 0, ust: GIRDI_SINIRLARI.sigmaB.ust },
  sigmaY0:  { alt: 0, ust: GIRDI_SINIRLARI.sigmaY0.ust,  sifirDisi: true },
  n:        { alt: 0, ust: GIRDI_SINIRLARI.n.ust },
  v0:       { alt: 0, ust: Infinity,                     sifirDisi: true }
};

/* Bir alanın o anki sınırı. Yalnızca hedef çapınki bağlama bağlıdır: hedef,
   başlangıç çapından büyük olamaz. */
function girdiSiniri(alan, d0) {
  const s = GIRDI_SINIRLARI[alan];
  if (!s) return null;
  return alan === 'dTarget' ? { alt: s.alt, ust: Number.isFinite(d0) ? d0 : GIRDI_SINIRLARI.d0.ust } : s;
}

/* Girdi kümesini sınırlara göre denetler ve sınır dışı alan adlarını döndürür.
   Saf fonksiyon: hem arayüz hem T9 bunu çağırır, kural tek yerde durur. */
function girdiDenetimi(girdi) {
  const disinda = [];
  for (const alan of Object.keys(GIRDI_SINIRLARI)) {
    const v = girdi[alan];
    const s = girdiSiniri(alan, girdi.d0);
    if (!Number.isFinite(v) || v < s.alt || v > s.ust || (alan === 'dTarget' && v === s.ust)) disinda.push(alan);
  }
  return disinda;
}

/* Hesap hatası. `code` makine tarafı içindir (Faz 2'de METIN sözlüğüne bağlanacak),
   `message` Türkçe insan okunur karşılığıdır. */
class DrawingError extends Error {
  constructor(code, message, info) {
    super(message);
    this.name = 'DrawingError';
    this.code = code;
    this.info = info || {};
  }
}

/* Oran -> Türkçe yüzde metni (ondalık virgül). Hata mesajlarında kullanılır;
   Faz 2'de arayüzün sayı biçimlendiricisi bunun yerini alacak. */
function yuzdeTR(oran) {
  return (oran * 100).toFixed(1).replace('.', ',');
}

/* Bir pasın gerilme büyüklükleri — fiziğin TEK kaynağı.
   Çaptan bağımsızdır: Siebel bağıntısında yalnızca gerinimler, sürtünme ve kalıp açısı geçer.
   Hem calcPass hem eşit emniyet çözücüsü bunu çağırır; formül başka hiçbir yerde tekrarlanmaz. */
function passStress(epsIn, epsPas, { alphaRad, mu, K, n, sigmaB = 0, sigmaY0 = SIGMA_Y0 }) {
  const epsOut = epsIn + epsPas;

  /* Pas boyunca ortalama akma gerilmesi. Taban HEM burada hem çıkış akma
     gerilmesinde geçerlidir: malzeme 70 MPa'nın altında akamıyorsa, işi de o
     tabanın altında hesaplanamaz. Aksi hâlde payda "akamaz" derken pay
     akabiliyormuş gibi davranır ve düşük gerinimde kuvvet eksik çıkar.
     eps* tabanın kesiştiği gerinimdir; integral parça parça alınır. */
  const epsYildiz = (sigmaY0 / K) ** (1 / n);
  const hollomonIntegral = (a, b) => K * (b ** (n + 1) - a ** (n + 1)) / (n + 1);
  const tabansizBar = hollomonIntegral(epsIn, epsOut) / epsPas;
  let sigmaBar;
  if (epsOut <= epsYildiz) sigmaBar = sigmaY0;                         // pasın tamamı taban üzerinde
  else if (epsIn >= epsYildiz) sigmaBar = tabansizBar;                 // taban hiç devrede değil
  else sigmaBar = (sigmaY0 * (epsYildiz - epsIn) +                     // geçiş: iki parça
                   hollomonIntegral(epsYildiz, epsOut)) / epsPas;

  // Tabanın sonuca katkısı. Arayüz bunu eşikle karşılaştırıp uyarı gösterir:
  // taban baskınsa sayı bir modelleme tercihinden geliyor demektir.
  const tabanPayi = (sigmaBar - tabansizBar) / sigmaBar;

  // SIEBEL: şekil verme + sürtünme + fazlalık (redundant) iş
  const sigmaSiebel = sigmaBar * ((1 + mu / alphaRad) * epsPas + (2 / 3) * alphaRad);

  /* GERİ GERİLİM. Kalıba gerili giren tel, çekme gerilmesini artırır — ama geri
     gerilimin tamamı kalıbın öbür tarafına geçmez: sürtünme bir kısmını yutar.
     Sachs çözümünde aktarılan pay (A₁/A₀)^B, B = μ·cot α. Gerçek gerinim tanımı
     gereği A₁/A₀ = e^(−ε_pas), dolayısıyla çarpan e^(−B·ε_pas) olarak sadeleşir.

     Bu bir MELEZDİR: taban Siebel yaklaşımı, geri gerilim terimi Sachs çözümünden.
     İkisi aynı türetmeden gelmez; terim birinci mertebe bir düzeltme olarak eklenir
     (bkz. kaynaklar.md). σ_b = 0'da çarpanın hiçbir etkisi yoktur ve bütün eski
     sayılar birebir korunur.

     Uç durumlar: μ = 0 → B = 0 → çarpan 1, geri gerilimin tamamı geçer (sürtünme
     yoksa yutan bir şey de yok). α → 0 → B → ∞ → çarpan 0. İkisi de sonlu. */
  const B = mu / Math.tan(alphaRad);
  const aktarim = Math.exp(-B * epsPas);
  const sigmaGeri = sigmaB * aktarim;
  const sigmaD = sigmaSiebel + sigmaGeri;

  // Hollomon eps=0'da sıfır verir; tavlanmış bakır tabanı uygulanır.
  const sigmaFOut = Math.max(K * epsOut ** n, sigmaY0);

  return { epsOut, sigmaBar, tabanPayi, sigmaD, sigmaFOut, sigmaGeri, geriAktarim: aktarim,
           safety: sigmaD / sigmaFOut };
}

/* Verilen gerinim için emniyet oranı. Eşit emniyet çözücüsünün iç fonksiyonu. */
function safetyForStrain(epsPas, epsIn, params) {
  return passStress(epsIn, epsPas, params).safety;
}

/* Tek pasın bütün çıktıları. Girdiler: çaplar mm, açı derece, hız m/s, K MPa. */
function calcPass({ d0, d1, epsIn = 0, alphaDeg, mu, K, n, v0, rho = RHO, cp = CP,
                    sigmaB = 0, sigmaY0 = SIGMA_Y0 }) {
  // Çekirdek savunması. CEKIRDEK_SINIRLARI arayüzünkinden bilerek daha geniştir:
  // doğrulama testleri limitleri sınamak için μ = 0 ve α = 0,001° gibi değerler
  // kullanır. Üst uçlar GIRDI_SINIRLARI ile ortaktır, sabit tekrarlanmaz.
  const sinirDisi = Object.keys(CEKIRDEK_SINIRLARI).some((alan) => {
    const v = { d0, alphaDeg, mu, K, n, v0, rho, cp, sigmaB, sigmaY0 }[alan];
    const s = CEKIRDEK_SINIRLARI[alan];
    return v < s.alt || v > s.ust || (s.sifirDisi && v === 0);
  });
  if (![d0, d1, epsIn, alphaDeg, mu, K, n, v0, rho, cp, sigmaB, sigmaY0].every(Number.isFinite) ||
      epsIn < 0 || sigmaB < 0 || sinirDisi) {
    throw new DrawingError('GECERSIZ_PARAMETRE',
      'Hesap parametreleri modelin geçerli olduğu aralıkta ve sonlu olmalı.',
      { d0, d1, epsIn, alphaDeg, mu, K, n, v0, rho, cp, sigmaB, sigmaY0 });
  }
  if (!(d0 > 0) || !(d1 > 0)) {
    throw new DrawingError('GECERSIZ_CAP', 'Çaplar sıfırdan büyük olmalı.', { d0, d1 });
  }
  if (d1 >= d0) {
    throw new DrawingError('CIKIS_CAPI_BUYUK',
      'Çıkış çapı giriş çapından küçük olmalı.', { d0, d1 });
  }
  if (!(alphaDeg > 0)) {
    throw new DrawingError('GECERSIZ_ACI', 'Kalıp yarı açısı sıfırdan büyük olmalı.', { alphaDeg });
  }

  const alphaRad = alphaDeg * Math.PI / 180;
  const r = 1 - (d1 / d0) ** 2;

  // Teorik sınır: tek pasta bu azalmanın üstü mümkün değil, hesap durur.
  if (r > R_THEORETICAL_MAX) {
    throw new DrawingError('R_TEORIK_ASIM',
      'Bu pasta %' + yuzdeTR(r) + ' kesit azalma gerekiyor; aracın kesit azalma sınırı %' +
      yuzdeTR(R_THEORETICAL_MAX) + '.', { r, d0, d1 });
  }

  const epsPas = 2 * Math.log(d0 / d1);

  // Gerilmeler tek kaynaktan (passStress) gelir.
  const { epsOut, sigmaBar, tabanPayi, sigmaD, sigmaFOut, safety, sigmaGeri, geriAktarim } =
    passStress(epsIn, epsPas, { alphaRad, mu, K, n, sigmaB, sigmaY0 });
  const sigmaFIn = Math.max(K * epsIn ** n, sigmaY0);

  const delta = alphaRad * (1 + Math.sqrt(1 - r)) ** 2 / r;

  // Adyabatik sıcaklık artışı: bütün iş ısıya döner, kayıp yok kabulü — üst sınırdır.
  const dT = sigmaD * 1e6 / (rho * cp);   // sigmaD MPa -> Pa

  const A0 = Math.PI * d0 ** 2 / 4;           // mm2
  const A1 = Math.PI * d1 ** 2 / 4;           // mm2
  const F  = sigmaD * A1;                     // MPa * mm2 = N
  const v1 = v0 * (d0 / d1) ** 2;             // hacim korunumu
  const P  = F * v1;                          // W

  return { d0, d1, r, epsPas, epsIn, epsOut, sigmaFIn, sigmaFOut, sigmaBar, tabanPayi,
           sigmaD, safety, delta, dT, A0, A1, F, v0, v1, P, alphaDeg, mu, K, n, rho, cp,
           sigmaB, sigmaGeri, geriAktarim, sigmaY0 };
}

/* ==== SÜRTÜNME KALİBRASYONU (ters problem) ====
   Soru: bu pasta gerçekte şu kuvveti ölçtüm; bu hattın sürtünme katsayısı kaç?

   Aracın kendi duyarlılık analizi en kritik parametrenin mu olduğunu söylüyor:
   K emniyet oranında sadeleşir, mu sadeleşmez. Ama mu literatürden bilinemez —
   yağa, kalıp yüzeyine ve hıza bağlı olarak hatta özgüdür. Tek bir kuvvet ölçümü
   modeli o hatta bağlar.

   Siebel'de çekme gerilmesi mu'da monoton artandır (sürtünme terimi mu ile
   doğrusal), bu yüzden ikili arama tek köke yakınsar. Aralık dışı ölçümde sayı
   uydurulmaz: hangi sınırın aşıldığı söylenir. */
function muCoz(hedefSigmaD, { d0, d1, epsIn = 0, alphaDeg, K, n, v0, rho = RHO, cp = CP,
                              sigmaB = 0, sigmaY0 = SIGMA_Y0 }) {
  const dene = (mu) => calcPass({ d0, d1, epsIn, alphaDeg, mu, K, n, v0, rho, cp,
                                  sigmaB, sigmaY0 }).sigmaD;
  const muAlt = 0;                       // sürtünmesiz alt sınır: şekil verme + fazlalık iş
  const muUst = GIRDI_SINIRLARI.mu.ust;  // arayüzün kabul ettiği üst uç

  if (!Number.isFinite(hedefSigmaD) || hedefSigmaD <= 0) {
    return { durum: 'gecersiz' };
  }
  const sigmaAlt = dene(muAlt), sigmaUst = dene(muUst);
  if (hedefSigmaD < sigmaAlt) return { durum: 'dusuk', sinir: sigmaAlt, mu: muAlt };
  if (hedefSigmaD > sigmaUst) return { durum: 'yuksek', sinir: sigmaUst, mu: muUst };

  let lo = muAlt, hi = muUst;
  for (let i = 0; i < 80; i++) {
    const orta = (lo + hi) / 2;
    if (dene(orta) < hedefSigmaD) lo = orta; else hi = orta;
  }
  const mu = (lo + hi) / 2;
  return { durum: 'tamam', mu, sigmaD: dene(mu) };
}

/* Hedef emniyeti veren pas gerinimini ikili aramayla bulur.
   Ulaşılamıyorsa teorik maksimuma kadar açar. */
function strainForSafety(targetSafety, epsIn, params) {
  let lo = 1e-9, hi = EPS_PER_PASS_MAX;
  if (safetyForStrain(hi, epsIn, params) < targetSafety) return hi;
  for (let i = 0; i < BISECTION_STEPS; i++) {
    const mid = (lo + hi) / 2;
    if (safetyForStrain(mid, epsIn, params) < targetSafety) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* Otomatik pas sayısı: pas başına en fazla MAX_R_PER_PASS kesit azalma kabulüyle. */
function autoPassCount(d0, dTarget, method = 'equalStrain') {
  const epsTotal = 2 * Math.log(d0 / dTarget);
  const epsMax   = Math.log(1 / (1 - MAX_R_PER_PASS));
  let N = Math.max(1, Math.ceil(epsTotal / epsMax));
  if (method === 'tapered') {
    while (N <= MAX_PASSES && strainsTapered(epsTotal, N)[0] > epsMax + 1e-12) N++;
  }
  return N;
}

/* Eşit gerinim: her pasta aynı gerçek gerinim, dolayısıyla aynı % kesit azalma. */
function strainsEqual(epsTotal, N) {
  return new Array(N).fill(epsTotal / N);
}

/* Kademeli azalan: gerinim ağırlıkları ilk pastan son pasa doğrusal iner.
   Gerekçe: bakır pastan pasa sertleşir ve tel incelir; ikisi de riski artırır. */
function strainsTapered(epsTotal, N) {
  const w = [];
  for (let i = 1; i <= N; i++) {
    w.push(N === 1 ? 1 : 1 - (1 - TAPER_RATIO) * (i - 1) / (N - 1));
  }
  const sumW = w.reduce((a, b) => a + b, 0);
  return w.map(wi => epsTotal * wi / sumW);
}

/* Eşit emniyet: dış döngü hedef emniyet üzerinde, iç döngü pas gerinimi üzerinde
   ikili arama. Ara tavlama, malzemenin gördüğü birikmiş gerinimi sıfırlar.
   Hedefe ulaşılamayan N'lerde hata verilmez; şekil korunarak toplam gerinime ölçeklenir. */
function strainsEqualSafety(epsTotal, N, params, anneals) {
  const strainsFor = (targetSafety) => {
    const eps = [];
    let epsMat = 0;                     // malzemenin gördüğü birikmiş gerinim
    for (let i = 1; i <= N; i++) {
      const e = strainForSafety(targetSafety, epsMat, params);
      eps.push(e);
      epsMat = anneals.includes(i) ? 0 : epsMat + e;
    }
    return eps;
  };

  let lo = SAFETY_SEARCH_MIN, hi = SAFETY_SEARCH_MAX, eps = strainsFor(hi);
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  if (sum(eps) > epsTotal) {                       // hedef aralık içinde: ikili arama
    for (let i = 0; i < BISECTION_STEPS; i++) {
      const mid = (lo + hi) / 2;
      if (sum(strainsFor(mid)) < epsTotal) lo = mid; else hi = mid;
    }
    eps = strainsFor((lo + hi) / 2);
  }

  // Kalan farkı kapat: şekli koru, toplamı hedefe ölçekle (K-04).
  const k = epsTotal / sum(eps);
  return eps.map(e => e * k);
}

/* Gerinim dizisinden çap dizisini kurar; son çap hedefe tam oturur. */
function diametersFromStrains(d0, dTarget, strains) {
  const d = [d0];
  let epsAcc = 0;
  for (let i = 0; i < strains.length; i++) {
    epsAcc += strains[i];
    d.push(i === strains.length - 1 ? dTarget : d0 * Math.exp(-epsAcc / 2));
  }
  return d;
}

/* Pas programını kurar ve her pas için calcPass çağırır.
   `passes` verilmezse (null / "auto") pas sayısı otomatik hesaplanır.
   `method`: "equalStrain" | "tapered" | "equalSafety" | "manual"
   `diameters`: yalnızca "manual" yönteminde, d0 dahil azalan çap dizisi.
   `anneals`: 1-indeksli pas numaraları; o pastan sonra birikmiş gerinim sıfırlanır. */
function buildSchedule({ d0, dTarget, method = 'equalStrain', passes = null, diameters = null,
                         alphaDeg, mu, K, n, v0, rho = RHO, cp = CP, sigmaB = 0,
                         sigmaY0 = SIGMA_Y0, anneals = [] }) {
  const anneal = Array.isArray(anneals) ? anneals : [];
  let d, autoN_sonuc = null;   // yöntemine göre hesaplanan otomatik pas sayısı

  if (method === 'manual') {
    if (!Array.isArray(diameters) || diameters.length < 2) {
      throw new DrawingError('MANUEL_DIZI_YOK', 'Manuel pas programı için çap dizisi gerekli.', {});
    }
    d = diameters.slice();
    if (d.length > MAX_PASSES + 1 || !d.every(x => Number.isFinite(x) && x >= MANUAL_D_MIN && x <= MANUAL_D_MAX)) {
      throw new DrawingError('MANUEL_ARALIK_DISI', 'Manuel çap dizisi sınır dışında.', {});
    }
  } else {
    if (!(d0 > 0) || !(dTarget > 0)) {
      throw new DrawingError('GECERSIZ_CAP', 'Çaplar sıfırdan büyük olmalı.', { d0, dTarget });
    }
    if (dTarget >= d0) {
      throw new DrawingError('HEDEF_CAP_BUYUK',
        'Hedef çap başlangıç çapından küçük olmalı.', { d0, dTarget });
    }

    const epsTotal = 2 * Math.log(d0 / dTarget);
    const params   = { alphaRad: alphaDeg * Math.PI / 180, mu, K, n, sigmaB, sigmaY0 };
    const automatic = passes === null || passes === undefined || passes === 'auto';
    let autoN = null;
    try {
      autoN = method === 'equalSafety'
        ? autoPassCountEqualSafety(epsTotal, params, anneal)
        : autoPassCount(d0, dTarget, method);
    } catch (err) {
      if (automatic || !(err instanceof DrawingError) || err.code !== 'PAS_SAYISI_YAKINSAMADI') throw err;
    }

    let N;
    if (passes === null || passes === undefined || passes === 'auto') {
      N = autoN;
    } else {
      N = Number(passes);
      if (!Number.isInteger(N) || N < 1 || N > MAX_PASSES) {
        throw new DrawingError('GECERSIZ_PAS_SAYISI',
          'Pas sayısı 1–60 aralığında bir tam sayı olmalı.', { passes });
      }
    }
    if (!Number.isInteger(N) || N > MAX_PASSES) {
      throw new DrawingError('GECERSIZ_PAS_SAYISI', 'Pas sayısı 1–60 aralığında bir tam sayı olmalı.', { passes: N });
    }

    const strains = method === 'equalStrain' ? strainsEqual(epsTotal, N)
                  : method === 'tapered'     ? strainsTapered(epsTotal, N)
                  : method === 'equalSafety' ? strainsEqualSafety(epsTotal, N, params, anneal)
                  : null;
    if (!strains) {
      throw new DrawingError('BILINMEYEN_YONTEM', 'Bilinmeyen pas dağıtım yöntemi.', { method });
    }

    // Dağıtım gerçekten toplam gerinime yakınsadı mı? (Çapa bakmak anlamsız: son çap
    // hedefe zaten eşitleniyor; asıl kontrol gerinim toplamında.)
    const sapma = Math.abs(strains.reduce((a, b) => a + b, 0) - epsTotal) / epsTotal;
    if (sapma > 1e-6) {
      throw new DrawingError('YAKINSAMADI',
        'Pas dağıtımı hedef gerinime yakınsamadı.', { sapma, method, N });
    }
    d = diametersFromStrains(d0, dTarget, strains);
    autoN_sonuc = autoN;
  }

  // Pasları sırayla hesapla. İki büyüklük hat boyunca taşınır:
  //   - birikmiş gerinim (tavlamada sıfırlanır),
  //   - hız: pas i'nin giriş hızı, pas i-1'in çıkış hızıdır. Sürekli bir hatta
  //     bütün kalıplardan aynı kütle geçer; kütle debisi sabit kalmalıdır.
  const list = [];
  let epsIn = 0;
  let hiz = v0;                 // hat girişi hızı (8 mm filmaşin)
  for (let i = 0; i < d.length - 1; i++) {
    const no = i + 1;
    let pass;
    try {
      pass = calcPass({ d0: d[i], d1: d[i + 1], epsIn, alphaDeg, mu, K, n, v0: hiz,
                        rho, cp, sigmaB, sigmaY0 });
    } catch (err) {
      if (err instanceof DrawingError && err.code === 'R_TEORIK_ASIM') {
        throw new DrawingError('R_TEORIK_ASIM',
          'Bu pas sayısıyla ' + no + '. pasta %' + yuzdeTR(err.info.r) +
          ' kesit azalma gerekiyor; aracın kesit azalma sınırı %' + yuzdeTR(R_THEORETICAL_MAX) +
          '. Pas sayısını artırın.',
          Object.assign({ pas: no }, err.info));
      }
      throw err;
    }
    pass.no = no;
    pass.anneal = anneal.includes(no);
    list.push(pass);
    epsIn = pass.anneal ? 0 : pass.epsOut;
    hiz = pass.v1;
  }

  return {
    passes: list,
    method,
    passCount: list.length,
    // "Otomatik: X pas" satırı bunu kullanır — seçili yöntemin kendi otomatik değeri.
    autoPassCount: method === 'manual' ? list.length : autoN_sonuc,
    epsTotal: 2 * Math.log(d[0] / d[d.length - 1]),
    anneals: anneal.slice(),
    // Hat büyüklükleri: kütle debisi (kg/s) sabittir, çıkış hızı son pasın hızıdır.
    massFlow: massFlowOf(list[0]),
    v0Line: list[0].v0,
    v1Line: list[list.length - 1].v1,
    totalPower: list.reduce((a, b) => a + b.P, 0)
  };
}

/* Eşit emniyet yönteminin otomatik pas sayısı (K-07): N = 1'den yukarı ara, hem
   max emniyet <= TARGET_SAFETY hem de her pasta r <= R_THEORETICAL_MAX koşulunu
   sağlayan EN KÜÇÜK N'i seç. Arama yalnızca bu iki koşula bakar; ortaya çıkan
   delta veya sıcaklık uyarıları bastırılmaz, kullanıcıya gösterilir.
   Arama çaptan bağımsızdır; yalnızca gerinimler, sürtünme ve kalıp açısı belirleyicidir. */
function autoPassCountEqualSafety(epsTotal, params, anneals) {
  for (let N = 1; N <= MAX_PASSES; N++) {
    const strains = strainsEqualSafety(epsTotal, N, params, anneals);
    let epsMat = 0, worst = 0, ok = true;
    for (let i = 0; i < strains.length; i++) {
      if (strains[i] > EPS_PER_PASS_MAX) { ok = false; break; }   // r teorik sınırı aşıyor
      worst = Math.max(worst, safetyForStrain(strains[i], epsMat, params));
      epsMat = anneals.includes(i + 1) ? 0 : epsMat + strains[i];
    }
    if (ok && worst <= TARGET_SAFETY) return N;
  }
  throw new DrawingError('PAS_SAYISI_YAKINSAMADI',
    'Hedef emniyet oranına ' + MAX_PASSES + ' pasa kadar ulaşılamadı.', { epsTotal });
}

/* Bir pasın taşıdığı kütle debisi (kg/s), raporlanan çap ve hızdan.
   A mm² -> m² için 1e-6. Sürekli hatta bu değer bütün paslarda aynı olmalıdır. */
function massFlowOf(pass) {
  return pass.rho * pass.A0 * 1e-6 * pass.v0;
}

/* Kullanıcının yapıştırdığı çap listesini sayı dizisine çevirir.
   Ayırıcı: boşluk, satır sonu, noktalı virgül veya virgül. Virgül aynı zamanda
   ondalık ayırıcı olabildiği için iki okuma denenir, geçerli olan seçilir. */
/* ==== KALIP ÇAPINA YUVARLAMA ====
   Hesap 7,163 mm der; kalıp deposunda öyle bir kalıp yoktur. Bu fonksiyon çap
   dizisini gerçek kalıp adımına oturtur.

   UÇ ÇAPLARA DOKUNULMAZ: giriş filmaşini hattın beslemesi, son çap ürünün kendisi.
   İkisini yuvarlamak soruyu değiştirmek olurdu, cevabı değil.

   Adım kaba olduğunda iki komşu çap aynı değere düşebilir ya da sıra bozulabilir.
   O durumda dizi düzeltilmez, REDDEDİLİR: sessizce "yakın bir şey" üretmek, aracın
   bütün mantığına aykırı. Hangi çiftin çakıştığı söylenir. */
const YUVARLAMA_ADIMLARI = [0.01, 0.02, 0.05, 0.1, 0.25];

function caplariYuvarla(caplar, adim) {
  if (!Array.isArray(caplar) || caplar.length < 2 || !caplar.every(Number.isFinite)) {
    return { durum: 'gecersizDizi' };
  }
  if (!(adim > 0) || !Number.isFinite(adim)) return { durum: 'gecersizAdim' };

  const yeni = caplar.slice();
  let sapma = 0, degisen = 0;
  for (let i = 1; i < yeni.length - 1; i++) {
    // toFixed(6): 0,1 adımında 7,1000000000000005 gibi kayan nokta artığı kalmasın
    const yuvarlanmis = Number((Math.round(caplar[i] / adim) * adim).toFixed(6));
    if (yuvarlanmis !== caplar[i]) degisen++;
    sapma = Math.max(sapma, Math.abs(yuvarlanmis - caplar[i]));
    yeni[i] = yuvarlanmis;
  }

  for (let i = 1; i < yeni.length; i++) {
    if (!(yeni[i] < yeni[i - 1])) {
      return { durum: 'cakisma', ilk: i, son: i + 1, deger: yeni[i] };
    }
  }
  return { durum: 'tamam', caplar: yeni, sapma, degisen, adim };
}

function parseManualSchedule(text) {
  if (typeof text !== 'string' || text.trim() === '') {
    throw new DrawingError('MANUEL_BOS', 'Çap listesi boş.', {});
  }

  const okuma = (virgulAyirici) => {
    const ham = virgulAyirici ? text.split(/[\s;,]+/) : text.split(/[\s;]+/);
    const sayilar = [];
    for (const parca of ham) {
      if (parca === '') continue;
      const t = virgulAyirici ? parca : parca.replace(',', '.');
      if (!/^\d*\.?\d+$/.test(t)) return null;
      sayilar.push(parseFloat(t));
    }
    return sayilar;
  };

  const gecerli = (a) => a && a.length >= 2 &&
    a.every(x => Number.isFinite(x) && x >= MANUAL_D_MIN && x <= MANUAL_D_MAX) &&
    a.every((x, i) => i === 0 || x < a[i - 1]);

  const ondalikVirgul = okuma(false);   // "8,00 7,16" — virgül ondalık
  const ayiriciVirgul = okuma(true);    // "8.00,7.16" — virgül ayırıcı
  const secilen = gecerli(ondalikVirgul) ? ondalikVirgul
                : gecerli(ayiriciVirgul) ? ayiriciVirgul : null;

  if (!secilen) {
    // Virgül hem ondalık hem ayırıcı olarak kullanılmışsa ("8,00,7,16") iki okuma da
    // geçersiz kalır ve asıl sorun sıralama değil, belirsizliktir.
    const virgulVar = text.includes(',');
    const bosluklaAyrilmis = /[\s;]/.test(text.trim());
    if (virgulVar && !bosluklaAyrilmis) {
      throw new DrawingError('MANUEL_BELIRSIZ',
        'Virgül hem ondalık hem ayırıcı olarak kullanılmış, liste okunamadı. ' +
        'Ayırıcı olarak boşluk veya noktalı virgül kullanın: 8,00 7,16 6,40', { text });
    }
    const aday = ondalikVirgul || ayiriciVirgul;
    if (!aday || aday.length < 2) {
      throw new DrawingError('MANUEL_GECERSIZ',
        'Çap listesi okunamadı. En az iki çap girin; ayırıcı olarak boşluk, satır sonu, ' +
        'noktalı virgül veya virgül kullanın.', { text });
    }
    if (!aday.every(x => x >= MANUAL_D_MIN && x <= MANUAL_D_MAX)) {
      throw new DrawingError('MANUEL_ARALIK_DISI',
        'Çaplar ' + MANUAL_D_MIN + ' – ' + MANUAL_D_MAX + ' mm aralığında olmalı.', { aday });
    }
    const i = aday.findIndex((x, k) => k > 0 && x >= aday[k - 1]);
    throw new DrawingError('MANUEL_SIRA',
      'Çaplar azalan sırada olmalı: ' + (i + 1) + '. değer (' + aday[i] +
      ') kendinden öncekinden küçük değil.', { aday, index: i });
  }
  return secilen;
}

/* ==== DOĞRULAMA ====
   BÖLÜM 1'deki beş test. Sonuç: [{id, ad, gecti, beklenen, bulunan}] */

// Referans pas — BÖLÜM 1'deki doğrulama örneğinin girdileri.
const REFERANS_GIRDI = { d0: 8.00, d1: 7.16, epsIn: 0, alphaDeg: 8, mu: 0.05, K: 450, n: 0.35, v0: 4.0 };

// Hazır senaryolar — d0, hedef çap ve proses parametreleri.
const SENARYOLAR = [
  { id: 'otomotiv', tr: 'Otomotiv ince', en: 'Automotive fine', d0: 8.00, dTarget: 1.38, alphaDeg: 8, mu: 0.05, K: 450, n: 0.35, v0: 2.0, rho: RHO, cp: CP, sigmaB: 0, sigmaY0: SIGMA_Y0, beklenenN: 16, beklenenNes: 11 },
  { id: 'genel',    tr: 'Genel amaçlı',  en: 'General purpose', d0: 8.00, dTarget: 2.50, alphaDeg: 8, mu: 0.06, K: 450, n: 0.35, v0: 3.0, rho: RHO, cp: CP, sigmaB: 0, sigmaY0: SIGMA_Y0, beklenenN: 11, beklenenNes:  8 },
  { id: 'ultra',    tr: 'Çok ince',      en: 'Ultra fine',      d0: 8.00, dTarget: 0.50, alphaDeg: 6, mu: 0.04, K: 450, n: 0.35, v0: 1.0, rho: RHO, cp: CP, sigmaB: 0, sigmaY0: SIGMA_Y0, beklenenN: 25, beklenenNes: 17 }
];

function runValidation() {
  const sonuc = [];

  // T1 — Sıfır limiti: sürtünme ve açı sıfıra giderken sigmaD ideal işe yaklaşır.
  // Referans kodun kendi sigmaBar'ından değil, kapalı formdan gelir (epsIn = 0 için
  // ideal iş = K * eps^(n+1) / (n+1)); böylece sigmaBar integrali de sınanmış olur.
  const t1 = calcPass(Object.assign({}, REFERANS_GIRDI, { mu: 0, alphaDeg: 0.001 }));
  const t1Ideal = REFERANS_GIRDI.K * t1.epsPas ** (REFERANS_GIRDI.n + 1) / (REFERANS_GIRDI.n + 1);
  sonuc.push({
    id: 'T1', ad: 'Sıfır limiti',
    aciklama: 'Sürtünme sıfır, kalıp açısı sıfıra yakınken çekme gerilmesi ideal şekil verme işine eşitlenmeli.',
    beklenen: t1Ideal.toFixed(2) + ' MPa (±1%)',
    bulunan: t1.sigmaD.toFixed(2) + ' MPa',
    gecti: Math.abs(t1.sigmaD - t1Ideal) / t1Ideal < 0.01
  });

  // T2 — Alt sınır: gerçek pasta sürtünme ve fazlalık iş her zaman ekler.
  const ref = calcPass(REFERANS_GIRDI);
  const refIdeal = ref.sigmaBar * ref.epsPas;
  sonuc.push({
    id: 'T2', ad: 'Alt sınır',
    aciklama: 'Gerçek pasta çekme gerilmesi, ideal şekil verme işinden her zaman büyük olmalı.',
    beklenen: '> ' + refIdeal.toFixed(2) + ' MPa',
    bulunan: ref.sigmaD.toFixed(2) + ' MPa',
    gecti: ref.sigmaD > refIdeal
  });

  // T3 — Teorik maksimum: r = 0,70 olacak pas reddedilmeli.
  const d1_70 = REFERANS_GIRDI.d0 * Math.sqrt(1 - 0.70);
  let t3Gecti = false, t3Bulunan = '';
  try {
    calcPass(Object.assign({}, REFERANS_GIRDI, { d1: d1_70 }));
    t3Bulunan = '—';
  } catch (err) {
    t3Gecti = err instanceof DrawingError && err.code === 'R_TEORIK_ASIM';
    t3Bulunan = err.code;
  }
  sonuc.push({
    id: 'T3', ad: 'Teorik maksimum',
    aciklama: 'Kesit azalması %63,2 sınırını aşan pas hesaplanmamalı, açık hata vermeli.',
    beklenen: 'R_TEORIK_ASIM · r = 70.0%',
    bulunan: t3Bulunan, gecti: t3Gecti
  });

  // T4 — Kütle korunumu: hat boyunca bütün paslarda aynı kütle geçmeli.
  // Kütle debisi formülden değil, çıktı listesindeki raporlanan çap ve hız
  // değerlerinden hesaplanır; aksi hâlde test tanım gereği geçer ve zincirleme
  // hatasını kaçırır.
  const t4Prog = buildSchedule({ d0: SENARYOLAR[0].d0, dTarget: SENARYOLAR[0].dTarget,
    method: 'equalStrain', alphaDeg: SENARYOLAR[0].alphaDeg, mu: SENARYOLAR[0].mu,
    K: SENARYOLAR[0].K, n: SENARYOLAR[0].n, v0: SENARYOLAR[0].v0 });
  const debiler = t4Prog.passes.map(massFlowOf)
    .concat(t4Prog.passes.map(p => p.rho * p.A1 * 1e-6 * p.v1));   // giriş ve çıkış tarafı
  const enBuyuk = Math.max(...debiler), enKucuk = Math.min(...debiler);
  const t4Sapma = (enBuyuk - enKucuk) / enKucuk;
  sonuc.push({
    id: 'T4', ad: 'Kütle korunumu',
    aciklama: 'Sürekli hatta bütün kalıplardan aynı kütle geçer: raporlanan çap ve hızlardan hesaplanan kütle debisi her pasta aynı olmalı.',
    beklenen: '< 0.01%',
    bulunan: (t4Sapma * 100).toFixed(4) + '% (' + (enKucuk * 1000).toFixed(1) + ' g/s)',
    gecti: t4Sapma < 0.0001
  });

  // T5 — Otomatik pas sayısı (eşit gerinim): üç hazır senaryo.
  const bulunanN = SENARYOLAR.map(s => autoPassCount(s.d0, s.dTarget));
  const beklenenN = SENARYOLAR.map(s => s.beklenenN);
  sonuc.push({
    id: 'T5', ad: 'Otomatik pas sayısı — eşit gerinim',
    aciklama: 'Üç hazır senaryonun otomatik pas sayısı eşit gerinim yönteminde 16, 11 ve 25 olmalı.',
    beklenen: beklenenN.join(' · '),
    bulunan: bulunanN.join(' · '),
    gecti: bulunanN.every((N, i) => N === beklenenN[i])
  });

  // T6 — Otomatik pas sayısı (eşit emniyet): hedefi tutan en küçük N.
  const bulunanNes = SENARYOLAR.map(s => autoPassCountEqualSafety(
    2 * Math.log(s.d0 / s.dTarget),
    { alphaRad: s.alphaDeg * Math.PI / 180, mu: s.mu, K: s.K, n: s.n }, []));
  const beklenenNes = SENARYOLAR.map(s => s.beklenenNes);
  sonuc.push({
    id: 'T6', ad: 'Otomatik pas sayısı — eşit emniyet',
    aciklama: 'Eşit emniyet yöntemi, emniyet oranını 0,50 altında tutan en küçük pas sayısını bulmalı.',
    beklenen: beklenenNes.join(' · '),
    bulunan: bulunanNes.join(' · '),
    gecti: bulunanNes.every((N, i) => N === beklenenNes[i])
  });

  // T7 — Toplam iş / ideal iş oranı. Zinciri ilk ilkelerden sınayan tek test:
  // ideal özgül iş K·eps^(n+1)/((n+1)·RHO), gerçek özgül iş toplam güç / kütle debisi.
  const t7 = SENARYOLAR[0];
  const t7Prog = buildSchedule({ d0: t7.d0, dTarget: t7.dTarget, method: 'equalStrain',
    alphaDeg: t7.alphaDeg, mu: t7.mu, K: t7.K, n: t7.n, v0: t7.v0 });
  const idealOzgulIs  = t7.K * 1e6 * t7Prog.epsTotal ** (t7.n + 1) /
                        ((t7.n + 1) * t7Prog.passes[0].rho); // J/kg
  const gercekOzgulIs = t7Prog.totalPower / t7Prog.massFlow;                              // J/kg
  const oran = gercekOzgulIs / idealOzgulIs;
  sonuc.push({
    id: 'T7', ad: 'Toplam iş / ideal iş oranı',
    aciklama: 'Hattın özgül enerjisi, ideal şekil verme işinin makul bir katı olmalı; sürtünme ve fazlalık iş bu farkı açıklar.',
    beklenen: '1.30 – 2.50',
    bulunan: oran.toFixed(2) + ' (' + (idealOzgulIs / 3600).toFixed(1) + ' → ' +
             (gercekOzgulIs / 3600).toFixed(1) + ' kWh/ton)',
    gecti: oran >= 1.3 && oran <= 2.5
  });

  // T8 — K değişmezliği KOŞULLUDUR. 70 MPa tabanı hem ortalama akmada hem çıkış
  // akmasında geçerli olunca K üç bölgenin ikisinde sadeleşir, birinde sadeleşmez:
  //   A) taban hiç devrede değil (epsIn >= eps*)  -> sadeleşir
  //   B) geçiş bölgesi (epsIn < eps* < epsOut)     -> SADELEŞMEZ, çünkü eps* K'ya bağlı
  //   C) pasın tamamı taban üzerinde                -> sadeleşir (iki taraf da 70'e sabit)
  // Testin değeri "üçünü birden" doğrulamasında: yalnız A'ya bakan bir test,
  // tabanı tutarsız uygulayan bir çekirdeği de geçerdi.
  const t8 = (ek) => [315, 530].map(K => calcPass(Object.assign({}, REFERANS_GIRDI, ek, { K })).safety);
  const t8Fark = (ek) => { const [a, b] = t8(ek); return Math.abs(a - b); };
  const t8A = t8Fark({ epsIn: 0.05 });      // taban dışı
  const t8B = t8Fark({});                   // geçiş (referans pas: epsIn = 0)
  const t8C = t8Fark({ d1: 7.99 });         // tamamen taban üzerinde
  sonuc.push({
    id: 'T8', ad: 'K değişmezliğinin koşulu',
    aciklama: 'K = 315 ile K = 530 arasında emniyet oranı, taban devre dışıyken ve pasın tamamı taban üzerindeyken aynı kalmalı; geçiş bölgesinde ise değişmelidir — eps* = (70/K)^(1/n) K\'ya bağlıdır.',
    beklenen: 'A < 1e-9 · B > 1e-6 · C < 1e-9',
    bulunan: 'A ' + t8A.toExponential(1) + ' · B ' + t8B.toExponential(1) + ' · C ' + t8C.toExponential(1),
    gecti: t8A < 1e-9 && t8B > 1e-6 && t8C < 1e-9
  });

  // T9 — Sınır denetimi: modelin geçerli olmadığı girdi hesaba sokulmamalı.
  // Geçerli taban da sınanır; aksi hâlde "her şeyi reddet" diyen bir denetim de
  // testi geçerdi.
  const t9Taban = { d0: 8.00, dTarget: 1.38, alphaDeg: 8, mu: 0.05, K: 450, n: 0.35,
                    v0: 2.0, rho: RHO, cp: CP, sigmaB: 0, sigmaY0: SIGMA_Y0 };
  const t9Vakalar = [
    { ad: 'geçerli taban', girdi: {},              bekle: null },
    { ad: 'negatif μ',     girdi: { mu: -0.05 },   bekle: 'mu' },
    { ad: 'K = 0',         girdi: { K: 0 },        bekle: 'K' },
    { ad: 'n = 1,5',       girdi: { n: 1.5 },      bekle: 'n' },
    { ad: 'hedef > d0',    girdi: { dTarget: 9 },  bekle: 'dTarget' }
  ];
  const t9Sonuc = t9Vakalar.map(v => {
    const disinda = girdiDenetimi(Object.assign({}, t9Taban, v.girdi));
    const dogru = v.bekle === null ? disinda.length === 0 : disinda.includes(v.bekle);
    return { ad: v.ad, dogru };
  });
  sonuc.push({
    id: 'T9', ad: 'Sınır denetimi',
    aciklama: 'Modelin geçerli olmadığı girdiler (negatif μ, K = 0, n = 1,5, hedef çap > başlangıç çapı) hesaba sokulmadan reddedilmeli; geçerli taban ise kabul edilmeli.',
    beklenen: t9Vakalar.length + ' / ' + t9Vakalar.length,
    bulunan: t9Sonuc.filter(x => x.dogru).length + ' / ' + t9Sonuc.length +
             (t9Sonuc.every(x => x.dogru)
               ? ''
               : ' (kalan: ' + t9Sonuc.filter(x => !x.dogru).map(x => x.ad).join(', ') + ')'),
    gecti: t9Sonuc.every(x => x.dogru)
  });

  return sonuc;
}

/* ==== TASLAK GİRDİ KATMANI ====
   Bu aracın tek kuralı: HESAPLA'ya basılmadan ekrandaki hiçbir sayı değişmez.

   Kural iki nesneyle uygulanır:
     taslak — kullanıcının kutulara YAZDIĞI değerler. Yazarken anında güncellenir,
              anında denetlenir, ama hiçbir hesaba girmez.
     durum  — ekranda GÖSTERİLEN hesabın girdileri. Yalnızca hesapla() içinde,
              taslaktan tek seferde kopyalanarak değişir.

   Bu ayrım sayesinde "ekrandaki sayı hangi girdiyle üretildi" sorusunun tek bir
   cevabı vardır: durum. Sonuç boru hattının tamamı (buildSchedule, bandHesapla,
   duyarlilik*, csvUret, adresYaz) durum'dan okur ve hiç değişmedi. */

// Hesabı etkileyen alanlar. Bu listede olan her şey HESAPLA'yı bekler;
// olmayan her şey (dil, tema, seçili pas, karşılaştırma) anında uygulanır.
const HESAP_ALANLARI = ['d0', 'dTarget', 'alphaDeg', 'mu', 'K', 'n', 'v0', 'rho', 'cp',
                        'sigmaB', 'sigmaY0', 'method', 'passes'];

const taslak = {
  d0: durum.d0, dTarget: durum.dTarget, alphaDeg: durum.alphaDeg, mu: durum.mu,
  K: durum.K, n: durum.n, v0: durum.v0, rho: durum.rho, cp: durum.cp,
  sigmaB: durum.sigmaB, sigmaY0: durum.sigmaY0,
  method: durum.method,
  passes: durum.passes,
  anneals: durum.anneals.slice(),
  limit: { gucKW: null, hizMS: null, kalip: null },
  manuelCaplar: null,
  bant: { acik: durum.bant.acik, K: durum.bant.K.slice(),
          n: durum.bant.n.slice(), mu: durum.bant.mu.slice() }
};

// Son hesabın saati — "bu sayılar ne zaman üretildi" sorusunun cevabı.
let sonHesapSaati = null;

/* Taslağı ekrandaki hesaba eşitler. Adresten okuma, sayfa açılışı gibi
   durum'un dışarıdan doldurulduğu yollarda çağrılır. */
function taslagiDurumdanAl() {
  for (const k of HESAP_ALANLARI) taslak[k] = durum[k];
  taslak.anneals = durum.anneals.slice();
  taslak.manuelCaplar = durum.manuelCaplar ? durum.manuelCaplar.slice() : null;
  taslak.bant.acik = durum.bant.acik;
  for (const k of ['K', 'n', 'mu']) taslak.bant[k] = durum.bant[k].slice();
  for (const k of ['gucKW', 'hizMS', 'kalip']) taslak.limit[k] = durum.limit[k];
}

/* Taslağı ekrana geçirir: bu çağrıdan sonra durum artık kullanıcının yazdığıdır. */
function taslagiDuruma() {
  for (const k of HESAP_ALANLARI) durum[k] = taslak[k];
  durum.anneals = taslak.anneals.slice();
  durum.manuelCaplar = taslak.manuelCaplar ? taslak.manuelCaplar.slice() : null;
  durum.bant.acik = taslak.bant.acik;
  for (const k of ['K', 'n', 'mu']) durum.bant[k] = taslak.bant[k].slice();
  for (const k of ['gucKW', 'hizMS', 'kalip']) durum.limit[k] = taslak.limit[k];
}

const ayniDizi = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

/* Taslak ile ekrandaki hesap arasındaki farklar — kullanıcıya gösterilecek
   biçimde, etiketli. Boş dizi = ekrandaki sonuç güncel. */
function bekleyenDegisiklikler() {
  const M = S();
  const liste = [];
  const bas = { d0: 2, dTarget: 2, alphaDeg: 1, mu: 3, K: 0, n: 2, v0: 1,
                rho: 0, cp: 0, sigmaB: 1, sigmaY0: 0 };

  for (const k of ['d0', 'dTarget', 'alphaDeg', 'mu', 'K', 'n', 'v0', 'rho', 'cp',
                   'sigmaB', 'sigmaY0']) {
    if (taslak[k] === durum[k]) continue;
    liste.push(M.alan[k] + ': ' + fmt(durum[k], bas[k]) + ' → ' + fmt(taslak[k], bas[k]));
  }
  if (taslak.method !== durum.method) {
    liste.push(M.alan.method + ': ' + M.yontem[durum.method] + ' → ' + M.yontem[taslak.method]);
  }
  if (taslak.passes !== durum.passes) {
    const yaz = (v) => v === null ? M.otomatikYer : String(v);
    liste.push(M.alan.passes + ': ' + yaz(durum.passes) + ' → ' + yaz(taslak.passes));
  }
  if (!ayniDizi(taslak.anneals, durum.anneals)) {
    const yaz = (a) => a.length ? a.join(', ') : M.uyariYok;
    liste.push(M.tavlamaBekliyor + ': ' + yaz(durum.anneals) + ' → ' + yaz(taslak.anneals));
  }
  const manuelA = durum.manuelCaplar, manuelB = taslak.manuelCaplar;
  if (Boolean(manuelA) !== Boolean(manuelB) || (manuelA && manuelB && !ayniDizi(manuelA, manuelB))) {
    const yaz = (c) => c ? doldur(M.ozetPas, { n: c.length - 1 }) : M.uyariYok;
    liste.push(M.manuelBekliyor + ': ' + yaz(manuelA) + ' → ' + yaz(manuelB));
  }
  for (const k of ['gucKW', 'hizMS', 'kalip']) {
    if (taslak.limit[k] === durum.limit[k]) continue;
    const yaz = (v) => v === null ? M.uyariYok : fmt(v, k === 'kalip' ? 0 : 1);
    liste.push(M.makine.alan[k] + ': ' + yaz(durum.limit[k]) + ' → ' + yaz(taslak.limit[k]));
  }
  if (taslak.bant.acik !== durum.bant.acik) {
    const ak = (v) => v ? M.acikKapali.acik : M.acikKapali.kapali;
    liste.push(M.bantBekliyor + ': ' + ak(durum.bant.acik) + ' → ' + ak(taslak.bant.acik));
  } else if (taslak.bant.acik) {
    // Bant kapalıyken sınır değerleri hesaba girmez; fark sayılmaz.
    for (const k of ['K', 'n', 'mu']) {
      if (ayniDizi(taslak.bant[k], durum.bant[k])) continue;
      const b = { K: 0, n: 2, mu: 3 }[k];
      liste.push(M.bantBekliyor + ' · ' + M.bantAlan[k] + ': ' +
        durum.bant[k].map(v => fmt(v, b)).join('–') + ' → ' +
        taslak.bant[k].map(v => fmt(v, b)).join('–'));
    }
  }
  return liste;
}

// Toplam gerinim bu seviyeyi aşınca ara tavlama bilgi notu gösterilir.
const TAVLAMA_NOTU_ESIGI = 5.0;

// 70 MPa tabanının çekme gerilmesine katkısı bu payı aşarsa arayüz uyarı gösterir.
// Eşik projenin kendi sayısal toleransıdır (%0,5): tabanın etkisi tolerans kadar
// büyüdüğünde sayı artık bir modelleme tercihini taşıyor demektir.
const TABAN_UYARI_PAYI = 0.005;

/* ==== BİÇİMLENDİRME ==== */

const S = () => METIN[durum.dil];

/* Sayıyı dile göre biçimlendirir: Türkçede ondalık virgül, İngilizcede nokta.
   Binlik ayırıcı kullanılmaz. */
function fmt(sayi, basamak) {
  if (!Number.isFinite(sayi)) return '—';
  const s = sayi.toFixed(basamak);
  return durum.dil === 'tr' ? s.replace('.', ',') : s;
}

/* Kullanıcının yazdığı sayıyı okur: hem virgül hem nokta ondalık kabul edilir. */
function sayiOku(metin) {
  const t = String(metin).trim().replace(',', '.');
  if (t === '' || !/^-?\d*\.?\d+$/.test(t)) return NaN;
  return parseFloat(t);
}

/* Girdi kutusuna yazılacak metin. Değer, alanın gösterim basamağıyla tam olarak
   geri okunabiliyorsa biçimli yazılır (8 -> "8,00"); okunamıyorsa ham değer
   korunur (0,0523 -> "0,0523"). Böylece panel hizalı kalır ama paylaşılan
   bağlantıdaki hassasiyet sessizce yuvarlanmaz. */
const GIRDI_BASAMAK = { d0: 2, dTarget: 2, alphaDeg: 1, mu: 3, K: 0, n: 2, v0: 1,
                        rho: 0, cp: 0, sigmaB: 1, sigmaY0: 0 };
function girdiMetni(v, anahtar) {
  const basamak = GIRDI_BASAMAK[anahtar];
  const ham = String(v);
  const metin = (basamak !== undefined && Number(v.toFixed(basamak)) === v)
    ? v.toFixed(basamak)
    : ham;
  return durum.dil === 'tr' ? metin.replace('.', ',') : metin;
}

/* Şablondaki {anahtar} yerlerini doldurur. */
function doldur(sablon, degerler) {
  return String(sablon).replace(/\{(\w+)\}/g, (_, k) => (k in degerler ? degerler[k] : '{' + k + '}'));
}

/* Hesap hatasını seçili dile çevirir. Çekirdek kodları döndürür, metin buradan gelir. */
function hataMetni(err) {
  const H = S().hata;
  if (!(err instanceof DrawingError)) return err.message;
  const i = err.info || {};
  switch (err.code) {
    case 'R_TEORIK_ASIM':
      return doldur(i.pas ? H.R_TEORIK_ASIM : H.R_TEORIK_ASIM_TEK,
        { pas: i.pas, r: fmt(i.r * 100, 1), sinir: fmt(R_THEORETICAL_MAX * 100, 1) });
    case 'PAS_SAYISI_YAKINSAMADI': return doldur(H.PAS_SAYISI_YAKINSAMADI, { maks: MAX_PASSES });
    case 'BANT_ARALIK': return doldur(H.BANT_ARALIK, { alan: i.alan || '—' });
    case 'MANUEL_ARALIK_DISI': return doldur(H.MANUEL_ARALIK_DISI,
      { min: fmt(MANUAL_D_MIN, 2), maks: fmt(MANUAL_D_MAX, 0) });
    case 'MANUEL_SIRA': return doldur(H.MANUEL_SIRA,
      { sira: i.index + 1, deger: fmt(i.aday[i.index], 2) });
    default: return H[err.code] || err.message;
  }
}

/* ==== EŞİK DEĞERLENDİRMESİ ====
   Eşikler BÖLÜM 1'deki tablodan; sabitler hesap çekirdeğinde tanımlı. */

function safetyDurumu(v) { return v > SAFETY_CRITICAL ? 'crit' : v > SAFETY_WARNING ? 'warn' : 'ok'; }
function deltaDurumu(v)  { return (v < DELTA_MIN || v > DELTA_MAX) ? 'warn' : null; }
function dTDurumu(v)     { return v > DT_WARNING ? 'warn' : null; }

/* Hücrenin durum metni — renk körlüğü için renge ek olarak okunur bilgi. */
function durumMetni(sutun, deger) {
  const D = S().durum;
  if (sutun === 'safety') return D[safetyDurumu(deger)];
  if (sutun === 'delta')  return deger < DELTA_MIN ? D.deltaDusuk : deger > DELTA_MAX ? D.deltaYuksek : '';
  if (sutun === 'dT')     return deger > DT_WARNING ? D.isiYuksek : '';
  return '';
}

/* ==== ÖNERİ ====
   Genel geçer cümle yok: her cümle gerçek sayı taşır. */

/* Emniyet oranında belirgin bir tepe var mı? En yüksek pas, ikinciden en az
   %2 yüksekse "en riskli pas" demek anlamlıdır; değilse paslar aynı seviyededir. */
const TEPE_ESIGI = 0.02;

function belirginTepe(paslar) {
  if (paslar.length < 2) return true;
  const sirali = paslar.map(x => x.safety).sort((a, b) => b - a);
  return (sirali[0] - sirali[1]) / sirali[0] >= TEPE_ESIGI;
}

/* Tepe belirgin değilse aynı seviyedeki pasların aralığını verir. */
function esitBolge(paslar) {
  const enBuyuk = Math.max(...paslar.map(x => x.safety));
  const bolge = paslar.filter(x => x.safety >= enBuyuk * (1 - TEPE_ESIGI));
  // enBuyuk negatifse eşik ondan büyük çıkar ve bölge boş kalır. Girdi denetimi
  // bunu zaten engelliyor; yine de burada çökmek yerine "bölge yok" denir.
  if (bolge.length === 0) return null;
  return { ilk: bolge[0].no, son: bolge[bolge.length - 1].no, adet: bolge.length, emniyet: enBuyuk };
}


/* ==== MAKİNE KISITLARI ====
   Modelin sınırları fizikten gelir; bunlar fabrikadan gelir. Üçü de isteğe bağlıdır:
   boş bırakılan kısıt uygulanmaz. Girilen kısıt iki yerde çalışır — optimizasyon
   taraması kısıtı aşan adayı eler, ve ekrandaki program bir kısıtı aşarsa yorum
   kutusu hangi pasta ne kadar aşıldığını söyler.

   Kısıtlar hesabı DEĞİŞTİRMEZ, yalnızca değerlendirir: aynı program aynı sayıları
   verir, kısıt sadece "bu makinede koşar mı" sorusunu cevaplar. */
const MAKINE_SINIRLARI = {
  gucKW:  { alt: 0.1, ust: 5000 },   // pas başına mekanik güç
  hizMS:  { alt: 0.1, ust: 100 },    // hat çıkış hızı
  kalip:  { alt: 1,   ust: MAX_PASSES }
};

/* Programın makine kısıtlarını aşan yerleri. Boş kısıt denetlenmez. */
function makineAsimlari(prog, limit) {
  const asim = { guc: null, hiz: null, kalip: null };
  if (!limit) return asim;

  if (Number.isFinite(limit.gucKW)) {
    const enGuclu = prog.passes.reduce((a, b) => (b.P > a.P ? b : a));
    if (enGuclu.P / 1000 > limit.gucKW + 1e-9) {
      asim.guc = { no: enGuclu.no, deger: enGuclu.P / 1000, sinir: limit.gucKW };
    }
  }
  if (Number.isFinite(limit.hizMS) && prog.v1Line > limit.hizMS + 1e-9) {
    asim.hiz = { deger: prog.v1Line, sinir: limit.hizMS };
  }
  if (Number.isFinite(limit.kalip) && prog.passCount > limit.kalip) {
    asim.kalip = { deger: prog.passCount, sinir: limit.kalip };
  }
  return asim;
}

const makineUygun = (prog, limit) => {
  const a = makineAsimlari(prog, limit);
  return !a.guc && !a.hiz && !a.kalip;
};

/* ==== OPTİMİZASYON ====
   Soru: bu çaplar ve bu malzeme için kısıtları sağlayan EN İYİ program hangisi?
   Değişkenler: kalıp yarı açısı (tek değer — M-4 kabulü korunur), pas dağıtım
   yöntemi ve pas sayısı. Kısıtlar aracın kendi tarama eşikleridir.

   Sonuç bir MODEL optimumudur. Model sürtünmeyi kalıp açısından bağımsız sabit
   alır; kalıp aşınmasını, yağ filmi rejimini ve geri gerilimi görmez (kabuller.md).
   Yani "α'yı 5,2°'ye indir" önerisi modelde kazanç, sahada sürtünme artışı
   olabilir. Arayüz bu cümleyi sonucun yanında taşır.

   Tarama deterministiktir: aynı girdi her zaman aynı programı verir. buildSchedule
   saf fonksiyon olduğu için tarama yan etkisizdir. */
const OPT_ALPHA_MIN  = 4;     // derece — altı pratikte kalıp imalatı sınırı
const OPT_ALPHA_MAX  = 12;    // derece
const OPT_ALPHA_ADIM = 0.1;   // öneri cümleleri de açıyı 0,1° çözünürlükte veriyor
const OPT_KABA_ADIM  = 1;     // eşit emniyet pahalı: önce 1°, sonra ince tarama
const OPT_INCE_YARI  = 0.6;   // kaba en iyinin ±0,6° çevresi
const OPT_MAKS_PAS   = MAX_PASSES;

/* Kısıt büyüklükleri: hepsi pas tablosunda görünen sayılar, gizli ölçüt yok. */
function optKisit(prog) {
  const t = prog.passes;
  return {
    emniyet:  Math.max(...t.map(x => x.safety)),
    deltaAlt: Math.min(...t.map(x => x.delta)),
    deltaUst: Math.max(...t.map(x => x.delta)),
    dT:       Math.max(...t.map(x => x.dT)),
    r:        Math.max(...t.map(x => x.r))
  };
}

function optUygun(k) {
  return k.emniyet <= SAFETY_WARNING + 1e-9 &&
         k.deltaAlt >= DELTA_MIN - 1e-9 &&
         k.deltaUst <= DELTA_MAX + 1e-9 &&
         k.dT <= DT_WARNING + 1e-9 &&
         k.r <= R_THEORETICAL_MAX;
}

function optEnerji(prog) { return prog.totalPower / prog.massFlow / 3600; }

/* Amaç değeri — küçük olan iyidir. "En az kalıp" seçildiğinde beraberlik enerjiyle
   bozulur; böylece sıralama tam ve sonuç tekrarlanabilir olur. */
function optDeger(prog, amac) {
  const e = optEnerji(prog);
  return amac === 'kalip' ? prog.passCount * 1e6 + e : e;
}

function optAday(temel, alphaDeg, method, passes, limit) {
  let prog;
  try {
    prog = buildSchedule(Object.assign({}, temel, { alphaDeg, method, passes }));
  } catch (hata) {
    if (hata instanceof DrawingError) return null;   // aralık dışı aday: sessizce elenir
    throw hata;
  }
  const kisit = optKisit(prog);
  if (!optUygun(kisit)) return null;
  // Makine kısıtları modelin kısıtlarından SONRA denetlenir: önce fiziken geçerli
  // program, sonra "bu makinede koşar mı" sorusu.
  if (!makineUygun(prog, limit)) return null;
  return { prog, alphaDeg, method, kisit };
}

/* Hızlı yöntemler (eşit gerinim, kademeli azalan) tam ızgarada taranır; eşit
   emniyet çağrı başına ~70 ms sürdüğü için kaba-ince aramayla ve yalnızca kendi
   otomatik pas sayısıyla denenir — o yöntemde pas sayısı zaten hedefin sonucudur. */
function optimizeEt(temel, amac, limit = null) {
  let enIyi = null, kaba = null, denenen = 0;
  const dahaIyi = (a, b) => !b || optDeger(a.prog, amac) < optDeger(b.prog, amac);
  const dene = (alphaDeg, method, passes) => {
    denenen++;
    const aday = optAday(temel, alphaDeg, method, passes, limit);
    if (aday && dahaIyi(aday, enIyi)) enIyi = aday;
    return aday;
  };

  const adim = Math.round((OPT_ALPHA_MAX - OPT_ALPHA_MIN) / OPT_ALPHA_ADIM);
  for (let i = 0; i <= adim; i++) {
    const alphaDeg = Number((OPT_ALPHA_MIN + i * OPT_ALPHA_ADIM).toFixed(1));
    for (const method of ['equalStrain', 'tapered']) {
      for (let N = 1; N <= OPT_MAKS_PAS; N++) dene(alphaDeg, method, N);
    }
  }

  for (let a = OPT_ALPHA_MIN; a <= OPT_ALPHA_MAX + 1e-9; a += OPT_KABA_ADIM) {
    const aday = dene(Number(a.toFixed(1)), 'equalSafety', null);
    if (aday && dahaIyi(aday, kaba)) kaba = aday;
  }
  if (kaba) {
    const alt = Math.max(OPT_ALPHA_MIN, kaba.alphaDeg - OPT_INCE_YARI);
    const ust = Math.min(OPT_ALPHA_MAX, kaba.alphaDeg + OPT_INCE_YARI);
    for (let a = alt; a <= ust + 1e-9; a += OPT_ALPHA_ADIM) {
      dene(Number(a.toFixed(1)), 'equalSafety', null);
    }
  }

  return enIyi
    ? { bulundu: true, prog: enIyi.prog, alphaDeg: enIyi.alphaDeg, method: enIyi.method,
        kisit: enIyi.kisit, enerji: optEnerji(enIyi.prog), amac, denenen, limit }
    : { bulundu: false, amac, denenen, limit };
}

/* En riskli pasta emniyeti hedefe indirecek kesit azalmasını çözer. */
function guvenliAzalma(pas, params) {
  const eps = strainForSafety(TARGET_SAFETY, pas.epsIn, params);
  return 1 - Math.exp(-eps);
}

/* Delta'yı sınıra döndüren kalıp yarı açısı. Delta alfa ile doğrusaldır. */
function gerekliAci(pas, sinir) {
  return pas.alphaDeg * sinir / pas.delta;
}

function oneriCumleleri(prog) {
  const M = S();
  const cumleler = [];
  const params = { alphaRad: durum.alphaDeg * Math.PI / 180, mu: durum.mu, K: durum.K,
                   n: durum.n, sigmaB: durum.sigmaB };

  const riskli = prog.passes.reduce((a, b) => (b.safety > a.safety ? b : a));

  // Tek bir tepe yoksa bunu söyle: "en riskli pas" demek yanıltıcı olur (V3).
  const tepeBelirgin = belirginTepe(prog.passes) || prog.passes.length === 1;
  const bolge = tepeBelirgin ? null : esitBolge(prog.passes);
  if (bolge) {
    cumleler.push(doldur(M.oneriEsitBolge,
      { ilk: bolge.ilk, son: bolge.son, adet: bolge.adet, emniyet: fmt(bolge.emniyet, 3) }));
  }

  if (riskli.safety > SAFETY_WARNING) {
    const rYeni = guvenliAzalma(riskli, params);
    cumleler.push(doldur(M.oneriRiskli, {
      pas: riskli.no, emniyet: fmt(riskli.safety, 3),
      r0: fmt(riskli.r * 100, 1), r1: fmt(rYeni * 100, 1)
    }));
  } else {
    // Sınırın hemen altındaysa cümlenin tonu da bunu söylesin (C3).
    // Tepe belirgin değilse pas numarası tekrar edilmez, seviye zaten yukarıda yazıyor.
    const dar = riskli.safety >= SAFETY_WARNING * DAR_PAY_ORANI;
    cumleler.push(bolge && !dar
      ? M.oneriGuvenliBolge
      : doldur(dar ? M.oneriGuvenliDar : M.oneriGuvenli,
          { pas: riskli.no, emniyet: fmt(riskli.safety, 3) }));
  }

  const dusukDelta = prog.passes.filter(p => p.delta < DELTA_MIN)
    .reduce((a, b) => (a === null || b.delta < a.delta ? b : a), null);
  if (dusukDelta) {
    cumleler.push(doldur(M.oneriDeltaDusuk, {
      pas: dusukDelta.no, delta: fmt(dusukDelta.delta, 2),
      alpha: fmt(gerekliAci(dusukDelta, DELTA_MIN), 1)
    }));
  }

  const yuksekDelta = prog.passes.filter(p => p.delta > DELTA_MAX)
    .reduce((a, b) => (a === null || b.delta > a.delta ? b : a), null);
  if (yuksekDelta) {
    cumleler.push(doldur(M.oneriDeltaYuksek, {
      pas: yuksekDelta.no, delta: fmt(yuksekDelta.delta, 2),
      alpha: fmt(gerekliAci(yuksekDelta, DELTA_MAX), 1)
    }));
  }

  const sicak = prog.passes.reduce((a, b) => (b.dT > a.dT ? b : a));
  if (sicak.dT > DT_WARNING) {
    cumleler.push(doldur(M.oneriIsi, { pas: sicak.no, dT: fmt(sicak.dT, 1) }));
  }

  // Makine kısıtları: modelin değil fabrikanın sınırları. Girilmemişse sessizdir.
  const asim = makineAsimlari(prog, durum.limit);
  const MK = M.makine;
  if (asim.guc) {
    cumleler.push(doldur(MK.asimGuc, { no: asim.guc.no, deger: fmt(asim.guc.deger, 1),
                                       sinir: fmt(asim.guc.sinir, 1) }));
  }
  if (asim.hiz) {
    cumleler.push(doldur(MK.asimHiz, { deger: fmt(asim.hiz.deger, 1), sinir: fmt(asim.hiz.sinir, 1) }));
  }
  if (asim.kalip) {
    cumleler.push(doldur(MK.asimKalip, { deger: fmt(asim.kalip.deger, 0), sinir: fmt(asim.kalip.sinir, 0) }));
  }

  // Malzeme bakır dışına ayarlandıysa: K, n ve 70 MPa tabanı hâlâ bakıra göre.
  // Yoğunluğu değiştirip pekleşmeyi unutmak sessiz bir tutarsızlık olurdu.
  if (prog.passes[0].rho !== RHO || prog.passes[0].cp !== CP) {
    cumleler.push(M.oneriMalzeme);
  }

  return cumleler;
}

/* Programdaki aktif uyarılar: tür ve kaç pası etkilediği.
   Karşılaştırmada bu satır bir ödünleşim satırıdır, üstünlük satırı değil. */
function uyariSayimi(prog) {
  const say = {
    kopma: prog.passes.filter(p => p.safety > SAFETY_CRITICAL).length,
    delta: prog.passes.filter(p => p.delta < DELTA_MIN || p.delta > DELTA_MAX).length,
    isi:   prog.passes.filter(p => p.dT > DT_WARNING).length
  };
  const turler = Object.keys(say).filter(t => say[t] > 0);
  return { say, turler };
}

/* Girdilerin anlık görüntüsü — A sabitlenirken alınır, C2 için karşılaştırılır. */
function girdiGoruntusu(prog) {
  return {
    d0: durum.d0, dTarget: durum.dTarget, alphaDeg: durum.alphaDeg, mu: durum.mu,
    K: durum.K, n: durum.n, v0: durum.v0, rho: durum.rho, cp: durum.cp,
    sigmaB: durum.sigmaB, sigmaY0: durum.sigmaY0,
    method: durum.manuelCaplar ? 'manual' : durum.method,
    passes: durum.passes,                  // null = otomatik
    passCount: prog.passCount,
    anneals: durum.anneals.join(',')
  };
}

/* Programın karşılaştırma için özeti. */
function programOzeti(prog) {
  const riskli = prog.passes.reduce((a, b) => (b.safety > a.safety ? b : a));
  return {
    uyari: uyariSayimi(prog),
    girdi: girdiGoruntusu(prog),
    pas: prog.passCount,
    enYuksekEmniyet: riskli.safety,
    enRiskliPas: riskli.no,
    guc: prog.totalPower / 1000,
    enerji: prog.totalPower / prog.massFlow / 3600,
    uzama: (prog.passes[0].d0 / prog.passes[prog.passes.length - 1].d1) ** 2,
    cikisHizi: prog.v1Line
  };
}

/* ==== ARAYÜZ KURULUMU ==== */

const $ = (id) => document.getElementById(id);
const alanGirdileri = {};   // anahtar -> input elemanı
const alanHataSatirlari = {};   // anahtar -> hata metni elemanı
let yontemSecimi, pasSayisiGirdisi, pasSayisiIpucu, malzemeSecimi;

/* Program değişti: kalıp kesiti kaydırıcıları pasın kendi değerlerine döner.
   Kaydırıcı yalnızca kullanıcı ona dokunduğu sürece geçerlidir; aksi hâlde
   ekranda tabloya ait olmayan bir kesit kalır. Programı değiştiren HER yol
   buradan geçer. */
function programDegisti() {
  durum.kalipAlpha = null;
  durum.kalipR = null;
}

/* ==== GİRDİ DENETİMİ ====
   Kural çekirdekte (GIRDI_SINIRLARI); burası yalnızca kutuyu okur ve sonucu
   durum.alanHatalari'na yazar. Geçersiz değer durum'a HİÇ girmez: ekranda son
   geçerli hesap, üstünde "güncel değil" uyarısıyla durur. */

/* Manuel modda çap kutuları devre dışıdır ve program çap dizisinden gelir;
   o iki alan denetlenmez. */
function denetlenenAlanlar() {
  return taslak.manuelCaplar
    ? ALANLAR.filter(a => a.k !== 'd0' && a.k !== 'dTarget')
    : ALANLAR;
}

/* d0 ile dTarget birbirine bağlıdır: d0 değişince hedef çapın üst sınırı da
   değişir, bu yüzden çift birlikte denetlenir. */
function ciftCapDenetimi() {
  if (taslak.manuelCaplar) return;
  const hedef = sayiOku(alanGirdileri.dTarget.value);
  const s = girdiSiniri('dTarget', taslak.d0);
  if (!Number.isFinite(hedef)) durum.alanHatalari.dTarget = 'sayi';
  else if (hedef < s.alt || hedef >= s.ust) durum.alanHatalari.dTarget = 'aralik';
  else { taslak.dTarget = hedef; delete durum.alanHatalari.dTarget; }
}

/* Bir alanın kutusundaki metni okur ve geçerliyse durum'a yazar.
   Dönüş: kabul edilen değer, ya da geçersizse null. */
function alanDegeriniAl(anahtar) {
  const v = sayiOku(alanGirdileri[anahtar].value);
  if (!Number.isFinite(v)) { durum.alanHatalari[anahtar] = 'sayi'; return null; }
  const s = girdiSiniri(anahtar, anahtar === 'd0' ? v : taslak.d0);
  if (v < s.alt || v > s.ust || (anahtar === 'dTarget' && v === s.ust)) { durum.alanHatalari[anahtar] = 'aralik'; return null; }
  delete durum.alanHatalari[anahtar];
  taslak[anahtar] = v;
  if (anahtar === 'd0' || anahtar === 'dTarget') ciftCapDenetimi();
  return v;
}

/* Bütün alanları baştan denetler. Senaryo yükleme, dil değişimi ve manuel moda
   giriş gibi alanların topluca değiştiği yollarda çağrılır.
   Sınır denetimi kutudan değil DURUMDAN okunur: durum, kutunun yazdırma
   biçiminden hassastır (μ kutuda 3 hane, adreste 4), geri okumak paylaşılan
   bağlantıdaki değeri sessizce yuvarlardı. Kutuya yalnızca "okunabiliyor mu"
   diye bakılır. */
function butunAlanlariDenetle() {
  durum.alanHatalari = {};
  for (const a of denetlenenAlanlar()) {
    if (!Number.isFinite(sayiOku(alanGirdileri[a.k].value))) {
      durum.alanHatalari[a.k] = 'sayi';
      continue;
    }
    const s = girdiSiniri(a.k, taslak.d0);
    if (taslak[a.k] < s.alt || taslak[a.k] > s.ust || (a.k === 'dTarget' && taslak[a.k] === s.ust)) durum.alanHatalari[a.k] = 'aralik';
  }
}

function gecersizAlanVar() {
  return Object.keys(durum.alanHatalari).length > 0;
}

/* Alan hatalarını kutuların altına yazar ve bayat uyarısını yönetir.
   Renk tek başına bilgi taşımasın diye kutunun kenarlığı da değişir ve mesaj
   aria-describedby ile kutuya bağlıdır. */
function alanHatalariniYaz() {
  const M = S();
  const basamak = { d0: 2, dTarget: 2, alphaDeg: 1, mu: 3, K: 0, n: 2, v0: 1 };
  for (const a of ALANLAR) {
    const tur = durum.alanHatalari[a.k];
    const satir = alanHataSatirlari[a.k];
    const inp = alanGirdileri[a.k];
    inp.classList.toggle('gecersiz', Boolean(tur));
    inp.setAttribute('aria-invalid', String(Boolean(tur)));
    if (!tur) { satir.hidden = true; satir.textContent = ''; continue; }
    const s = girdiSiniri(a.k, taslak.d0);
    // Birim bir kez, üst uçta: "0,01 – 8,00 mm".
    satir.textContent = tur === 'sayi'
      ? M.hata.ALAN_SAYI
      : doldur(M.hata.ALAN_ARALIK, {
          alt: fmt(s.alt, basamak[a.k]),
          ust: fmt(s.ust, basamak[a.k]) + (a.birim ? ' ' + a.birim : '')
        });
    satir.hidden = false;
  }
  // Bayat kutusunu hesaplaDurumunuYaz() yazar: alan hatası ve bant hatası
  // aynı kutuyu paylaşır, iki yerden yazılırsa biri diğerini siler.
}

/* Küçük inline SVG ikonlar — emoji yok, 1,5 px kontur, currentColor. */
function ikon(tip) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', '16'); svg.setAttribute('height', '16');
  svg.setAttribute('viewBox', '0 0 16 16'); svg.setAttribute('fill', 'none');
  svg.setAttribute('aria-hidden', 'true');
  const yol = document.createElementNS(ns, 'path');
  const yollar = {
    ok: 'M4 6.5 L8 10.5 L12 6.5',                      // açılır liste oku
    onay: 'M3.5 8.5 L6.5 11.5 L12.5 5',                // onay işareti
    uyari: 'M8 2.5 L14.5 13.5 L1.5 13.5 Z M8 6.5 v3',  // uyarı üçgeni
    kritik: 'M8 2.5 L14.5 13.5 L1.5 13.5 Z M8 6 v3.5'  // tehlike üçgeni
  };
  yol.setAttribute('d', yollar[tip] || yollar.ok);
  yol.setAttribute('stroke', 'currentColor');
  yol.setAttribute('stroke-width', '1.5');
  yol.setAttribute('stroke-linecap', 'round');
  yol.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(yol);
  return svg;
}

function kurSenaryoDugmeleri() {

}

function kurPanel() {
  const panel = $('girdiPaneli');
  panel.textContent = '';

  /* Malzeme seçici panelin ilk kontrolü: beş alanı birden kurar. Tek tek girmek
     hem zahmetliydi hem de sessiz hataya açıktı — biri K ve n'i alüminyuma çevirip
     yoğunluğu bakırda unutabiliyordu (K-20'nin kapattığı hatanın yeni hâli). */
  const sarM = document.createElement('div');
  sarM.className = 'alan genis';
  const labM = document.createElement('label');
  labM.htmlFor = 'girdi-malzeme';
  labM.id = 'malzemeEtiketi';
  const secimM = document.createElement('div');
  secimM.className = 'secim';
  malzemeSecimi = document.createElement('select');
  malzemeSecimi.id = 'girdi-malzeme';
  const yardimM = document.createElement('p');
  yardimM.className = 'alan-yardim';
  yardimM.dataset.yardim = 'malzeme';
  malzemeSecimi.addEventListener('change', () => {
    const m = MALZEMELER.find(x => x.id === malzemeSecimi.value);
    if (!m) return;                       // "Özel" seçilemez, yalnızca gösterilir
    taslak.K = m.K; taslak.n = m.n; taslak.sigmaY0 = m.sigmaY0;
    taslak.rho = m.rho; taslak.cp = m.cp;
    // Bant da malzemeyle gelir: bakırın K aralığı çeliğin aralığı değildir.
    taslak.bant.K = m.bantK.slice();
    taslak.bant.n = m.bantN.slice();
    alanlariYaz();
    kurBantAlanlari();
    butunAlanlariDenetle();
    girdiDegisti();
  });
  secimM.append(malzemeSecimi, ikon('ok'));
  sarM.append(labM, secimM, yardimM);
  panel.appendChild(sarM);

  for (const a of ALANLAR) {
    const sar = document.createElement('div');
    sar.className = 'alan';
    const lab = document.createElement('label');
    lab.htmlFor = 'girdi-' + a.k;
    lab.dataset.alan = a.k;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'decimal';
    inp.id = 'girdi-' + a.k;
    inp.autocomplete = 'off';
    const hataSatiri = document.createElement('p');
    hataSatiri.className = 'alan-hatasi';
    hataSatiri.id = 'hata-' + a.k;
    hataSatiri.hidden = true;
    // Alanın ne demek olduğu kutunun hemen altında durur; ekran okuyucuya da
    // hata satırıyla birlikte bağlanır.
    const yardim = document.createElement('p');
    yardim.className = 'alan-yardim';
    yardim.id = 'yardim-' + a.k;
    yardim.dataset.yardim = a.k;
    inp.setAttribute('aria-describedby', yardim.id + ' ' + hataSatiri.id);
    inp.addEventListener('input', () => {
      // Değeri yalnızca okunabilir VE modelin geçerli olduğu aralıktaysa kabul et.
      // Aralık dışında hesap yapılmaz: sınırını bilen model, sessizce saçmalayandan iyidir.
      if (alanDegeriniAl(a.k) === null) { girdiDegisti(); return; }
      // K-01: başlangıç veya hedef çap elle değişince pas sayısı otomatiğe döner.
      if (a.k === 'd0' || a.k === 'dTarget') {
        taslak.passes = null;
        pasSayisiGirdisi.value = '';
        taslak.anneals = [];
      }
      girdiDegisti();
    });
    // Kutuda Enter: hesapla. Elle girip hemen sonucu görmenin en kısa yolu.
    inp.addEventListener('keydown', (olay) => {
      if (olay.key === 'Enter') { olay.preventDefault(); hesapla(); }
    });
    alanGirdileri[a.k] = inp;
    alanHataSatirlari[a.k] = hataSatiri;
    sar.append(lab, inp, yardim, hataSatiri);
    panel.appendChild(sar);
  }

  // Pas dağıtım yöntemi — özel stillenmiş select
  const sarY = document.createElement('div');
  sarY.className = 'alan genis';
  const labY = document.createElement('label');
  labY.htmlFor = 'girdi-method';
  labY.dataset.alan = 'method';
  const secimKabi = document.createElement('div');
  secimKabi.className = 'secim';
  yontemSecimi = document.createElement('select');
  yontemSecimi.id = 'girdi-method';
  for (const y of ['equalStrain', 'tapered', 'equalSafety']) {
    const o = document.createElement('option');
    o.value = y;
    yontemSecimi.appendChild(o);
  }
  yontemSecimi.addEventListener('change', () => {
    // K-01: yöntem değişiminde pas sayısı KORUNUR.
    taslak.method = yontemSecimi.value;
    girdiDegisti();
  });
  secimKabi.append(yontemSecimi, ikon('ok'));
  const yardimY = document.createElement('p');
  yardimY.className = 'alan-yardim';
  yardimY.dataset.yardim = 'method';
  sarY.append(labY, secimKabi, yardimY);
  panel.appendChild(sarY);

  // Pas sayısı — boş = Otomatik
  const sarP = document.createElement('div');
  sarP.className = 'alan genis';
  const labP = document.createElement('label');
  labP.htmlFor = 'girdi-passes';
  labP.dataset.alan = 'passes';
  const satir = document.createElement('div');
  satir.className = 'pas-sayisi-satiri';
  pasSayisiGirdisi = document.createElement('input');
  pasSayisiGirdisi.type = 'text';
  pasSayisiGirdisi.inputMode = 'numeric';
  pasSayisiGirdisi.id = 'girdi-passes';
  pasSayisiGirdisi.autocomplete = 'off';
  pasSayisiGirdisi.addEventListener('input', () => {
    const t = pasSayisiGirdisi.value.trim();
    taslak.passes = t === '' ? null : sayiOku(t);
    taslak.anneals = [];
    girdiDegisti();
  });
  pasSayisiGirdisi.addEventListener('keydown', (olay) => {
    if (olay.key === 'Enter') { olay.preventDefault(); hesapla(); }
  });
  const otoDugme = document.createElement('button');
  otoDugme.type = 'button';
  otoDugme.className = 'dugme sessiz';
  otoDugme.id = 'otomatigeDon';
  otoDugme.addEventListener('click', () => {
    taslak.passes = null;
    taslak.anneals = [];
    pasSayisiGirdisi.value = '';
    girdiDegisti();
  });
  satir.append(pasSayisiGirdisi, otoDugme);
  pasSayisiIpucu = document.createElement('p');
  pasSayisiIpucu.className = 'ipucu';
  pasSayisiIpucu.id = 'pasSayisiIpucu';
  const yardimP = document.createElement('p');
  yardimP.className = 'alan-yardim';
  yardimP.dataset.yardim = 'passes';
  sarP.append(labP, satir, yardimP, pasSayisiIpucu);
  panel.appendChild(sarP);
}
