/* ==== OLAYLAR ==== */

/* Senaryo düğmesi girdileri doldurur, hesaplamaz. Kural istisnasızdır:
   ekrandaki sayılar yalnızca HESAPLA ile değişir. */
function senaryoYukle(s) {
  taslak.d0 = s.d0; taslak.dTarget = s.dTarget; taslak.alphaDeg = s.alphaDeg;
  taslak.mu = s.mu; taslak.K = s.K; taslak.n = s.n; taslak.v0 = s.v0;
  taslak.rho = s.rho; taslak.cp = s.cp; taslak.sigmaB = s.sigmaB;
  taslak.sigmaY0 = s.sigmaY0;
  taslak.passes = null;          // K-01: senaryo düğmesi pas sayısını otomatiğe döndürür
  taslak.anneals = [];
  taslak.manuelCaplar = null;
  $('manuelMetin').value = '';
  manuelHatasiniYaz(null);
  alanlariYaz();
  butunAlanlariDenetle();
  girdiDegisti();
}

/* Manuel bölümün kendi hata satırı. Boş metin satırı temizler. */
function manuelHatasiniYaz(mesaj) {
  const k = $('manuelIpucu');
  k.textContent = mesaj || '';
  k.classList.toggle('alan-hatasi', Boolean(mesaj));
}

/* Manuel liste yalnızca girdilere alınır; hesap yine tek düğmeden yapılır.
   Sayfada "hesapla" anlamına gelen tek bir düğme vardır. */
function manuelHesapla() {
  try {
    manuelHatasiniYaz(null);
    taslak.manuelCaplar = parseManualSchedule($('manuelMetin').value);
    taslak.anneals = [];
    taslak.d0 = taslak.manuelCaplar[0];
    taslak.dTarget = taslak.manuelCaplar[taslak.manuelCaplar.length - 1];
    alanlariYaz();
    butunAlanlariDenetle();
    girdiDegisti();
    manuelHatasiniYaz(doldur(S().manuelAlindi, { n: taslak.manuelCaplar.length }));
    $('manuelIpucu').classList.remove('alan-hatasi');
  } catch (err) {
    // Liste okunamadı: ekrandaki program hâlâ geçerli ve tutarlı, ona dokunulmaz.
    // Hata kendi bölümünde durur; ana hata kutusu yalnızca hesap düşünce yanar.
    manuelHatasiniYaz(hataMetni(err));
  }
}

function manuelTemizle() {
  taslak.manuelCaplar = null;
  taslak.anneals = [];
  $('manuelMetin').value = '';
  manuelHatasiniYaz(null);
  alanlariYaz();
  butunAlanlariDenetle();
  girdiDegisti();
}

function dilDegistir(dil) {
  durum.dil = dil;
  document.documentElement.lang = dil;
  $('dilTR').setAttribute('aria-pressed', String(dil === 'tr'));
  $('dilEN').setAttribute('aria-pressed', String(dil === 'en'));
  tercihYaz('dil', dil);
  metinleriYaz();
  kurBantAlanlari();
  alanlariYaz();
  butunAlanlariDenetle();
  manuelHatasiniYaz(null);   // eski dildeki hata satırı kalmasın
  temaUygula();
  ciz();
}

function panelKatlaDegistir() {
  durum.panelAcik = !durum.panelAcik;
  paneliUygula();
  metinleriYaz();
}

/* Panel açık/kapalı görünümü. Kapalıyken yerinde tek satır özet durur. */
function paneliUygula() {
  $('girdiPaneli').hidden = !durum.panelAcik;
  $('panelOzet').hidden = durum.panelAcik;
  $('yontemGerekcesi').hidden = !durum.panelAcik;
  $('panelKatla').setAttribute('aria-expanded', String(durum.panelAcik));
}

/* Kapalı paneldeki özet: 8,00 -> 1,38 mm · eşit gerinim · 16 pas */
function ozetiYaz(prog) {
  const M = S();
  const kap = $('panelOzet');
  kap.textContent = '';
  const parca = (metin, sinif) => {
    const el = document.createElement('span');
    if (sinif) el.className = sinif;
    el.textContent = metin;
    return el;
  };
  const ayrac = () => parca('·', 'ayrac');
  kap.append(parca(fmt(durum.d0, 2) + ' → ' + fmt(durum.dTarget, 2) + ' mm'), ayrac());
  kap.append(parca(durum.manuelCaplar ? M.ozetManuel : M.ozetYontem[durum.method], 'sozcuk'));
  if (prog) {
    kap.append(ayrac(), parca(doldur(M.ozetPas, { n: prog.passCount })));
  }
}

/* ==== ÇİZİM ==== */

function metinleriYaz() {
  const M = S();
  document.title = M.baslik;
  for (const el of document.querySelectorAll('[data-t]')) {
    const anahtar = el.dataset.t;
    if (anahtar === 'gizle') { el.textContent = durum.panelAcik ? M.gizle : M.duzenle; continue; }
    if (M[anahtar] !== undefined) el.textContent = M[anahtar];
  }
  for (const el of document.querySelectorAll('[data-alan]')) {
    const a = ALANLAR.find(x => x.k === el.dataset.alan);
    el.textContent = M.alan[el.dataset.alan];
    if (a && a.birim) {
      const b = document.createElement('span');
      b.className = 'birim';
      b.textContent = ' ' + a.birim;
      el.appendChild(b);
    }
  }
  for (const el of document.querySelectorAll('[data-yardim]')) {
    el.textContent = M.alanYardim[el.dataset.yardim] || '';
  }
  for (const el of document.querySelectorAll('[data-sutun]')) {
    const s = SUTUNLAR.find(x => x.k === el.dataset.sutun);
    el.textContent = M.sutun[el.dataset.sutun];
    if (M.sutunYardim[el.dataset.sutun]) el.title = M.sutunYardim[el.dataset.sutun];
    if (s && s.birim) {
      const b = document.createElement('span');
      b.className = 'birim';
      b.textContent = s.birim;
      el.appendChild(b);
    }
  }
  for (const d of document.querySelectorAll('[data-senaryo]')) {
    const s = SENARYOLAR.find(x => x.id === d.dataset.senaryo);
    d.textContent = durum.dil === 'tr' ? s.tr : s.en;
  }
  for (const o of yontemSecimi.options) o.textContent = M.yontem[o.value];
  $('malzemeEtiketi').textContent = M.alan.malzeme;
  malzemeSecimi.textContent = '';
  for (const m of MALZEMELER) {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = durum.dil === 'tr' ? m.tr : m.en;
    malzemeSecimi.appendChild(o);
  }
  const ozel = document.createElement('option');
  ozel.value = 'ozel';
  ozel.textContent = M.malzemeOzel;
  malzemeSecimi.appendChild(ozel);
  malzemeleriYaz();
  $('otomatigeDon').textContent = M.otomatigeDon;
  pasSayisiGirdisi.placeholder = M.otomatikYer;
  $('manuelMetin').placeholder = durum.dil === 'tr' ? '8,00 7,16 6,40' : '8.00 7.16 6.40';
  girisiCiz();
  sozlukCiz();
  kalibMetinleri();
  yuvarlaMetinleri();
  makineMetinleri();
  optMetinleri();
}




/* ==== MAKİNE KISITLARI ARAYÜZÜ ====
   Üç kutu, hepsi isteğe bağlı. Boş kutu "kısıt yok" demektir; sıfır ya da geçersiz
   değer de boş sayılır — makine sınırı olarak sıfırın anlamı yok. Kısıt değişimi
   bekleyen değişiklik şeridine düşer, çünkü ekrandaki uyarıları değiştirir (K-16). */
const MAKINE_ALANLARI = ['gucKW', 'hizMS', 'kalip'];
const MAKINE_BIRIMLERI = { gucKW: 'kW', hizMS: 'm/s', kalip: '' };
const makineGirdileri = {};

function makinePaneliniKur() {
  const panel = $('makinePaneli');
  panel.textContent = '';
  for (const k of MAKINE_ALANLARI) {
    const sar = document.createElement('div');
    sar.className = 'alan';
    const lab = document.createElement('label');
    lab.htmlFor = 'makine-' + k;
    lab.id = 'makineEtiket-' + k;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'decimal';
    inp.id = 'makine-' + k;
    inp.autocomplete = 'off';
    const yardim = document.createElement('p');
    yardim.className = 'alan-yardim';
    yardim.id = 'makineYardim-' + k;
    inp.addEventListener('input', () => {
      const v = sayiOku(inp.value);
      const s = MAKINE_SINIRLARI[k];
      // Sınır dışı ya da okunamayan değer "kısıt yok" sayılır; hesap durmaz.
      taslak.limit[k] = (Number.isFinite(v) && v >= s.alt && v <= s.ust) ? v : null;
      inp.classList.toggle('gecersiz', inp.value.trim() !== '' && taslak.limit[k] === null);
      girdiDegisti();
    });
    inp.addEventListener('keydown', (olay) => {
      if (olay.key === 'Enter') { olay.preventDefault(); hesapla(); }
    });
    makineGirdileri[k] = inp;
    sar.append(lab, inp, yardim);
    panel.appendChild(sar);
  }
}

function makineMetinleri() {
  const M = S().makine;
  $('makineBaslik').textContent = M.baslik;
  $('makineAciklama').textContent = M.aciklama;
  for (const k of MAKINE_ALANLARI) {
    const lab = $('makineEtiket-' + k);
    lab.textContent = M.alan[k];
    if (MAKINE_BIRIMLERI[k]) {
      const b = document.createElement('span');
      b.className = 'birim';
      b.textContent = ' ' + MAKINE_BIRIMLERI[k];
      lab.appendChild(b);
    }
    $('makineYardim-' + k).textContent = M.yardim[k];
    makineGirdileri[k].placeholder = M.yer;
  }
}

function makineAlanlariniYaz() {
  for (const k of MAKINE_ALANLARI) {
    const inp = makineGirdileri[k];
    if (document.activeElement === inp) continue;
    inp.value = taslak.limit[k] === null ? '' : String(taslak.limit[k]);
  }
}

/* ==== YUVARLAMA ARAYÜZÜ ====
   Ekrandaki programın çaplarını kalıp adımına oturtur ve manuel program olarak
   girdilere alır. Ekrandaki sayılar HESAPLA'ya kadar değişmez (K-16). */
let sonYuvarlaSonuc = null;

function yuvarlaMetinleri() {
  const Y = S().yuvarla;
  $('yuvarlaBaslik').textContent = Y.baslik;
  $('yuvarlaAciklama').textContent = Y.aciklama + (sonProgram ? '' : ' ' + Y.hesapYok);
  $('yuvarlaAdimEtiketi').textContent = Y.adim;
  const birim = document.createElement('span');
  birim.className = 'birim';
  birim.textContent = ' mm';
  $('yuvarlaAdimEtiketi').appendChild(birim);
  $('yuvarlaCalistir').textContent = Y.calistir;
  $('yuvarlaCalistir').disabled = !sonProgram;
  $('yuvarlaUygula').textContent = Y.uygula;
  $('yuvarlaUyari').textContent = Y.uyari;

  const sec = $('yuvarlaAdim');
  const onceki = sec.value;
  sec.textContent = '';
  for (const adim of YUVARLAMA_ADIMLARI) {
    const o = document.createElement('option');
    o.value = String(adim);
    o.textContent = fmt(adim, 2) + ' mm';
    sec.appendChild(o);
  }
  sec.value = onceki || '0.05';
  yuvarlaSonucuCiz(sonYuvarlaSonuc);
}

function yuvarlaSonucuCiz(sonuc) {
  const Y = S().yuvarla;
  $('yuvarlaSonuc').hidden = !sonuc;
  $('yuvarlaDurum').hidden = true;
  if (!sonuc) return;

  const liste = $('yuvarlaListe');
  liste.textContent = '';
  const satir = (metin) => {
    const li = document.createElement('li');
    li.textContent = metin;
    liste.appendChild(li);
  };

  if (sonuc.durum === 'cakisma') {
    $('yuvarlaUygula').hidden = true;
    $('yuvarlaOzet').textContent = doldur(Y.cakisma,
      { ilk: sonuc.ilk, son: sonuc.son, deger: fmt(sonuc.deger, 3) });
    return;
  }
  if (sonuc.durum !== 'tamam') {
    $('yuvarlaUygula').hidden = true;
    $('yuvarlaOzet').textContent = Y.gecersizAdim;
    return;
  }
  if (sonuc.degisen === 0) {
    $('yuvarlaUygula').hidden = true;
    $('yuvarlaOzet').textContent = doldur(Y.degismedi, { adim: fmt(sonuc.adim, 2) });
    return;
  }

  $('yuvarlaUygula').hidden = false;
  $('yuvarlaOzet').textContent = doldur(Y.ozet,
    { degisen: fmt(sonuc.degisen, 0), sapma: fmt(sonuc.sapma, 3) });
  // Hangi çapın nereye gittiği tek tek yazılır: yuvarlama görünmez bir işlem olmamalı.
  for (let i = 1; i < sonuc.caplar.length - 1; i++) {
    if (sonuc.caplar[i] === sonuc.eski[i]) continue;
    satir(fmt(sonuc.eski[i], 3) + ' → ' + fmt(sonuc.caplar[i], 3) + ' mm');
  }
}

function yuvarlaCalistir() {
  if (!sonProgram) return;
  const adim = sayiOku($('yuvarlaAdim').value);
  const eski = [sonProgram.passes[0].d0].concat(sonProgram.passes.map(x => x.d1));
  const sonuc = caplariYuvarla(eski, adim);
  sonYuvarlaSonuc = Object.assign({}, sonuc, { eski });
  yuvarlaSonucuCiz(sonYuvarlaSonuc);
}

function yuvarlaUygula() {
  if (!sonYuvarlaSonuc || sonYuvarlaSonuc.durum !== 'tamam' || sonYuvarlaSonuc.degisen === 0) return;
  const caplar = sonYuvarlaSonuc.caplar;
  taslak.manuelCaplar = caplar.slice();
  taslak.d0 = caplar[0];
  taslak.dTarget = caplar[caplar.length - 1];
  taslak.anneals = [];       // pas dizisi değişti: eski tavlama işaretleri anlamsız
  $('manuelMetin').value = caplar.map(x => girdiMetni(x)).join(' ');
  manuelHatasiniYaz(null);
  alanlariYaz();
  butunAlanlariDenetle();
  girdiDegisti();
  $('yuvarlaDurum').textContent = S().yuvarla.uygulandi;
  $('yuvarlaDurum').hidden = false;
}

/* ==== KALİBRASYON ARAYÜZÜ ====
   Ölçüm ekrandaki programın bir pasına aittir; pas listesi her hesapla birlikte
   yenilenir. Çözülen mu ekrandaki sayıları değiştirmez, girdilere alınır (K-16). */
let sonKalibSonuc = null;

function kalibMetinleri() {
  const C = S().kalib;
  $('kalibBaslik').textContent = C.baslik;
  $('kalibAciklama').textContent = C.aciklama;
  $('kalibPasEtiketi').textContent = C.pas;
  $('kalibKuvvetEtiketi').textContent = C.kuvvet;
  const birim = document.createElement('span');
  birim.className = 'birim';
  birim.textContent = ' N';
  $('kalibKuvvetEtiketi').appendChild(birim);
  $('kalibCoz').textContent = C.coz;
  $('kalibUygula').textContent = C.uygula;
  $('kalibUyari').textContent = C.uyari;
  kalibPaslariYaz(sonProgram);
  kalibSonucuCiz(sonKalibSonuc);
}

/* Pas listesi: ekrandaki programın pasları. Program yoksa liste boşalır ve
   çözme düğmesi kapanır — kalibrasyonun dayanacağı geometri yoktur. */
function kalibPaslariYaz(prog) {
  const C = S().kalib;
  const sec = $('kalibPas');
  const onceki = sec.value;
  sec.textContent = '';
  const varMi = Boolean(prog);
  $('kalibCoz').disabled = !varMi;
  if (!varMi) {
    $('kalibAciklama').textContent = C.aciklama + ' ' + C.hesapYok;
    return;
  }
  $('kalibAciklama').textContent = C.aciklama;
  for (const pas of prog.passes) {
    const o = document.createElement('option');
    o.value = String(pas.no);
    o.textContent = doldur(C.pasSecenek, { no: pas.no, d0: fmt(pas.d0, 3), d1: fmt(pas.d1, 3) });
    sec.appendChild(o);
  }
  // Kullanıcının seçtiği pas yeni programda da varsa korunur.
  if (onceki && prog.passes.some(x => String(x.no) === onceki)) sec.value = onceki;
}

function kalibSonucuCiz(sonuc) {
  const C = S().kalib;
  $('kalibSonuc').hidden = !sonuc;
  $('kalibDurum').hidden = true;
  if (!sonuc) return;

  const liste = $('kalibListe');
  liste.textContent = '';
  const satir = (metin) => {
    const li = document.createElement('li');
    li.textContent = metin;
    liste.appendChild(li);
  };

  if (sonuc.durum !== 'tamam') {
    $('kalibUygula').hidden = true;
    $('kalibOzet').textContent =
      sonuc.durum === 'dusuk' ? doldur(C.dusuk, { sinir: fmt(sonuc.sinirKuvvet, 0) })
      : sonuc.durum === 'yuksek' ? doldur(C.yuksek, { ust: fmt(GIRDI_SINIRLARI.mu.ust, 2), sinir: fmt(sonuc.sinirKuvvet, 0) })
      : C.gecersiz;
    return;
  }

  $('kalibUygula').hidden = false;
  $('kalibOzet').textContent = doldur(C.sonuc, { mu: fmt(sonuc.mu, 4), eski: fmt(taslak.mu, 3) });
  satir(doldur(C.gerilme, { F: fmt(sonuc.F, 0), A: fmt(sonuc.A1, 3), sigma: fmt(sonuc.sigmaD, 1) }));
  satir(doldur(C.fark, { eski: fmt(sonuc.eskiSafety, 3), yeni: fmt(sonuc.yeniSafety, 3) }));
}

function kalibCoz() {
  const C = S().kalib;
  if (!sonProgram) return;
  const pas = sonProgram.passes.find(x => String(x.no) === $('kalibPas').value) || sonProgram.passes[0];
  const F = sayiOku($('kalibKuvvet').value);

  if (!Number.isFinite(F) || F <= 0) {
    sonKalibSonuc = { durum: 'gecersiz' };
    kalibSonucuCiz(sonKalibSonuc);
    return;
  }

  // Çekme gerilmesi ÇIKIŞ kesitinde tanımlıdır: sigma_d = F / A1.
  const sigmaOlculen = F / pas.A1;
  const geometri = { d0: pas.d0, d1: pas.d1, epsIn: pas.epsIn, alphaDeg: pas.alphaDeg,
                     K: pas.K, n: pas.n, v0: pas.v0, rho: pas.rho, cp: pas.cp,
                     sigmaB: pas.sigmaB, sigmaY0: pas.sigmaY0 };
  const cozum = muCoz(sigmaOlculen, geometri);

  if (cozum.durum !== 'tamam') {
    sonKalibSonuc = Object.assign({}, cozum,
      { sinirKuvvet: cozum.sinir !== undefined ? cozum.sinir * pas.A1 : null });
  } else {
    const yeni = calcPass(Object.assign({}, geometri, { mu: cozum.mu }));
    sonKalibSonuc = { durum: 'tamam', mu: cozum.mu, F, A1: pas.A1, sigmaD: sigmaOlculen,
                      eskiSafety: pas.safety, yeniSafety: yeni.safety };
  }
  kalibSonucuCiz(sonKalibSonuc);
}

function kalibUygula() {
  if (!sonKalibSonuc || sonKalibSonuc.durum !== 'tamam') return;
  // Girdi alanı 0,005 alt sınırıyla çalışır; çözüm daha düşükse sınıra oturtulur.
  taslak.mu = Math.min(GIRDI_SINIRLARI.mu.ust,
                       Math.max(GIRDI_SINIRLARI.mu.alt, Number(sonKalibSonuc.mu.toFixed(4))));
  alanlariYaz();
  butunAlanlariDenetle();
  girdiDegisti();
  $('kalibDurum').textContent = S().kalib.uygulandi;
  $('kalibDurum').hidden = false;
}

/* ==== OPTİMİZASYON ARAYÜZÜ ====
   Bölüm girdi tarafının yardımcısıdır: bulduğu programı ekrana yazmaz, girdilere
   alır ve bekleyen değişiklik şeridini açar. Ekrandaki sayıları değiştiren tek
   şey HESAPLA olmaya devam eder (K-16). */
let optAmac = 'enerji';
let sonOptSonuc = null;

function optMetinleri() {
  const O = S().opt;
  $('optBaslik').textContent = O.baslik;
  $('optAciklama').textContent = doldur(O.aciklama, {
    emniyet: fmt(SAFETY_WARNING, 2), dmin: fmt(DELTA_MIN, 1),
    dmax: fmt(DELTA_MAX, 1), dt: fmt(DT_WARNING, 0)
  });
  $('optAmacEnerji').textContent = O.amac.enerji;
  $('optAmacKalip').textContent = O.amac.kalip;
  $('optCalistir').textContent = O.calistir;
  $('optUygula').textContent = O.uygula;
  $('optUyari').textContent = O.uyari;
  $('optAmacEnerji').setAttribute('aria-pressed', String(optAmac === 'enerji'));
  $('optAmacKalip').setAttribute('aria-pressed', String(optAmac === 'kalip'));
  optSonucuCiz(sonOptSonuc);
}

/* Tarama sonucunu yazar. Karşılaştırma ekrandaki hesaba göredir; hesap yoksa
   yalnızca bulunan programın kendi sayıları gösterilir. */
function optSonucuCiz(sonuc) {
  const O = S().opt;
  const kap = $('optSonuc');
  kap.hidden = !sonuc;
  $('optDurum').hidden = true;
  if (!sonuc) return;

  const liste = $('optListe');
  liste.textContent = '';
  const satir = (metin) => {
    const li = document.createElement('li');
    li.textContent = metin;
    liste.appendChild(li);
  };

  // Uygulanan makine kısıtları her iki sonuçta da yazılır: "bulunamadı" cevabının
  // sebebi çoğu zaman fizik değil, girilen makine sınırıdır.
  const kisitMetni = () => {
    const L = sonuc.limit, MK = S().makine, parcalar = [];
    if (L && Number.isFinite(L.gucKW)) parcalar.push(MK.alan.gucKW + ' ≤ ' + fmt(L.gucKW, 1) + ' kW');
    if (L && Number.isFinite(L.hizMS)) parcalar.push(MK.alan.hizMS + ' ≤ ' + fmt(L.hizMS, 1) + ' m/s');
    if (L && Number.isFinite(L.kalip)) parcalar.push(MK.alan.kalip + ' ≤ ' + fmt(L.kalip, 0));
    return parcalar.length ? doldur(O.makineKisiti, { liste: parcalar.join(' · ') }) : null;
  };

  if (!sonuc.bulundu) {
    $('optOzet').textContent = O.yok;
    $('optUygula').hidden = true;
    const km = kisitMetni();
    if (km) satir(km);
    satir(doldur(O.denenen, { n: fmt(sonuc.denenen, 0) }));
    return;
  }

  $('optUygula').hidden = false;
  $('optOzet').textContent = doldur(O.ozet, {
    n: fmt(sonuc.prog.passCount, 0), alpha: fmt(sonuc.alphaDeg, 1),
    yontem: S().yontem[sonuc.method], enerji: fmt(sonuc.enerji, 1)
  });

  // Karşılaştırma tabanı: ekranda duran hesap. Yoksa tek taraflı yazılır.
  const taban = sonProgram;
  if (taban) {
    const eskiEnerji = taban.totalPower / taban.massFlow / 3600;
    const oran = (sonuc.enerji - eskiEnerji) / eskiEnerji * 100;
    satir(doldur(O.enerji, {
      eski: fmt(eskiEnerji, 1), yeni: fmt(sonuc.enerji, 1),
      fark: (oran >= 0 ? '+' : '−') + fmt(Math.abs(oran), 1) + '%'
    }));
    satir(doldur(O.pas, { eski: fmt(taban.passCount, 0), yeni: fmt(sonuc.prog.passCount, 0) }));
    satir(doldur(O.aci, { eski: fmt(taban.passes[0].alphaDeg, 1), yeni: fmt(sonuc.alphaDeg, 1) }));
  } else {
    satir(doldur(O.enerjiTek, { yeni: fmt(sonuc.enerji, 1) }));
  }

  satir(doldur(O.emniyet, { yeni: fmt(sonuc.kisit.emniyet, 3), esik: fmt(SAFETY_WARNING, 2) }));
  satir(doldur(O.delta, {
    alt: fmt(sonuc.kisit.deltaAlt, 2), ust: fmt(sonuc.kisit.deltaUst, 2),
    dmin: fmt(DELTA_MIN, 1), dmax: fmt(DELTA_MAX, 1)
  }));
  satir(doldur(O.isi, { dt: fmt(sonuc.kisit.dT, 1), esik: fmt(DT_WARNING, 0) }));
  const km = kisitMetni();
  if (km) satir(km);
  satir(doldur(O.denenen, { n: fmt(sonuc.denenen, 0) }));
}

/* Tarama ~2 saniye sürer ve tek iş parçacığında koşar; düğme önce "Taranıyor…"
   yazıp bir kare beklemezse kullanıcı hiçbir tepki görmeden donmuş bir sayfayla
   kalır. requestAnimationFrame + setTimeout, boyamanın araya girmesini sağlar. */
function optCalistir() {
  const O = S().opt;
  const dugme = $('optCalistir');
  if (dugme.disabled) return;
  dugme.disabled = true;
  dugme.textContent = O.calisiyor;

  const temel = {
    d0: taslak.d0, dTarget: taslak.dTarget, mu: taslak.mu,
    K: taslak.K, n: taslak.n, v0: taslak.v0, rho: taslak.rho, cp: taslak.cp,
    sigmaB: taslak.sigmaB, sigmaY0: taslak.sigmaY0,
    anneals: taslak.anneals.slice()
  };

  requestAnimationFrame(() => setTimeout(() => {
    try {
      sonOptSonuc = optimizeEt(temel, optAmac, Object.assign({}, taslak.limit));
      optSonucuCiz(sonOptSonuc);
    } finally {
      dugme.disabled = false;
      dugme.textContent = S().opt.calistir;
    }
  }, 0));
}

/* Bulunan programı girdilere alır. Hesap KOŞULMAZ: bekleyen değişiklik şeridi
   açılır, kullanıcı ne değiştiğini görür ve HESAPLA'ya kendisi basar. */
function optUygula() {
  if (!sonOptSonuc || !sonOptSonuc.bulundu) return;
  taslak.alphaDeg = sonOptSonuc.alphaDeg;
  taslak.method = sonOptSonuc.method;
  taslak.passes = sonOptSonuc.prog.passCount;
  taslak.manuelCaplar = null;
  alanlariYaz();
  butunAlanlariDenetle();
  girdiDegisti();
  $('optDurum').textContent = S().opt.uygulandi;
  $('optDurum').hidden = false;
}

function optAmacSec(amac) {
  optAmac = amac;
  sonOptSonuc = null;      // amaç değişti: eski sonuç artık bu amacın cevabı değil
  optSonucuCiz(null);
  optMetinleri();
}

/* Giriş kartı: aracın ne yaptığı ve üç adımlık kullanımı. Sonuca bağlı değildir,
   hesap beklemez; dil değişiminde yeniden yazılır. */
function girisiCiz() {
  const g = S().giris;
  $('girisBaslik').textContent = g.baslik;
  $('girisOzet').textContent = g.ozet;
  $('girisOrnek').textContent = g.ornek;
  $('girisSinir').textContent = g.sinir;
  $('girisKarar').textContent = g.karar;
  const ol = $('girisAdimlar');
  ol.textContent = '';
  for (const adim of g.adimlar) {
    const li = document.createElement('li');
    const ad = document.createElement('strong');
    ad.textContent = adim.ad;
    li.append(ad, document.createTextNode(adim.metin));
    ol.appendChild(li);
  }
}

/* Sütun sözlüğü: tablo başlıklarının düz karşılığı. Başlık ipuçları (title)
   dokunmatik ekranda görünmez, bu yüzden aynı metin burada da durur. */
function sozlukCiz() {
  const M = S();
  $('sozlukBasligi').textContent = M.sozlukBaslik;
  const dl = $('sozlukListesi');
  dl.textContent = '';
  const yaz = (anahtar, birim) => {
    if (!M.sutunYardim[anahtar]) return;
    const dt = document.createElement('dt');
    dt.textContent = M.sutun[anahtar] + (birim ? ' (' + birim + ')' : '');
    const dd = document.createElement('dd');
    dd.textContent = M.sutunYardim[anahtar];
    dl.append(dt, dd);
  };
  for (const s of SUTUNLAR) yaz(s.k, s.birim);
  yaz('anneal', '');
}

/* Girdi kutularına durumu yazar; kullanıcının yazmakta olduğu kutuya dokunmaz. */
function alanlariYaz() {
  for (const a of ALANLAR) {
    const inp = alanGirdileri[a.k];
    if (document.activeElement === inp) continue;
    inp.value = girdiMetni(taslak[a.k], a.k);
  }
  yontemSecimi.value = taslak.method;
  if (document.activeElement !== pasSayisiGirdisi) {
    pasSayisiGirdisi.value = taslak.passes === null ? '' : String(taslak.passes);
  }
  $('bantAnahtari').checked = taslak.bant.acik;
  makineAlanlariniYaz();
  malzemeleriYaz();
}

/* Seçili malzeme taslaktan türetilir, ayrı bir durum alanı tutulmaz: kullanıcı
   K'yı elle değiştirdiği anda liste kendiliğinden "Özel"e düşer ve yanlış bir
   malzeme adı ekranda kalmaz. */
function malzemeleriYaz() {
  if (!malzemeSecimi) return;
  const m = malzemeBul(taslak);
  malzemeSecimi.value = m ? m.id : 'ozel';
}

function bilgiGoster(mesaj) {
  const k = $('bilgiKutusu');
  if (!mesaj) { k.hidden = true; return; }
  k.textContent = mesaj;
  k.hidden = false;
}

/* Pas satırının görüntülenecek değerleri — sütun anahtarlarıyla eşleşir. */
function satirDegerleri(p) {
  return { no: p.no, d0: p.d0, d1: p.d1, rPct: p.r * 100, epsOut: p.epsOut,
           sigmaBar: p.sigmaBar, sigmaFOut: p.sigmaFOut, sigmaD: p.sigmaD,
           safety: p.safety, delta: p.delta, dT: p.dT, v1: p.v1, PkW: p.P / 1000 };
}

/* Özet şeridi: beş büyüklük + hattın çıkış hızı. */
/* Karar satırı: "kaç kalıp, kopar mı" sorusunun cevabı, tablodan önce.
   Emniyet değeri özet şeridiyle aynı kaynaktan gelir — bant açıkken bandın üst
   ucu, kapalıyken nominal değer — ki iki yerde iki farklı sayı görünmesin. */
function kararCiz(g) {
  const M = S();
  const kutu = $('kararKutusu');
  kutu.hidden = !g;
  if (!g) return;

  const o = g.ozet;
  const paslar = g.prog.passes;
  const capMetni = (v) => fmt(v, v >= 1 ? 2 : 3);
  const emniyetDeger = sonBant ? sonBant.enYuksekEmniyet[1] : o.enYuksekEmniyet;
  const sinif = safetyDurumu(emniyetDeger);
  const oranMetni = sonBant
    ? fmt(sonBant.enYuksekEmniyet[0], 3) + ' – ' + fmt(sonBant.enYuksekEmniyet[1], 3)
    : fmt(o.enYuksekEmniyet, 3);

  $('kararOzet').textContent = doldur(M.karar.ozet, {
    d0: capMetni(paslar[0].d0),
    d1: capMetni(paslar[paslar.length - 1].d1),
    n: fmt(o.pas, 0)
  });

  const asan = paslar.filter(x => x.safety > SAFETY_WARNING).length;
  const sayim = asan === 0 ? M.karar.temiz
    : asan === 1 ? M.karar.asanTek
    : doldur(M.karar.asan, { n: fmt(asan, 0) });

  // V3: tek bir tepe yoksa "en kritik pas" demek yanıltıcıdır — öneri cümleleri
  // bu ayrımı zaten yapıyor, karar satırı da aynı ölçütü kullanır.
  const tepeBelirgin = belirginTepe(paslar) || paslar.length === 1;
  const bolge = tepeBelirgin ? null : esitBolge(paslar);
  const kritikMetin = bolge
    ? doldur(M.karar.kritikBolge, {
        adet: fmt(bolge.adet, 0), ilk: fmt(bolge.ilk, 0), son: fmt(bolge.son, 0),
        oran: oranMetni, esik: fmt(SAFETY_WARNING, 2)
      })
    : doldur(M.karar.kritik, {
        pas: fmt(o.enRiskliPas, 0), oran: oranMetni, esik: fmt(SAFETY_WARNING, 2)
      });
  $('kararAlt').textContent = kritikMetin + ' · ' + sayim;

  const rozet = $('kararRozet');
  rozet.className = 'rozet ' + sinif;
  rozet.textContent = M.karar.rozet[sinif];
}

function ozetSeridiniCiz(g) {
  const M = S();
  const kap = $('ozetSeridi');
  kap.textContent = '';
  if (!g) return;
  const o = g.ozet;

  const hucre = (anahtar, deger, birim, not, sinif) => {
    const el = document.createElement('div');
    el.className = 'hucre' + (sinif ? ' ' + sinif : '');
    const et = document.createElement('span');
    et.className = 'etiket';
    et.textContent = M.ozetAlan[anahtar];
    const dg = document.createElement('span');
    dg.className = 'deger';
    const sayi = document.createElement('span');
    sayi.textContent = deger;
    dg.appendChild(sayi);
    if (birim) {
      const b = document.createElement('span');
      b.className = 'birim';
      b.textContent = birim;
      dg.appendChild(b);
    }
    el.append(et, dg);
    if (not) {
      const n = document.createElement('span');
      n.className = 'not';
      n.textContent = not;
      el.appendChild(n);
    }
    kap.appendChild(el);
  };

  // Bant açıkken emniyet, güç ve enerji tek sayı değil aralık gösterir; eşik
  // rengi bandın üst ucuna göre seçilir.
  const emniyetDeger = sonBant ? sonBant.enYuksekEmniyet[1] : o.enYuksekEmniyet;
  const emniyetSinif = safetyDurumu(emniyetDeger);
  const aralik = (b, bas) => fmt(b[0], bas) + ' – ' + fmt(b[1], bas);
  hucre('pas', fmt(o.pas, 0), '', '');
  // V3: tek bir tepe yoksa tek pas numarası yazmak yanıltıcı olur. Karar satırı
  // ve öneri cümleleri aynı ölçütü kullanıyor; şerit de aynı dili konuşur.
  const tepeBelirgin = belirginTepe(g.prog.passes) || g.prog.passes.length === 1;
  const tepeBolge = tepeBelirgin ? null : esitBolge(g.prog.passes);
  const pasNotu = tepeBolge
    ? doldur(M.ozetBolgeNotu, { ilk: tepeBolge.ilk, son: tepeBolge.son })
    : doldur(M.ozetPasNotu, { n: o.enRiskliPas });
  hucre('enRiskli', sonBant ? aralik(sonBant.enYuksekEmniyet, 3) : fmt(o.enYuksekEmniyet, 3), '',
        pasNotu + ' · ' + M.durum[emniyetSinif], emniyetSinif);
  hucre('guc', sonBant ? aralik(sonBant.guc, 1) : fmt(o.guc, 1), 'kW', '');
  hucre('enerji', sonBant ? aralik(sonBant.enerji, 1) : fmt(o.enerji, 1), 'kWh/t', '');
  hucre('uzama', fmt(o.uzama, 1), '×', '');
  hucre('cikisHizi', fmt(o.cikisHizi, 1), 'm/s', '');
  if (sonBant) {
    const note = document.createElement('p');
    note.className = 'ipucu';
    note.style.gridColumn = '1 / -1';
    note.textContent = durum.dil === 'tr'
      ? 'Nominal sonuç: oran ' + fmt(o.enYuksekEmniyet, 3) + ' · ' + fmt(o.guc, 1) + ' kW · ' + fmt(o.enerji, 1) + ' kWh/t. Yukarıdaki bant ayrı alt/üst girdilerden hesaplanır; nominal K, n veya μ değişimi sabit çap dizisinde bandı değiştirmez.'
      : 'Nominal result: ratio ' + fmt(o.enYuksekEmniyet, 3) + ' · ' + fmt(o.guc, 1) + ' kW · ' + fmt(o.enerji, 1) + ' kWh/t. The band uses separate bounds; nominal K, n or μ changes do not change the band for a fixed diameter schedule.';
    kap.appendChild(note);
  }
}

/* Öneri: gerçek sayı taşıyan cümleler. */
function oneriyiCiz(g) {
  const kap = $('oneriKutusu');
  kap.textContent = '';
  kap.hidden = !g;
  if (!g) return;
  const scope = document.createElement('span');
  scope.textContent = durum.dil === 'tr'
    ? 'Oran = çekme gerilmesi / çıkış akma gerilmesi; düşük olması daha iyidir. 0,50 / 0,60, Δ 1,5–3 ve ΔT 100 °C bu aracın tarama eşikleridir; kopma olasılığı veya üretim onayı değildir. ΔT, mutlak tel sıcaklığı değildir.'
    : 'Ratio = drawing stress / exit flow stress; lower is better. 0.50 / 0.60, Δ 1.5–3 and ΔT 100 °C are screening thresholds, not a fracture probability or production approval. ΔT is not the absolute wire temperature.';
  kap.appendChild(scope);
  /* Taban uyarısı. Eşik pasın ÇIKIŞINA değil, tabanın sonuca KATKISINA bakar:
     belirleyici olan integral aralığının eps* eşiğini kesip kesmediğidir, çıkışın
     nerede olduğu değil. Çıkışa bakan bir koşul, hatanın projenin kendi %0,5
     toleransını aştığı r ≈ %10–0,25 bandını tamamen kaçırır. */
  const enBuyukTabanPayi = Math.max(...g.prog.passes.map(p => p.tabanPayi));
  if (enBuyukTabanPayi > TABAN_UYARI_PAYI) {
    const note = document.createElement('span');
    const yuzde = fmt(enBuyukTabanPayi * 100, 1);
    note.textContent = durum.dil === 'tr'
      ? 'Düşük gerinim uyarısı: bu programda çekme gerilmesinin %' + yuzde + ' kadarı 70 MPa tabanından geliyor, Hollomon pekleşmesinden değil. Taban bir modelleme tercihidir; bu bölgede sayılar malzeme deneyiyle kalibre edilmeden kullanılmamalı ve K değişmezliği geçerli değildir.'
      : 'Low-strain warning: ' + yuzde + '% of the drawing stress in this schedule comes from the 70 MPa floor rather than Hollomon hardening. The floor is a modelling choice; calibrate against a material test before relying on these numbers here, and K invariance does not hold.';
    kap.appendChild(note);
  }
  if (g.bant) {
    const bandNote = document.createElement('span');
    bandNote.textContent = durum.dil === 'tr'
      ? 'Aşağıdaki pas önerileri nominal program içindir. Köşe taramasındaki en yüksek oran: ' + fmt(g.bant.enYuksekEmniyet[1], 3) + '.'
      : 'Pass suggestions below apply to the nominal schedule. Highest corner-scan ratio: ' + fmt(g.bant.enYuksekEmniyet[1], 3) + '.';
    kap.appendChild(bandNote);
  }
  for (const c of g.oneriler) {
    const satir = document.createElement('span');
    satir.textContent = c;
    kap.appendChild(satir);
  }
}

/* Karşılaştırma: A sabitlenmişse B ile yan yana ve fark satırı. */
function karsilastirmayiCiz(g) {
  const M = S();
  const A = durum.karsilastirmaA;
  $('karsilastirSabitle').textContent = M.karsilastirSabitle;
  $('karsilastirSabitle').disabled = !g;
  $('karsilastirKapat').hidden = !A;
  $('karsilastirmaKabi').hidden = !(A && g);
  $('degisenGirdiler').hidden = !(A && g);
  if (!A || !g) return;

  const B = g.karsilastirmaB;
  const basSatir = $('karsilastirmaBaslik');
  basSatir.textContent = '';
  for (const b of ['', M.karsilastirA, M.karsilastirB, M.karsilastirFark]) {
    const th = document.createElement('th');
    th.scope = 'col';
    th.textContent = b;
    basSatir.appendChild(th);
  }

  degisenGirdileriYaz(A.girdi, B.girdi);

  const govde = $('karsilastirmaGovde');
  govde.textContent = '';
  const satirlar = [
    { k: 'pas', bas: 0, a: A.pas, b: B.pas, azIyi: true },
    { k: 'enYuksekEmniyet', bas: 3, a: A.enYuksekEmniyet, b: B.enYuksekEmniyet, azIyi: true },
    { k: 'guc', bas: 1, a: A.guc, b: B.guc, azIyi: true },
    { k: 'enerji', bas: 1, a: A.enerji, b: B.enerji, azIyi: true }
  ];
  for (const s of satirlar) {
    const tr = document.createElement('tr');
    const ad = document.createElement('td');
    ad.textContent = M.karsilastirSatir[s.k];
    const a = document.createElement('td');
    a.textContent = fmt(s.a, s.bas);
    const b = document.createElement('td');
    b.textContent = fmt(s.b, s.bas);
    const fark = document.createElement('td');
    const d = s.b - s.a;
    const yuzde = s.a === 0 ? 0 : d / s.a * 100;
    // Pas ve emniyet mutlak farkla, güç ve enerji yüzdeyle okunur.
    fark.textContent = (d > 0 ? '+' : d < 0 ? '−' : '') +
      (s.k === 'pas' || s.k === 'enYuksekEmniyet'
        ? fmt(Math.abs(d), s.bas)
        : '%' + fmt(Math.abs(yuzde), 1));
    if (Math.abs(d) > 1e-9) fark.className = (d < 0) === s.azIyi ? 'fark-iyi' : 'fark-kotu';
    tr.append(ad, a, b, fark);
    govde.appendChild(tr);
  }

  // Uyarı satırı (C1): ödünleşimi gösterir, bu yüzden kazanan tarafı boyanmaz.
  const uyariHucresi = (u) => {
    const td = document.createElement('td');
    if (u.turler.length === 0) { td.textContent = M.uyariYok; return td; }
    td.textContent = u.turler.length + ' (' +
      u.turler.map(t => M.uyariTur[t]).join(' · ') + ')';
    td.title = u.turler.map(t => doldur(M.uyariPasSayisi,
      { tur: M.uyariTur[t], n: u.say[t] })).join(' · ');
    return td;
  };
  const uyariSatiri = document.createElement('tr');
  const uyariAd = document.createElement('td');
  uyariAd.textContent = M.karsilastirSatir.uyarilar;
  const bosFark = document.createElement('td');
  bosFark.textContent = '—';
  uyariSatiri.append(uyariAd, uyariHucresi(A.uyari), uyariHucresi(B.uyari), bosFark);
  govde.appendChild(uyariSatiri);
}

/* C2 · A ile B arasında hangi girdilerin değiştiğini yazar.
   Bu satır olmadan, farklı girdilerle üretilmiş iki program sessizce
   karşılaştırılır ve yanlış bir sonuç savunulur. */
function degisenGirdileriYaz(a, b) {
  const M = S();
  const kap = $('degisenGirdiler');
  kap.textContent = '';

  const basamak = { d0: 2, dTarget: 2, alphaDeg: 1, mu: 3, K: 0, n: 2, v0: 1 };
  const degisenler = [];

  for (const alan of ALANLAR) {
    if (Math.abs(a[alan.k] - b[alan.k]) > 1e-12) {
      degisenler.push(M.alan[alan.k] + ' ' + fmt(a[alan.k], basamak[alan.k]) +
        ' → ' + fmt(b[alan.k], basamak[alan.k]));
    }
  }

  const yontemAdi = (g) => g.method === 'manual' ? M.ozetManuel : M.ozetYontem[g.method];
  const yontemDegisti = a.method !== b.method;
  if (yontemDegisti) {
    degisenler.push(M.alan.method + ' ' + yontemAdi(a) + ' → ' + yontemAdi(b));
  }

  const pasMetni = (g) => fmt(g.passCount, 0) + (g.passes === null ? ' (' + M.degisenOtomatik + ')' : '');
  if (a.passCount !== b.passCount || (a.passes === null) !== (b.passes === null)) {
    degisenler.push(M.alan.passes + ' ' + pasMetni(a) + ' → ' + pasMetni(b));
  }

  if (a.anneals !== b.anneals) {
    degisenler.push(M.sutun.anneal + ': ' + (a.anneals || M.uyariYok) +
      ' → ' + (b.anneals || M.uyariYok));
  }

  if (degisenler.length === 0) {
    kap.textContent = M.degisenHicbiri;
    kap.className = 'degisen temiz';
    return;
  }
  // Yalnızca yöntem (ve onun getirdiği otomatik pas sayısı) değiştiyse karşılaştırma
  // temiz sayılır; başka bir girdi değiştiyse bu vurgulanır.
  const sadeceYontem = degisenler.every(m =>
    m.startsWith(M.alan.method) || m.startsWith(M.alan.passes));
  if (sadeceYontem && yontemDegisti) {
    kap.textContent = M.degisenYok;
    kap.className = 'degisen temiz';
    return;
  }
  kap.className = 'degisen';
  const bas = document.createElement('b');
  bas.textContent = M.degisenBaslik + ' ';
  kap.appendChild(bas);
  kap.appendChild(document.createTextNode(degisenler.join(' · ')));
}

/* Ana çizim: hesabı yapar, tabloyu ve ipuçlarını yeniler. */
/* Görünüm modeli: ekranda görünecek HER ŞEYİ hesaplar ve DOM'a hiç dokunmaz.
   Buradan bir istisna çıkarsa tek bir panel bile yazılmaz. Ekranda birbirine ait
   olmayan sayıların yan yana durması bu ayrımla imkânsız hâle gelir. */
function gorunumHesapla() {
  const manuel = durum.manuelCaplar !== null;
  const prog = manuel
    ? buildSchedule({ method: 'manual', diameters: durum.manuelCaplar,
        alphaDeg: durum.alphaDeg, mu: durum.mu, K: durum.K, n: durum.n,
        v0: durum.v0, rho: durum.rho, cp: durum.cp, sigmaB: durum.sigmaB,
        sigmaY0: durum.sigmaY0, anneals: durum.anneals })
    : buildSchedule({ d0: durum.d0, dTarget: durum.dTarget, method: durum.method,
        passes: durum.passes, alphaDeg: durum.alphaDeg, mu: durum.mu, K: durum.K,
        n: durum.n, v0: durum.v0, rho: durum.rho, cp: durum.cp, sigmaB: durum.sigmaB,
        sigmaY0: durum.sigmaY0, anneals: durum.anneals });

  // Seçili pas artık yoksa (pas sayısı düştüyse) ilk pasa dönülür.
  const secilenPas = prog.passes.find(x => x.no === durum.secilenPas) || prog.passes[0];

  return {
    manuel, prog, secilenPas,
    // Belirsizlik bandı: açıksa köşe taraması burada bir kez yapılır.
    bant: durum.bant.acik ? bandHesapla(prog) : null,
    ozet: programOzeti(prog),
    oneriler: oneriCumleleri(prog),
    karsilastirmaB: durum.karsilastirmaA ? programOzeti(prog) : null,
    tornadoEmniyet: duyarlilikEmniyet(secilenPas),
    tornadoEnerji: duyarlilikEnerji(prog)
  };
}

/* Hesaplanmış görünümü tek seferde yazar. Buradaki her satır saf DOM yazımıdır;
   hesap yoktur, dolayısıyla yarıda kesilecek bir şey de yoktur. */
function gorunumuYaz(g) {
  const M = S();
  sonGorunum = g;
  sonProgram = g.prog;
  sonBant = g.bant;
  durum.secilenPas = g.secilenPas.no;

  $('hataKutusu').hidden = true;
  $('hataKutusu').textContent = '';

  // Pas sayısı ipucu: seçili yöntemin kendi otomatik değeri (K-07).
  pasSayisiIpucu.textContent = g.prog.autoPassCount === null
    ? (durum.dil === 'tr' ? 'Otomatik hedefe 60 pasta ulaşılamıyor; elle seçilen program gösteriliyor.' : 'Automatic target not reached within 60 passes; showing the specified schedule.')
    : doldur(M.otomatikIpucu, { n: g.prog.autoPassCount });

  // Bilgi notu: manuel mod veya yüksek toplam gerinimde ara tavlama hatırlatması.
  if (g.manuel) {
    bilgiGoster(doldur(M.manuelAktif, { n: g.prog.passCount }));
  } else if (g.prog.epsTotal >= TAVLAMA_NOTU_ESIGI && durum.anneals.length === 0) {
    bilgiGoster(doldur(M.tavlamaNotu, { eps: fmt(g.prog.epsTotal, 2) }));
  } else {
    bilgiGoster(null);
  }

  ozetiYaz(g.prog);
  $('ozetSeridi').hidden = false;

  bantKoselerCiz();
  kararCiz(g);
  kalibPaslariYaz(g.prog);
  sonYuvarlaSonuc = null;
  yuvarlaMetinleri();
  ozetSeridiniCiz(g);
  oneriyiCiz(g);
  karsilastirmayiCiz(g);
  tabloyuCiz(g.prog);
  gorselleriCiz(g);
  duyarlilikCiz(g);
  sonucDugmeleri(true);
  adresYaz();
}

/* Sonucu dışa aktaran düğmeler. Program yokken hepsi kapanır: indirilecek,
   yazdırılacak ya da paylaşılacak tutarlı bir hesap yok. */
function sonucDugmeleri(etkin) {
  for (const id of ['csvIndir', 'yazdir', 'baglantiKopyala']) $(id).disabled = !etkin;
  $('karsilastirSabitle').disabled = !etkin;
  if (!etkin) $('paylasimDurumu').hidden = true;
}

/* Tutarlı "hesaplanamadı" durumu: bütün paneller aynı anda boşalır.
   Hiçbir etiket bir önceki hesaptan kalmaz — bayat sayı göstermektense hiçbir şey
   göstermemek doğrudur. */
function hesaplanamadiDurumu(hata) {
  const M = S();
  sonGorunum = null;
  sonProgram = null;
  sonBant = null;

  $('hataKutusu').textContent = M.hata.baslik + ' ' + hataMetni(hata);
  $('hataKutusu').hidden = false;
  bilgiGoster(null);
  pasSayisiIpucu.textContent = '';

  ozetiYaz(null);
  $('ozetSeridi').hidden = true;

  bantKoselerCiz();
  kararCiz(null);
  kalibPaslariYaz(null);
  sonYuvarlaSonuc = null;
  yuvarlaMetinleri();
  ozetSeridiniCiz(null);
  oneriyiCiz(null);
  karsilastirmayiCiz(null);
  tabloyuCiz(null);
  gorselleriCiz(null);
  duyarlilikCiz(null);
  sonucDugmeleri(false);
}

/* ==== GİRDİ KABUĞU / HESAP AYRIMI ====

   kabuguTazele()  girdi tarafını yeniler: kutuların etkin-pasif durumu, alan
                   hataları, bekleyen değişiklik göstergeleri. Sonuç panellerine
                   HİÇ dokunmaz — bir tuş vuruşu buradan öteye geçemez.
   girdiDegisti()  kullanıcı bir girdiyi değiştirdi. Tek yaptığı kabuğu tazelemek.
   hesapla()       HESAPLA düğmesi. Taslağı durum'a geçirir ve ciz() ile ekranın
                   tamamını bir kerede yeniler. Ekrandaki sayıları değiştiren
                   TEK yol budur.
   ciz()           durum'daki hesabı ekrana yazar. Girdi okumaz, taslağa bakmaz;
                   dil, tema, seçili pas gibi görünüm değişimlerinde de çağrılır
                   ve aynı sayıları üretir. */

/* Girdi tarafı. Sonuç panelleri bu fonksiyonun görüş alanında değildir. */
function kabuguTazele() {
  const M = S();
  // Kutular TASLAĞA göre kilitlenir: manuel listeyi alır almaz çap kutuları kapanır,
  // hesap henüz yapılmamış olsa bile.
  const manuel = taslak.manuelCaplar !== null;

  yontemSecimi.disabled = manuel;
  pasSayisiGirdisi.disabled = manuel;
  // Zaten otomatik moddayken "Otomatik'e dön" işlevsizdir — pasif olsun.
  $('otomatigeDon').disabled = manuel || taslak.passes === null;
  alanGirdileri.d0.disabled = manuel;
  alanGirdileri.dTarget.disabled = manuel;
  $('yontemGerekcesi').textContent = manuel ? '' : M.yontemGerekcesi[taslak.method];
  $('bantAlanlari').hidden = !taslak.bant.acik;
  paneliUygula();
  alanHatalariniYaz();
  guvenPaneliniYaz();
  hesaplaDurumunuYaz();
}

/* Bir girdi değişti. Ekranda tek bir sayı bile değişmez; yalnızca
   "hesaplanmayı bekliyor" göstergeleri güncellenir. */
function girdiDegisti() {
  // Seçili malzeme taslaktan türetilir; K elle değişince liste kendiliğinden
  // "Özel"e düşsün diye burada tazelenir. Metin kutularına dokunmaz.
  malzemeleriYaz();
  kabuguTazele();
}

/* HESAPLA. Taslak geçerliyse ekrana geçirilir ve her şey bir kerede yenilenir.
   Dönüş: hesap çalıştırıldı mı. */
function hesapla() {
  bantGirdileriniDenetle();
  if (gecersizAlanVar() || !bantGecerli) { kabuguTazele(); return false; }
  taslagiDuruma();
  programDegisti();          // kalıp kesiti kaydırıcıları pasın kendi değerine döner
  sonHesapSaati = new Date();
  ciz();
  return true;
}

/* Bekleyen değişiklikleri atar: taslağı ekranda duran hesaba geri döndürür. */
function degisiklikleriGeriAl() {
  taslagiDurumdanAl();
  alanlariYaz();
  kurBantAlanlari();
  manuelHatasiniYaz(null);
  butunAlanlariDenetle();
  bantGecerli = true;
  ciz();                     // tavlama kutuları ve tablo taslaktan okur, yeniden çizilmeli
}

/* Saat damgası — "ekrandaki sayılar ne zaman üretildi". */
function saatMetni(t) {
  try {
    return t.toLocaleTimeString(durum.dil === 'tr' ? 'tr-TR' : 'en-GB',
      { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch (err) {
    return [t.getHours(), t.getMinutes(), t.getSeconds()]
      .map(x => String(x).padStart(2, '0')).join(':');
  }
}

/* Hesapla düğmesi, bekleyen şeridi ve yapışkan çubuk tek yerden yazılır:
   üç göstergede farklı sayı görünmesi böylece imkânsızdır. */
function hesaplaDurumunuYaz() {
  const M = S();
  const gecersiz = gecersizAlanVar() || !bantGecerli;
  const degisenler = gecersiz ? [] : bekleyenDegisiklikler();
  const bekliyor = degisenler.length > 0;

  const dugme = $('hesaplaDugmesi');
  dugme.textContent = M.hesaplaDugmesi;
  dugme.disabled = gecersiz;
  dugme.classList.toggle('bekliyor', bekliyor);

  const satir = $('hesaplaDurumu');
  satir.classList.remove('guncel', 'bekliyor', 'gecersiz');
  if (gecersiz) {
    satir.textContent = M.hesaplaGecersiz;
    satir.classList.add('gecersiz');
  } else if (bekliyor) {
    satir.textContent = degisenler.length === 1
      ? M.hesaplaBekliyorTek
      : doldur(M.hesaplaBekliyor, { n: degisenler.length });
    satir.classList.add('bekliyor');
  } else {
    satir.textContent = M.hesaplaGuncel + (sonHesapSaati
      ? ' ' + doldur(M.hesapDamgasi, { saat: saatMetni(sonHesapSaati) }) : '');
    satir.classList.add('guncel');
  }
  $('hesaplaKisayol').textContent = M.hesaplaIpucu;
  $('hesaplaAciklama').textContent = M.hesaplaAciklama;

  // Bekleyen değişiklik şeridi — hangi girdinin neye gittiği tek tek yazılır.
  const kutu = $('bekleyenKutusu');
  kutu.hidden = !bekliyor;
  if (bekliyor) {
    $('bekleyenBaslik').textContent = M.bekleyenBaslik;
    $('bekleyenGovde').textContent = M.bekleyenGovde;
    const liste = $('bekleyenListe');
    liste.textContent = '';
    for (const d of degisenler) {
      const li = document.createElement('li');
      li.textContent = d;
      liste.appendChild(li);
    }
    $('bekleyenHesapla').textContent = M.bekleyenDugme;
    $('bekleyenGeriAl').textContent = M.bekleyenGeriAl;
  }

  // Geçersiz girdi kutusu: alan hatası ya da bant sınırı.
  const bayat = $('bayatKutusu');
  if (!bantGecerli) { bayat.textContent = bantHataMetni(); bayat.hidden = false; }
  else if (gecersizAlanVar()) { bayat.textContent = M.bayatUyarisi; bayat.hidden = false; }
  else bayat.hidden = true;

  // Sonuçlar girdiyle ayrıştığı sürece soluk durur: "bu sayılar yazdığın
  // girdiye ait değil" rengin kendisiyle de söylenir.
  for (const id of ['ozetBolumu', 'gorselBolumu', 'pasBolumu', 'bantBolumu', 'duyarlilikBolumu']) {
    $(id).classList.toggle('bayat-sonuc', bekliyor || gecersiz);
  }

  // Yapışkan çubuk: sayfa uzun, girdi yukarıda. Yalnızca bekleyen varken görünür.
  const cubuk = $('yapiskanCubuk');
  cubuk.hidden = !bekliyor;
  document.body.classList.toggle('cubuk-acik', bekliyor);
  if (bekliyor) {
    $('yapiskanMetin').textContent = degisenler.length === 1
      ? M.yapiskanBekliyorTek
      : doldur(M.yapiskanBekliyor, { n: degisenler.length });
    $('yapiskanHesapla').textContent = M.hesaplaDugmesi;
  }
}

/* Ekrandaki hesabı (durum) yazar. Sıra değişmez: DOM'a dokunmayan hesap, sonra
   tek seferde yazım. Biri düşerse ekran tutarlı bir bütün olarak kalır;
   yarısı yeni yarısı eski bir görünüm oluşamaz. */
function ciz() {
  kabuguTazele();

  // 1) Hesap — DOM'a dokunmadan.
  let g = null, hata = null;
  try { g = gorunumHesapla(); } catch (err) { hata = err; }
  if (!g) { hesaplanamadiDurumu(hata); return; }

  // 2) Yazım. Beklenmedik bir çizim hatasında bile yarım görünüm bırakılmaz.
  try { gorunumuYaz(g); } catch (err) { hesaplanamadiDurumu(err); }
}

/* Dar ekranda (< 720 px) pas tablosu karta dönüşür: 12 sütunlu yatay kaydırma
   yerine her pas kendi kartında. Tabloyla kart aynı anda kurulmaz. */
const DAR_EKRAN = window.matchMedia('(max-width: 719px)');

function kartlariCiz(prog) {
  const M = S();
  const kap = $('pasKartlari');
  kap.textContent = '';
  if (!prog) return;

  const ikincilAlanlar = ['rPct', 'epsOut', 'sigmaBar', 'sigmaFOut', 'sigmaD', 'delta', 'dT', 'v1', 'PkW'];
  for (const p of prog.passes) {
    const deger = satirDegerleri(p);
    const bantSatiri = sonBant ? sonBant.paslar[p.no - 1] : null;
    const kart = document.createElement('article');
    kart.className = 'pas-karti' + (p.anneal ? ' tavlandi' : '') +
      (p.no === durum.secilenPas ? ' secili' : '');

    // Üst satır: pas numarası ve ara tavlama kutusu
    const ust = document.createElement('div');
    ust.className = 'kart-ust';
    const no = document.createElement('span');
    no.className = 'kart-no';
    no.textContent = M.sutun.no + ' ' + fmt(p.no, 0);
    const tavlamaEtiketi = document.createElement('label');
    tavlamaEtiketi.className = 'kart-tavlama';
    const kutu = document.createElement('span');
    kutu.className = 'kutu';
    const giris = document.createElement('input');
    giris.type = 'checkbox';
    // Kutu TASLAĞI gösterir: işaretlemek hesabı değil, bekleyen girdiyi değiştirir.
    // Satırın "tavlandı" stili ise hesaplanmış programdan gelir (p.anneal).
    giris.checked = taslak.anneals.includes(p.no);
    giris.setAttribute('aria-label', M.sutun.anneal + ' — ' + M.sutun.no + ' ' + p.no);
    giris.addEventListener('change', () => {
      taslak.anneals = giris.checked
        ? taslak.anneals.concat(p.no).sort((a, b) => a - b)
        : taslak.anneals.filter(x => x !== p.no);
      girdiDegisti();
    });
    const gorsel = document.createElement('span');
    gorsel.className = 'gorsel';
    gorsel.appendChild(ikon('onay'));
    kutu.append(giris, gorsel);
    const tavlamaMetni = document.createElement('span');
    tavlamaMetni.textContent = M.sutun.anneal;
    tavlamaEtiketi.append(kutu, tavlamaMetni);
    ust.append(no, tavlamaEtiketi);

    // Orta satır: büyük çap geçişi ve emniyet rozeti
    const orta = document.createElement('div');
    orta.className = 'kart-orta';
    const cap = document.createElement('span');
    cap.className = 'kart-cap';
    cap.textContent = fmt(p.d0, 2) + ' → ' + fmt(p.d1, 2) + ' ';
    const birim = document.createElement('span');
    birim.className = 'birim';
    birim.textContent = 'mm';
    cap.appendChild(birim);

    const emniyetDegeri = bantSatiri ? bantSatiri.safety[1] : p.safety;
    const rozet = document.createElement('span');
    rozet.className = 'rozet-emniyet ' + safetyDurumu(emniyetDegeri);
    if (safetyDurumu(emniyetDegeri) !== 'ok') {
      rozet.appendChild(ikon(safetyDurumu(emniyetDegeri) === 'crit' ? 'kritik' : 'uyari'));
    }
    const rozetSayi = document.createElement('span');
    rozetSayi.textContent = bantSatiri
      ? fmt(bantSatiri.safety[0], 3) + ' – ' + fmt(bantSatiri.safety[1], 3)
      : fmt(p.safety, 3);
    rozet.appendChild(rozetSayi);
    const rozetDurum = document.createElement('span');
    rozetDurum.className = 'gorsel-gizli';
    rozetDurum.textContent = ' — ' + M.sutun.safety + ': ' + M.durum[safetyDurumu(emniyetDegeri)];
    rozet.appendChild(rozetDurum);
    orta.append(cap, rozet);

    // İkincil değerler: küçük, sessiz, iki sütun
    const liste = document.createElement('dl');
    liste.className = 'kart-ikincil';
    for (const anahtar of ikincilAlanlar) {
      const sutun = SUTUNLAR.find(c => c.k === anahtar);
      const bantAlani = { sigmaD: 'sigmaD', dT: 'dT', PkW: 'P' }[anahtar];
      const bant = bantSatiri && bantAlani ? bantSatiri[bantAlani] : null;
      const bolen = anahtar === 'PkW' ? 1000 : 1;
      const satir = document.createElement('div');
      const dt = document.createElement('dt');
      dt.textContent = M.sutun[anahtar] + (sutun.birim ? ' (' + sutun.birim + ')' : '');
      const dd = document.createElement('dd');
      dd.textContent = bant
        ? fmt(bant[0] / bolen, sutun.bas) + ' – ' + fmt(bant[1] / bolen, sutun.bas)
        : fmt(deger[anahtar], sutun.bas);
      const sinif = anahtar === 'delta' ? deltaDurumu(p.delta)
                  : anahtar === 'dT' ? dTDurumu(bant ? bant[1] : p.dT) : null;
      if (sinif) dd.className = sinif;
      satir.append(dt, dd);
      liste.appendChild(satir);
    }

    kart.append(ust, orta, liste);
    kart.addEventListener('click', (olay) => {
      if (olay.target.closest('label')) return;
      durum.secilenPas = p.no;
      durum.kalipAlpha = null;
      durum.kalipR = null;
      ciz();
    });
    kap.appendChild(kart);
  }
}

function tabloyuCiz(prog) {
  // Dar ekranda tablo yerine kartlar çizilir; ikisi aynı anda DOM'da bulunmaz.
  const dar = DAR_EKRAN.matches;
  $('pasTablosuKabi').hidden = dar;
  $('pasKartlari').hidden = !dar;
  if (dar) { $('tabloGovde').textContent = ''; kartlariCiz(prog); return; }
  $('pasKartlari').textContent = '';

  const govde = $('tabloGovde');
  govde.textContent = '';
  if (!prog) return;

  for (const p of prog.passes) {
    const tr = document.createElement('tr');
    if (p.anneal) tr.className = 'tavlandi';
    const deger = satirDegerleri(p);

    const bantSatiri = sonBant ? sonBant.paslar[p.no - 1] : null;
    for (const s of SUTUNLAR) {
      const td = document.createElement('td');

      // Bant açıkken belirsizliğe tabi büyüklükler aralık olarak yazılır.
      const bantAlani = { sigmaD: 'sigmaD', safety: 'safety', dT: 'dT', PkW: 'P' }[s.k];
      const bant = bantSatiri && bantAlani ? bantSatiri[bantAlani] : null;
      const bolen = s.k === 'PkW' ? 1000 : 1;
      const metin = bant
        ? fmt(bant[0] / bolen, s.bas) + ' – ' + fmt(bant[1] / bolen, s.bas)
        : fmt(deger[s.k], s.bas);

      // Eşik değerlendirmesi: bant açıkken kötümser taraf, yani üst uç kullanılır.
      const emniyetDegeri = bant && s.k === 'safety' ? bant[1] : p.safety;
      const dTDegeri = bant && s.k === 'dT' ? bant[1] : p.dT;
      const sinif = s.k === 'safety' ? safetyDurumu(emniyetDegeri)
                  : s.k === 'delta'  ? deltaDurumu(p.delta)
                  : s.k === 'dT'     ? dTDurumu(dTDegeri) : null;

      if (sinif) {
        td.className = sinif;
        // Adı `durum` OLMAMALI: global durum nesnesini gölgeler.
        const durumSarmali = document.createElement('span');
        durumSarmali.className = 'durum';
        // Renk tek başına bilgi taşımaz: uyarı/tehlike hücrelerinde simge ve
        // ekran okuyucu için durum metni de var.
        if (sinif !== 'ok') {
          const sim = ikon(sinif === 'crit' ? 'kritik' : 'uyari');
          sim.setAttribute('aria-hidden', 'true');
          durumSarmali.appendChild(sim);
        }
        const sayi = document.createElement('span');
        sayi.textContent = metin;
        durumSarmali.appendChild(sayi);
        const aciklama = durumMetni(s.k, s.k === 'safety' ? emniyetDegeri
                          : s.k === 'dT' ? dTDegeri : deger[s.k]);
        if (aciklama) {
          td.title = aciklama;
          const gizli = document.createElement('span');
          gizli.className = 'gorsel-gizli';
          gizli.textContent = ' — ' + aciklama;
          durumSarmali.appendChild(gizli);
        }
        td.appendChild(durumSarmali);
      } else {
        td.textContent = metin;
        if (s.k !== 'no' && s.k !== 'd1') td.className = 'ikincil';
      }
      tr.appendChild(td);
    }

    // Ara tavlama kutusu — işaretlenince o pastan sonra gerinim sıfırlanır.
    const td = document.createElement('td');
    const lab = document.createElement('label');
    lab.className = 'kutu';
    const kutu = document.createElement('input');
    kutu.type = 'checkbox';
    kutu.checked = taslak.anneals.includes(p.no);   // taslak: işaret HESAPLA'yı bekler
    kutu.setAttribute('aria-label', S().sutun.anneal + ' — ' + S().sutun.no + ' ' + p.no);
    // Satıra dokununca kalıp kesiti o pası gösterir.
    tr.addEventListener('click', (olay) => {
      if (olay.target.closest('label')) return;   // tavlama kutusu kendi işini yapsın
      durum.secilenPas = p.no;
      durum.kalipAlpha = null;
      durum.kalipR = null;
      ciz();
    });
    if (p.no === durum.secilenPas) tr.classList.add('secili');

    kutu.addEventListener('change', () => {
      taslak.anneals = kutu.checked
        ? taslak.anneals.concat(p.no).sort((a, b) => a - b)
        : taslak.anneals.filter(x => x !== p.no);
      girdiDegisti();
    });
    const gorsel = document.createElement('span');
    gorsel.className = 'gorsel';
    gorsel.appendChild(ikon('onay'));
    lab.append(kutu, gorsel);
    td.appendChild(lab);
    if (p.anneal) {
      const et = document.createElement('span');
      et.className = 'tavlama-etiketi';
      et.textContent = ' ' + S().tavlamaEtiketi;
      td.appendChild(et);
    }
    tr.appendChild(td);
    govde.appendChild(tr);
  }
}


/* ==== ÇİZİM ====
   Bütün görseller el yapımı inline SVG. Kütüphane yok.
   Tema kuralı: hiçbir şekle sabit renk yazılmaz. Renkler ya `currentColor` ile
   CSS sınıfından ya da doğrudan var(--...) ile gelir; böylece açık ve koyu temada
   ikisi de doğru okunur.
   Ölçek kuralı: viewBox genişliği kabın piksel genişliğine eşitlenir, yani 1 birim
   = 1 piksel. Yazı boyutu 11–13 px olarak yazıldığında dar ekranda da o boyutta
   görünür; küçülen tek şey etiket sayısıdır. */

const SVG_NS = 'http://www.w3.org/2000/svg';

function sv(etiket, ozellikler, sinif) {
  const el = document.createElementNS(SVG_NS, etiket);
  for (const k in ozellikler) {
    if (ozellikler[k] !== null && ozellikler[k] !== undefined) el.setAttribute(k, ozellikler[k]);
  }
  if (sinif) el.setAttribute('class', sinif);
  return el;
}

function svYazi(x, y, metin, sinif, hiza) {
  const t = sv('text', { x, y, 'text-anchor': hiza || 'middle' }, sinif || 'g-etiket');
  t.textContent = metin;
  return t;
}

/* Kabı boşaltıp yeni bir SVG kurar. Genişlik kabın kendi genişliğidir. */
function svgKur(kap, yukseklik, ariaEtiket) {
  kap.textContent = '';
  const genislik = Math.max(280, Math.round(kap.clientWidth || 320));
  const s = sv('svg', {
    viewBox: '0 0 ' + genislik + ' ' + yukseklik,
    role: 'img', 'aria-label': ariaEtiket   // boyut CSS'den: .g-svg { width:100%; height:auto }
  }, 'g-svg');
  kap.appendChild(s);
  return { s, g: genislik, y: yukseklik };
}

/* Dar ekranda etiketler çakışmasın diye kaç pasta bir etiket yazılacağını seçer. */
function etiketAdimi(adet, genislik, etiketGenisligi) {
  const sigacak = Math.max(2, Math.floor(genislik / etiketGenisligi));
  return Math.ceil(adet / sigacak);
}

/* ---- 4.1 Ana grafik: malzeme dayanımı ve çekme gerilmesi ---- */
function anaGrafikCiz(prog) {
  const M = S();
  const kap = $('gorselAna');
  if (!prog) { kap.textContent = ''; return; }

  const p = prog.passes;
  const enBuyuk = Math.max(...p.flatMap(x => [x.sigmaFOut, x.sigmaD]),
    ...(sonBant ? sonBant.paslar.map(x => x.sigmaD[1]) : []));
  const ust = Math.ceil(enBuyuk / 100) * 100;
  const { s, g, y } = svgKur(kap, 300, doldur(M.gorsel.anaAria, {
    n: p.length, sd0: fmt(p[0].sigmaD, 0), sd1: fmt(p[p.length - 1].sigmaD, 0),
    sf0: fmt(p[0].sigmaFOut, 0), sf1: fmt(p[p.length - 1].sigmaFOut, 0)
  }));

  // Üstte 34 px pay: en yüksek noktanın etiketi viewBox dışına taşmasın (V1).
  const sol = 52, sag = 12, ustBosluk = 34, alt = 34;
  const gx = (i) => sol + (g - sol - sag) * (p.length === 1 ? 0.5 : i / (p.length - 1));
  const gy = (v) => y - alt - (y - alt - ustBosluk) * (v / ust);

  // Y ekseni: 100 MPa'lık kademeler
  for (let v = 0; v <= ust; v += ust <= 400 ? 100 : 200) {
    s.appendChild(sv('line', { x1: sol, y1: gy(v), x2: g - sag, y2: gy(v) }, 'g-izgara'));
    s.appendChild(svYazi(sol - 8, gy(v) + 4, fmt(v, 0), 'g-etiket', 'end'));
  }
  s.appendChild(svYazi(sol - 8, ustBosluk - 6, 'MPa', 'g-eksen-adi', 'end'));

  // Emniyet payı: iki eğri arasındaki alan
  const alan = p.map((x, i) => gx(i) + ',' + gy(x.sigmaFOut)).join(' ') + ' ' +
               p.map((x, i) => gx(p.length - 1 - i) + ',' + gy(p[p.length - 1 - i].sigmaD)).join(' ');
  s.appendChild(sv('polygon', { points: alan }, 'g-pay'));

  // Belirsizlik bandı: çekme gerilmesi eğrisinin etrafındaki alan.
  if (sonBant) {
    const ustUc = p.map((x, i) => gx(i) + ',' + gy(Math.min(sonBant.paslar[i].sigmaD[1], ust)));
    const altUc = p.map((x, i) => gx(p.length - 1 - i) + ',' +
      gy(sonBant.paslar[p.length - 1 - i].sigmaD[0]));
    s.appendChild(sv('polygon', { points: ustUc.concat(altUc).join(' ') }, 'g-bant'));
  }

  const cizgi = (deger, sinif) =>
    sv('polyline', { points: p.map((x, i) => gx(i) + ',' + gy(deger(x))).join(' '), fill: 'none' }, sinif);
  s.appendChild(cizgi(x => x.sigmaFOut, 'g-dayanim'));
  s.appendChild(cizgi(x => x.sigmaD, 'g-gerilme'));

  // Tavlama: dikey kesikli çizgi
  for (const x of p.filter(x => x.anneal)) {
    const px = gx(x.no - 1);
    s.appendChild(sv('line', { x1: px, y1: ustBosluk, x2: px, y2: y - alt }, 'g-tavlama'));
    s.appendChild(svYazi(px, ustBosluk - 6, M.tavlamaEtiketi, 'g-tavlama-etiket'));
  }

  // X ekseni ve pas etiketleri
  s.appendChild(sv('line', { x1: sol, y1: y - alt, x2: g - sag, y2: y - alt }, 'g-eksen'));
  const adim = etiketAdimi(p.length, g - sol - sag, 34);
  p.forEach((x, i) => {
    if (i % adim === 0 || i === p.length - 1) {
      s.appendChild(svYazi(gx(i), y - alt + 16, fmt(x.no, 0), 'g-etiket'));
    }
  });
  s.appendChild(svYazi((sol + g - sag) / 2, y - 6, M.gorsel.eksenPas, 'g-eksen-adi'));

  // Gerçek değer taşıyan işaretler: ilk ve son noktalar
  const nokta = (i, deger, sinif) => {
    s.appendChild(sv('circle', { cx: gx(i), cy: gy(deger), r: 3 }, sinif));
  };
  const sonPas = p[p.length - 1];
  nokta(0, p[0].sigmaD, 'g-nokta-gerilme');
  nokta(p.length - 1, sonPas.sigmaD, 'g-nokta-gerilme');
  nokta(p.length - 1, sonPas.sigmaFOut, 'g-nokta-dayanim');

  // Eğriler doğrudan etiketlenir; efsane kutusu yok (V2).
  // Etiketler eğrinin altına, taralı alanın içine yazılır: eğriyle çakışmaz.
  const dayanimY = gy(sonPas.sigmaFOut) + 28;
  s.appendChild(svYazi(g - sag, dayanimY, fmt(sonPas.sigmaFOut, 0) + ' MPa', 'g-deger', 'end'));
  s.appendChild(svYazi(g - sag, dayanimY + 13, M.gorsel.dayanim, 'g-etiket', 'end'));

  const gerilmeY = gy(sonPas.sigmaD) + 16;
  s.appendChild(svYazi(g - sag, gerilmeY, fmt(sonPas.sigmaD, 0) + ' MPa', 'g-deger-vurgu', 'end'));
  s.appendChild(svYazi(g - sag, gerilmeY + 13, M.gorsel.gerilme, 'g-etiket', 'end'));

  // Taralı alanın ne olduğu alanın içinde yazar.
  const ortaIndeks = Math.floor(p.length * 0.35);
  const ortaPas = p[ortaIndeks];
  s.appendChild(svYazi(gx(ortaIndeks), (gy(ortaPas.sigmaFOut) + gy(ortaPas.sigmaD)) / 2 + 4,
    M.gorsel.pay, 'g-etiket'));
}

/* Grafik altındaki renk açıklaması (legend) — metinli, yalnızca renkle anlatmaz. */
function aciklamaYaz(kap, ogeler) {
  kap.textContent = '';
  for (const o of ogeler) {
    const el = document.createElement('span');
    el.className = 'g-orn';
    const kutu = document.createElement('span');
    kutu.className = 'g-orn-kutu ' + o.sinif;
    const metin = document.createElement('span');
    metin.textContent = o.metin;
    el.append(kutu, metin);
    kap.appendChild(el);
  }
}

/* ---- 4.2 Emniyet oranı bar grafiği ---- */
function emniyetGrafigiCiz(prog) {
  const M = S();
  const kap = $('gorselEmniyet');
  if (!prog) { kap.textContent = ''; return; }

  const p = prog.passes;
  const riskli = p.reduce((a, b) => (b.safety > a.safety ? b : a));
  // En riskli barı yalnızca ikinciden anlamlı ölçüde yüksekse vurgula (V3):
  // eşit emniyet yönteminde bütün paslar tanım gereği eşittir, orada vurgu gürültüdür.
  const vurgulanacak = belirginTepe(p) ? riskli.no : null;
  const ust = Math.max(0.7, Math.ceil(Math.max(...p.map(x => x.safety)) * 10) / 10 + 0.05);
  const { s, g, y } = svgKur(kap, 250, doldur(M.gorsel.emniyetAria, {
    n: p.length, en: fmt(riskli.safety, 3), pas: riskli.no
  }));

  const sol = 44, sag = 12, ustBosluk = 16, alt = 34;
  const genislik = g - sol - sag;
  const gy = (v) => y - alt - (y - alt - ustBosluk) * (v / ust);
  const barGenislik = Math.max(3, Math.min(28, genislik / p.length - 3));

  for (let v = 0; v <= ust; v += 0.2) {
    s.appendChild(sv('line', { x1: sol, y1: gy(v), x2: g - sag, y2: gy(v) }, 'g-izgara'));
    s.appendChild(svYazi(sol - 8, gy(v) + 4, fmt(v, 1), 'g-etiket', 'end'));
  }

  p.forEach((x, i) => {
    const merkez = sol + genislik * ((i + 0.5) / p.length);
    const sinif = 'g-bar-' + safetyDurumu(x.safety) + (x.no === vurgulanacak ? ' g-bar-vurgu' : '');
    s.appendChild(sv('rect', {
      x: merkez - barGenislik / 2, y: gy(x.safety),
      width: barGenislik, height: (y - alt) - gy(x.safety)
    }, sinif));
  });

  // Eşik çizgileri: 0,60 kritik, 0,50 uyarı
  const esik = (v, sinif, etiket) => {
    s.appendChild(sv('line', { x1: sol, y1: gy(v), x2: g - sag, y2: gy(v) }, sinif));
    s.appendChild(svYazi(g - sag, gy(v) - 5, etiket, sinif + '-etiket', 'end'));
  };
  esik(SAFETY_CRITICAL, 'g-esik-crit', fmt(SAFETY_CRITICAL, 2));
  esik(SAFETY_WARNING, 'g-esik-warn', fmt(SAFETY_WARNING, 2));

  s.appendChild(sv('line', { x1: sol, y1: y - alt, x2: g - sag, y2: y - alt }, 'g-eksen'));
  const adim = etiketAdimi(p.length, genislik, 34);
  p.forEach((x, i) => {
    if (i % adim === 0 || i === p.length - 1) {
      s.appendChild(svYazi(sol + genislik * ((i + 0.5) / p.length), y - alt + 16, fmt(x.no, 0), 'g-etiket'));
    }
  });
  s.appendChild(svYazi((sol + g - sag) / 2, y - 6, M.gorsel.eksenPas, 'g-eksen-adi'));

  aciklamaYaz($('gorselEmniyetAciklama'), [
    { sinif: 'g-orn-crit', metin: M.durum.crit + ' (> ' + fmt(SAFETY_CRITICAL, 2) + ')' },
    { sinif: 'g-orn-warn', metin: M.durum.warn + ' (> ' + fmt(SAFETY_WARNING, 2) + ')' },
    { sinif: 'g-orn-ok', metin: M.durum.ok }
  ]);
}

/* ---- 4.3 Çap profili ---- */
function capProfiliCiz(prog) {
  const M = S();
  const kap = $('gorselProfil');
  if (!prog) { kap.textContent = ''; return; }

  const p = prog.passes;
  const caplar = [p[0].d0].concat(p.map(x => x.d1));
  const enBuyuk = caplar[0];
  const { s, g, y } = svgKur(kap, 230, doldur(M.gorsel.profilAria, {
    d0: fmt(caplar[0], 2), d1: fmt(caplar[caplar.length - 1], 2), n: p.length
  }));

  const sol = 44, sag = 44, ustBosluk = 24, alt = 34;
  const merkez = (ustBosluk + (y - alt)) / 2;
  const yariYukseklik = (y - alt - ustBosluk) / 2;
  const gx = (i) => sol + (g - sol - sag) * (i / (caplar.length - 1));
  const gr = (d) => yariYukseklik * (d / enBuyuk);

  // Basamaklı profil (V4): tel bir pas boyunca sabit çapta ilerler, kalıpta düşer.
  // Böylece hangi pasta ne kadar inceldiği görünür; eşit gerinim ile kademeli
  // azalan gözle ayırt edilebilir.
  const ustKenar = [], altKenar = [];
  for (let i = 0; i < caplar.length - 1; i++) {
    ustKenar.push(gx(i) + ',' + (merkez - gr(caplar[i])), gx(i + 1) + ',' + (merkez - gr(caplar[i])));
    ustKenar.push(gx(i + 1) + ',' + (merkez - gr(caplar[i + 1])));
    altKenar.push(gx(i) + ',' + (merkez + gr(caplar[i])), gx(i + 1) + ',' + (merkez + gr(caplar[i])));
    altKenar.push(gx(i + 1) + ',' + (merkez + gr(caplar[i + 1])));
  }
  s.appendChild(sv('polygon', { points: ustKenar.concat(altKenar.slice().reverse()).join(' ') }, 'g-profil'));
  s.appendChild(sv('polyline', { points: ustKenar.join(' '), fill: 'none' }, 'g-profil-kenar'));
  s.appendChild(sv('polyline', { points: altKenar.join(' '), fill: 'none' }, 'g-profil-kenar'));
  s.appendChild(sv('line', { x1: sol, y1: merkez, x2: g - sag, y2: merkez }, 'g-merkez'));

  // Kalıp konumları ve pas numaraları
  const adimP = etiketAdimi(p.length, g - sol - sag, 34);
  for (let i = 1; i < caplar.length; i++) {
    const px = gx(i);
    s.appendChild(sv('line', { x1: px, y1: merkez - gr(caplar[i]) - 4, x2: px, y2: merkez + gr(caplar[i]) + 4 },
      'g-profil-kalip'));
    if ((i - 1) % adimP === 0 || i === caplar.length - 1) {
      s.appendChild(svYazi(px, y - alt + 16, fmt(i, 0), 'g-etiket'));
    }
  }

  // Tavlama noktaları
  for (const x of p.filter(x => x.anneal)) {
    const px = gx(x.no);
    s.appendChild(sv('line', { x1: px, y1: merkez - yariYukseklik, x2: px, y2: merkez + yariYukseklik }, 'g-tavlama'));
    s.appendChild(svYazi(px, merkez - yariYukseklik - 6, M.tavlamaEtiketi, 'g-tavlama-etiket'));
  }

  s.appendChild(svYazi(sol, merkez - gr(caplar[0]) - 8, fmt(caplar[0], 2) + ' mm', 'g-deger', 'start'));
  s.appendChild(svYazi(g - sag, merkez - gr(caplar[caplar.length - 1]) - 8,
    fmt(caplar[caplar.length - 1], 2) + ' mm', 'g-deger-vurgu', 'end'));
  s.appendChild(svYazi((sol + g - sag) / 2, y - 6, M.gorsel.eksenPas, 'g-eksen-adi'));
}

/* ---- 4.4 Canlı kalıp kesiti ----
   Seçili pasın kalıbı. α ve r kaydırıcıları yalnızca bu görseli değiştirir:
   program etkilenmez, amaç geometrinin sezgisini vermek. */
/* Parametre adı `g` OLAMAZ: svgKur'un döndürdüğü genişlik değişkeniyle çakışır. */
function kalipKesitiCiz(gorunum) {
  const M = S();
  const kap = $('gorselKalip');
  // Program yoksa kesitin yanındaki etiketler de boşalır: kaydırıcı değerleri,
  // pas etiketi ve özet cümlesi bir önceki hesaptan kalmaz.
  if (!gorunum) {
    kap.textContent = '';
    $('kalipOzet').textContent = '';
    $('kalipPasEtiketi').textContent = '';
    $('kalipAlphaDeger').textContent = '';
    $('kalipRDeger').textContent = '';
    $('kalipAlpha').disabled = true;
    $('kalipR').disabled = true;
    return;
  }
  $('kalipAlpha').disabled = false;
  $('kalipR').disabled = false;

  // Varsayılan: 1. pas — hem hattın başı hem de görünür bir çap değişimi (V5).
  const secili = gorunum.secilenPas;

  const alpha = durum.kalipAlpha === null ? secili.alphaDeg : durum.kalipAlpha;
  const r = durum.kalipR === null ? secili.r : durum.kalipR;
  const d0 = secili.d0;
  const d1 = d0 * Math.sqrt(1 - r);

  // Kaydırıcılar ve başlık
  kalipKontrolleriYaz(secili, alpha, r);

  let hesap = null;
  try {
    hesap = calcPass({ d0, d1, epsIn: secili.epsIn, alphaDeg: alpha, mu: durum.mu,
                       K: durum.K, n: durum.n, v0: secili.v0 });
  } catch (err) { /* r teorik sınırı aşarsa kuvvet yazılmaz, şekil yine çizilir */ }

  const { s, g, y } = svgKur(kap, 280, doldur(M.gorsel.kalipAria, {
    pas: secili.no, d0: fmt(d0, 2), d1: fmt(d1, 2), alpha: fmt(alpha, 1)
  }));

  // Çizim alanı: kenarlarda ölçü çizgileri ve etiketler için pay bırakılır.
  const solKenar = 64, sagKenar = 64;
  const merkez = y * 0.46;
  const kullanilir = g - solKenar - sagKenar;

  // d0 çizimde en fazla bu yarıçapa otursun; kalıp gövdesi üstte kalan yere sığar.
  // Şematik ölçek (V5): gerçek oranda %20'lik bir kesit azalması ekranda
  // görünmez (çapta yalnızca %10). Çap oranı görünürlük için abartılır;
  // gerçek değerler etiketlerde verilir ve altına şematik olduğu yazılır.
  const enBuyukYariCap = Math.min(y * 0.17, 54);
  const r0 = enBuyukYariCap;
  const r1 = r0 * Math.pow(1 - r, 1.6);

  // Koni boyu açıdan gelir; çizim alanına sığmazsa kısaltılır (şekil orantısı korunur).
  const koniBoyHam = (r0 - r1) / Math.tan(alpha * Math.PI / 180);
  const koniBoy = Math.min(koniBoyHam, kullanilir * 0.42);
  const konikBaslangic = solKenar + kullanilir * 0.30;
  const konikBitis = konikBaslangic + koniBoy;
  const tasimaBoyu = Math.max(10, r1 * 0.8);
  const kalipSonu = konikBitis + tasimaBoyu + kullanilir * 0.06;
  const kalipAgzi = konikBaslangic - kullanilir * 0.12;
  const kalipKalinligi = Math.min(58, merkez - enBuyukYariCap - 26);
  const telSol = solKenar, telSag = g - sagKenar;

  // Tel: giriş kalın, koni boyunca incelir, çıkış ince
  const tel = [
    [telSol, merkez - r0], [konikBaslangic, merkez - r0], [konikBitis, merkez - r1],
    [telSag, merkez - r1], [telSag, merkez + r1], [konikBitis, merkez + r1],
    [konikBaslangic, merkez + r0], [telSol, merkez + r0]
  ].map(k => k[0].toFixed(1) + ',' + k[1].toFixed(1)).join(' ');
  s.appendChild(sv('polygon', { points: tel }, 'g-tel'));

  // Kalıp gövdesi: üst ve alt yarı. İç sınır koni ağzını ve taşıma bölgesini izler.
  const govde = (isaret) => [
    [kalipAgzi, merkez + isaret * (r0 + kalipKalinligi)],
    [kalipSonu, merkez + isaret * (r0 + kalipKalinligi)],
    [kalipSonu, merkez + isaret * r1],
    [konikBitis, merkez + isaret * r1],
    [konikBaslangic, merkez + isaret * r0],
    [kalipAgzi, merkez + isaret * r0]
  ].map(k => k[0].toFixed(1) + ',' + k[1].toFixed(1)).join(' ');
  s.appendChild(sv('polygon', { points: govde(-1) }, 'g-kalip'));
  s.appendChild(sv('polygon', { points: govde(1) }, 'g-kalip'));
  s.appendChild(sv('line', { x1: telSol, y1: merkez, x2: telSag, y2: merkez }, 'g-merkez'));

  // α açısı: koni ağzından yatay referans, üstünde yay ve etiket
  const ax = konikBaslangic, ay = merkez - r0;
  const yayR = Math.max(22, Math.min(48, koniBoy * 0.8));
  const aciRad = Math.atan2(r0 - r1, koniBoy);
  s.appendChild(sv('line', { x1: ax, y1: ay, x2: ax + yayR + 18, y2: ay }, 'g-olcu-ince'));
  s.appendChild(sv('path', {
    d: 'M ' + (ax + yayR).toFixed(1) + ' ' + ay.toFixed(1) +
       ' A ' + yayR.toFixed(1) + ' ' + yayR.toFixed(1) + ' 0 0 1 ' +
       (ax + yayR * Math.cos(aciRad)).toFixed(1) + ' ' + (ay + yayR * Math.sin(aciRad)).toFixed(1),
    fill: 'none'
  }, 'g-aci'));
  s.appendChild(svYazi(ax + yayR + 22, ay - 10, 'α = ' + fmt(alpha, 1) + '°', 'g-deger', 'start'));

  // d0 ve d1 ölçü çizgileri — kenar payının içinde
  const olcu = (x, ust, altNokta, etiket, saga) => {
    s.appendChild(sv('line', { x1: x, y1: ust, x2: x, y2: altNokta }, 'g-olcu'));
    s.appendChild(sv('line', { x1: x - 5, y1: ust, x2: x + 5, y2: ust }, 'g-olcu'));
    s.appendChild(sv('line', { x1: x - 5, y1: altNokta, x2: x + 5, y2: altNokta }, 'g-olcu'));
    s.appendChild(svYazi(x, altNokta + 16, etiket, 'g-deger', 'middle'));
  };
  olcu(telSol - 18, merkez - r0, merkez + r0, fmt(d0, 2) + ' mm', false);
  olcu(telSag + 18, merkez - r1, merkez + r1, fmt(d1, 2) + ' mm', true);

  // F kuvvet oku ve notu — çıkan telin üstünde
  if (hesap) {
    const okY = merkez - r1 - 24;
    const okBas = kalipSonu + 10, okSon = telSag - 4;
    // Dar çizimde ok kısalır ama kuvvet değeri ve notu her zaman görünür.
    if (okSon - okBas > 14) {
      s.appendChild(sv('line', { x1: okBas, y1: okY, x2: okSon, y2: okY }, 'g-ok'));
      s.appendChild(sv('polyline', {
        points: (okSon - 7) + ',' + (okY - 4) + ' ' + okSon + ',' + okY + ' ' + (okSon - 7) + ',' + (okY + 4),
        fill: 'none'
      }, 'g-ok'));
    }
    s.appendChild(svYazi(Math.min(telSag, (okBas + okSon) / 2 + 10), okY - 8,
      'F = ' + fmt(hesap.F / 1000, 2) + ' kN', 'g-deger-vurgu'));
    s.appendChild(svYazi((kalipSonu + telSag) / 2, merkez + r1 + 22, M.gorsel.kalipNot, 'g-not'));
  }

  $('kalipOzet').textContent = doldur(M.gorsel.kalipOzet, {
    pas: secili.no, r: fmt(r * 100, 2),
    emniyet: hesap ? fmt(hesap.safety, 3) : '—',
    delta: hesap ? fmt(hesap.delta, 2) : '—'
  });
}

/* Kalıp kesiti kaydırıcıları. Ray dolgusu --dolgu değişkeniyle boyanır. */
function kalipKontrolleriYaz(secili, alpha, r) {
  const M = S();
  const a = $('kalipAlpha'), rr = $('kalipR');
  if (document.activeElement !== a) a.value = alpha;
  if (document.activeElement !== rr) rr.value = (r * 100).toFixed(1);
  a.style.setProperty('--dolgu', ((alpha - 2) / (16 - 2) * 100) + '%');
  rr.style.setProperty('--dolgu', ((r * 100 - 2) / (60 - 2) * 100) + '%');
  $('kalipAlphaDeger').textContent = fmt(alpha, 1) + '°';
  $('kalipRDeger').textContent = '%' + fmt(r * 100, 1);
  $('kalipPasEtiketi').textContent = doldur(M.gorsel.kalipPas, { pas: secili.no });
}

/* Bütün görselleri çizer. Kaydırma/yeniden boyutlamada tekrar çağrılır. */
